name: Capability register binding gate
description: >-
  Runs the capability-register binding suite with the PR/push/dispatch
  freshness policy. Merge-queue runs validate integration, not register
  freshness: staleness gates PRs and direct pushes that touch the register
  or cited sources, every manual dispatch (an explicit validation request
  with no change set to scope it), plus the scheduled freshness workflow —
  never unrelated queued changes.

runs:
  using: composite
  steps:
    - name: Test capability register binding
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        # No github.sha fallback: a dispatch must validate, not diff the ref
        # against itself and skip.
        BACI_REGISTER_REQUIRE_FRESH: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '1' || '' }}
      run: python3 vps-workers/baci-editorial-context/capability_gate.py
