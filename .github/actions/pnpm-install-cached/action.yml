name: pnpm install with incremental cache
description: Restore and save pnpm dependency and Turborepo caches with PR security boundaries.

inputs:
  allow-self-hosted-cache-save:
    description: 'Allow the trusted deployment runner to save the shared pnpm cache'
    required: false
    default: 'false'
  store-dir:
    description: 'Base path for pnpm store; pnpm appends its current store version'
    required: false
    # Keep the default workspace-relative so actions/cache archives checkout-local paths.
    default: .pnpm-store
  install-command:
    description: 'Custom command to execute dependencies installation'
    required: false
    default: './.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile --prefer-offline'

runs:
  using: composite
  steps:
    - name: Clean old pnpm setup directories
      shell: bash
      env:
        PNPM_SETUP_ROOT: ${{ runner.temp }}
      run: |
        # Keep active and recently completed jobs safe; release jobs time out well before 6 hours.
        find "$PNPM_SETUP_ROOT" \
          -mindepth 1 \
          -maxdepth 1 \
          -type d \
          -name 'setup-pnpm-*' \
          -mmin +360 \
          -exec rm -rf {} + 2>/dev/null || true

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    - name: Install pnpm
      id: setup_pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        dest: ${{ runner.temp }}/setup-pnpm-install-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

    # Strict split caching for pnpm content-addressable store
    # The persistent private CI runner keeps its pnpm store outside the workspace.
    # `git clean` at checkout deletes a workspace-relative store, which forced every
    # job to download an ~850 MB cache at ~3 MB/s (about 5 minutes) before installing.
    # Only the two named contabo-baci-ci runners qualify: an exact allowlist, because runner labels are
    # not available inside a composite action (register a new CI runner here too, or it just uses the
    # slower GitHub cache path). Each runner gets its own store directory named after the runner
    # (pnpm-store-<runner name> under its tool cache), so two runners never share or prune one store,
    # whatever the server layout. The deploy runner shares the production
    # server (tight disk) and runs these installs rarely, so it keeps the GitHub cache path.
    # The cache save below never runs for a persistent store (it would archive the wrong path).
    - id: pnpm-store
      name: Select pnpm store directory
      shell: bash
      env:
        STORE_DIR: ${{ inputs.store-dir }}
        PERSISTENT_RUNNER: ${{ runner.environment == 'self-hosted' && contains(fromJSON('["contabo-baci-ci","contabo-baci-ci-2"]'), runner.name) }}
        TOOL_CACHE: ${{ runner.tool_cache }}
      run: |
        set -euo pipefail
        persistent=false
        dir="$STORE_DIR"
        if [ "$PERSISTENT_RUNNER" = 'true' ] && [ "$STORE_DIR" = '.pnpm-store' ]; then
          persistent=true
          # runner.tool_cache is always set by the runner; refuse a missing, empty or relative value instead of
          # creating a store at the filesystem root or inside the checkout.
          case "${TOOL_CACHE:-}" in
            /*) ;;
            *)
              echo "::error::the runner tool cache must be an absolute path (got '${TOOL_CACHE:-}')"
              exit 1
              ;;
          esac
          # RUNNER_NAME is a default variable the runner sets for every job; the allowlist above makes it path-safe.
          dir="$TOOL_CACHE/pnpm-store-${RUNNER_NAME:?}"
          # A store inside the checkout would be wiped by `git clean`, which is the problem this avoids.
          if [ -n "${GITHUB_WORKSPACE:-}" ]; then
            case "$dir" in
              "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*)
                echo "::error::the persistent pnpm store must live outside the workspace (got $dir)"
                exit 1
                ;;
            esac
          fi
          mkdir -p "$dir"
        fi
        echo "persistent=$persistent" >> "$GITHUB_OUTPUT"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - id: pnpm-store-cache
      name: Restore pnpm store cache
      if: steps.pnpm-store.outputs.persistent != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.store-dir }}
        key: v2-${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          v2-${{ runner.os }}-${{ runner.arch }}-pnpm-store-

    - name: Configure pnpm store directory
      shell: bash
      env:
        PNPM_BIN_DIR: ${{ steps.setup_pnpm.outputs.bin_dest }}
        STORE_DIR: ${{ steps.pnpm-store.outputs.dir }}
      run: |
        set -euo pipefail

        PNPM_CMD=""

        if command -v pnpm >/dev/null 2>&1 && pnpm --version >/dev/null 2>&1; then
          PNPM_CMD="$(command -v pnpm)"
        elif [ -n "${PNPM_BIN_DIR:-}" ] &&
          [ -x "$PNPM_BIN_DIR/pnpm" ] &&
          "$PNPM_BIN_DIR/pnpm" --version >/dev/null 2>&1; then
          PNPM_CMD="$PNPM_BIN_DIR/pnpm"
        else
          echo "::warning::pnpm/action-setup did not expose a runnable pnpm; falling back to Corepack"
          NODE_BIN_DIR="$(dirname "$(command -v node)")"
          corepack enable pnpm
          package_manager="$(node -p "require('./package.json').packageManager || ''")"
          if [[ "$package_manager" == pnpm@* ]]; then
            corepack prepare "$package_manager" --activate
          fi
          export PATH="$NODE_BIN_DIR:$PATH"
          PNPM_CMD="$NODE_BIN_DIR/pnpm"
          if [ ! -x "$PNPM_CMD" ]; then
            PNPM_CMD="$(command -v pnpm)"
          fi
          "$PNPM_CMD" --version >/dev/null
        fi

        PNPM_CMD_DIR="$(dirname "$PNPM_CMD")"
        echo "$PNPM_CMD_DIR" >> "$GITHUB_PATH"
        export PATH="$PNPM_CMD_DIR:$PATH"

        "$PNPM_CMD" config set store-dir "$STORE_DIR"
        "$PNPM_CMD" --version
        delimiter="EOF-$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        {
          echo "PNPM_STORE_DIR<<${delimiter}"
          echo "$STORE_DIR"
          echo "${delimiter}"
        } >> "$GITHUB_ENV"

    # Safety valve for the persistent store: it is content-addressed so stale entries are harmless, but
    # nothing else ever shrinks it. Past the limit, drop unreferenced packages (the next install refills).
    - name: Prune an oversized persistent pnpm store
      if: steps.pnpm-store.outputs.persistent == 'true'
      shell: bash
      env:
        STORE_DIR: ${{ steps.pnpm-store.outputs.dir }}
        MAX_STORE_KB: '16777216'
      run: |
        set -euo pipefail
        size_kb="$(du -sk "$STORE_DIR" 2>/dev/null | cut -f1 || true)"
        if [ -z "$size_kb" ]; then
          echo "::warning::could not measure the pnpm store at $STORE_DIR; skipping the size check"
          exit 0
        fi
        if [ "$size_kb" -gt "$MAX_STORE_KB" ]; then
          echo "pnpm store is ${size_kb} KB (limit ${MAX_STORE_KB} KB); pruning unreferenced packages"
          # Name the store explicitly so the prune hits the directory measured above, and never fail the job
          # over housekeeping: the next install still works, and the warning shows up in the run summary.
          pnpm store prune --store-dir "$STORE_DIR" || echo "::warning::pnpm store prune failed; continuing without pruning"
        fi

    - name: Install Dependencies
      shell: bash
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
        # CI jobs use system/tool-provided browsers when needed; avoid
        # Puppeteer's install-time Chrome downloads on shared runners.
        PUPPETEER_SKIP_DOWNLOAD: 'true'
        PUPPETEER_CHROME_SKIP_DOWNLOAD: 'true'
        PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: 'true'
        PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
      run: |
        set -euo pipefail
        case "$INSTALL_COMMAND" in
          './.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile --prefer-offline' | \
          '.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile --prefer-offline')
            ./.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile --prefer-offline
            ;;
          './.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile' | \
          '.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile')
            ./.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile
            ;;
          './trusted-ops/.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile --prefer-offline' | \
          'trusted-ops/.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile --prefer-offline')
            ./trusted-ops/.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile --prefer-offline
            ;;
          'pnpm install --frozen-lockfile --prefer-offline')
            pnpm install --frozen-lockfile --prefer-offline
            ;;
          'pnpm install --frozen-lockfile')
            pnpm install --frozen-lockfile
            ;;
          'pnpm install')
            pnpm install
            ;;
          *)
            echo "::error::Unsupported install-command: $INSTALL_COMMAND" >&2
            exit 1
            ;;
        esac

    # Cache Save Engine: PR branches are strictly RESTORE-ONLY to prevent cache poisoning & save storage limit (10GB)
    - name: Save pnpm store cache (main branch only)
      if: >
        steps.pnpm-store.outputs.persistent != 'true' &&
        (runner.environment == 'github-hosted' || inputs.allow-self-hosted-cache-save == 'true') &&
        github.ref == 'refs/heads/main' &&
        github.event_name == 'push' &&
        steps.pnpm-store-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.store-dir }}
        key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}
