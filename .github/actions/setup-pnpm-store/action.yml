name: Setup pnpm store
description: Configure the pnpm store directory with optional reset.

inputs:
  store-dir:
    description: Absolute path to the pnpm store directory.
    required: true
  reset:
    description: Whether to remove the store directory before configuring pnpm.
    required: false
    default: 'false'
  pnpm-bin-dir:
    description: Directory containing the pnpm executable, typically pnpm/action-setup's bin_dest output.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Export PNPM_STORE_DIR
      shell: bash
      env:
        STORE_DIR: ${{ inputs.store-dir }}
      run: |
        delimiter="EOF-$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        {
          echo "PNPM_STORE_DIR<<${delimiter}"
          echo "$STORE_DIR"
          echo "${delimiter}"
        } >> "$GITHUB_ENV"

    - name: Reset pnpm store directory
      if: ${{ inputs.reset == 'true' }}
      shell: bash
      env:
        STORE_DIR: ${{ inputs.store-dir }}
      run: rm -rf -- "$STORE_DIR" || true

    - name: Configure pnpm store directory
      shell: bash
      env:
        STORE_DIR: ${{ inputs.store-dir }}
        PNPM_BIN_DIR: ${{ inputs.pnpm-bin-dir }}
      run: |
        set -euo pipefail

        PNPM_CMD=""
        if [ -n "${PNPM_BIN_DIR:-}" ] &&
          [ -x "$PNPM_BIN_DIR/pnpm" ] &&
          "$PNPM_BIN_DIR/pnpm" --version >/dev/null 2>&1; then
          PNPM_CMD="$PNPM_BIN_DIR/pnpm"
        elif command -v pnpm >/dev/null 2>&1 && pnpm --version >/dev/null 2>&1; then
          PNPM_CMD="$(command -v pnpm)"
        else
          echo "::warning::No runnable pnpm shim found; falling back to Corepack"
          NODE_BIN_DIR="$(dirname "$(command -v node)")"
          corepack enable pnpm
          package_manager="$(node -p "require('./package.json').packageManager || ''")"
          if [[ "$package_manager" == pnpm@* ]]; then
            corepack prepare "$package_manager" --activate
          fi
          export PATH="$NODE_BIN_DIR:$PATH"
          PNPM_CMD="$NODE_BIN_DIR/pnpm"
          if [ ! -x "$PNPM_CMD" ]; then
            PNPM_CMD="$(command -v pnpm)"
          fi
          "$PNPM_CMD" --version >/dev/null
        fi

        PNPM_CMD_DIR="$(dirname "$PNPM_CMD")"
        echo "$PNPM_CMD_DIR" >> "$GITHUB_PATH"
        export PATH="$PNPM_CMD_DIR:$PATH"

        "$PNPM_CMD" config set store-dir "$STORE_DIR"
        "$PNPM_CMD" --version
