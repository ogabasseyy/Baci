name: Storefront release helper tests
description: Run the platform release helper regression scripts.

runs:
  using: composite
  steps:
    - shell: bash
      run: bash .github/scripts/android-storefront-release.test.sh
    - shell: bash
      run: node .github/scripts/android-native-library-check.test.mjs
    - shell: bash
      run: bash .github/scripts/ios-storefront-release.test.sh
