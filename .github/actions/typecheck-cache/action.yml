name: TypeScript compiler state cache
description: Reuse compiler graphs from successful main CI without caching a passing check.

inputs:
  mode:
    description: Restore before typechecking or save after successful main-branch checks.
    default: restore
    required: false

runs:
  using: composite
  steps:
    - name: Validate compiler cache mode
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
      run: |
        case "$CACHE_MODE" in
          restore|save) ;;
          *) echo '::error::Invalid compiler cache mode'; exit 1 ;;
        esac

    - name: Find compatible compiler state from successful main CI
      id: source
      if: inputs.mode == 'restore'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_HOST: github.com
        TYPECHECK_ARTIFACT_NAME: compiler-state-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/web/tsconfig*.json') }}
      run: node .github/scripts/find-trusted-typecheck-state.mjs

    - name: Restore compiler graphs
      id: restore
      if: inputs.mode == 'restore' && steps.source.outputs.artifact-id != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.source.outputs.artifact-id }}
        run-id: ${{ steps.source.outputs.run-id }}
        github-token: ${{ github.token }}
        path: apps/web
        merge-multiple: true

    # PRs, dispatches and merge groups never publish compiler state. Artifact
    # lookup above validates the source run and artifact provenance explicitly.
    - name: Save compiler graphs from successful main checks
      id: save
      if: inputs.mode == 'save' && success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: compiler-state-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/web/tsconfig*.json') }}
        path: apps/web/*.tsbuildinfo
        if-no-files-found: ignore
        retention-days: 3
