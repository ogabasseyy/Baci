name: Verify iOS native patch contracts
description: Run Expo JSI symbol, RuntimeScheduler, and ExpoModulesCore patch contract node tests.

runs:
  using: composite
  steps:
    - shell: bash
      run: >-
        pnpm exec node --test
        .github/scripts/verify-ios-expo-jsi-symbols.test.mjs
        .github/scripts/ios-runtime-scheduler.test.mjs
        .github/scripts/verify-ios-expo-core-patch.test.mjs
