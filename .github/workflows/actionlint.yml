name: Actionlint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yml"
      - ".github/actionlint.yaml"
      - ".github/scripts/vps-build-resource-queue.test.mjs"
      - ".github/scripts/refuse-superseded-android-build.sh"
      - ".github/scripts/production-typecheck-scope.test.mjs"
      - "apps/web/next.config.ts"
      - "apps/web/tsconfig*.json"
      - "apps/web/package.json"
      - "apps/web/src/config/build-typecheck.ts"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yml"
      - ".github/actionlint.yaml"
      - ".github/scripts/vps-build-resource-queue.test.mjs"
      - ".github/scripts/refuse-superseded-android-build.sh"
      - ".github/scripts/production-typecheck-scope.test.mjs"
      - "apps/web/next.config.ts"
      - "apps/web/tsconfig*.json"
      - "apps/web/package.json"
      - "apps/web/src/config/build-typecheck.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for deprecated runner labels
        run: |
          # Fail if any workflow uses the retired baci-vps runner label.
          # New runners use the current dedicated labels.
          deprecated_runner_label_found=0
          while IFS= read -r workflow; do
            if ! awk '
              function indentation(line) {
                match(line, /^[[:space:]]*/)
                return RLENGTH
              }
              function is_retired_label(value) {
                return value ~ /^[[:space:]]*[\047"]?baci-vps[\047"]?[[:space:]]*(#.*)?$/
              }
              function contains_retired_label(value) {
                return value ~ /(^|[\[,:[:space:]])[\047"]?baci-vps[\047"]?([,\]#[:space:]]|$)/
              }
              {
                line = $0
                indent = indentation(line)
                if (in_runs_on) {
                  if (line !~ /^[[:space:]]*($|#)/ && indent <= runs_on_indent) {
                    in_runs_on = 0
                  } else if (indent > runs_on_indent && line ~ /^[[:space:]]*-[[:space:]]*/) {
                    value = line
                    sub(/^[[:space:]]*-[[:space:]]*/, "", value)
                    if (is_retired_label(value)) {
                      print FILENAME ":" FNR ":" line
                      found = 1
                    }
                  }
                }
                if (line ~ /^[[:space:]]*runs-on:[[:space:]]*/) {
                  runs_on_indent = indent
                  value = line
                  sub(/^[[:space:]]*runs-on:[[:space:]]*/, "", value)
                  if (value ~ /^($|#)/) {
                    in_runs_on = 1
                  } else {
                    in_runs_on = 0
                    sub(/[[:space:]]+#.*/, "", value)
                    if (contains_retired_label(value)) {
                      print FILENAME ":" FNR ":" line
                      found = 1
                    }
                  }
                }
              }
              END { exit found ? 1 : 0 }
            ' "$workflow"; then
              deprecated_runner_label_found=1
            fi
          done < <(find .github/workflows -type f \
            \( -name '*.yml' -o -name '*.yaml' \) ! -name 'actionlint.yml')
          if ((deprecated_runner_label_found)); then
            echo "::error::Deprecated runner label 'baci-vps' found. Use a current dedicated runner label instead."
            exit 1
          fi

      - name: Setup workspace tooling for queue validation
        uses: ./.github/actions/pnpm-install-cached
      - name: Validate queued VPS build contracts
        run: node --test .github/scripts/vps-build-resource-queue.test.mjs .github/scripts/production-typecheck-scope.test.mjs

      # actionlint 1.7.12 predates GitHub's concurrency.queue support (upstream
      # #657). The ignore lives here, not in .github/actionlint.yaml, because the
      # CWV runner authority pins that file byte-for-byte. The queue test above
      # validates every queue location, value, grouping and cancellation policy.
      - name: Run actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color \
            -ignore '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
