name: Android Production Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile-admin/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/android-release.yml'
    tags:
      # Tag pushes bypass the paths filter above (GitHub Actions behaviour).
      - 'v*-admin'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code override (leave empty for auto)'
        required: false
        type: string
      changes_not_sent_for_review:
        description: 'Manual recovery only: set true after Play asks for changesNotSentForReview'
        required: false
        default: false
        type: boolean

concurrency:
  # Serialize admin release runs only. Cross-app serialization is avoided because
  # GitHub preserves only one pending run per concurrency group.
  group: android-admin-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  ANDROID_NODE_OPTIONS: "--no-strip-types --max-old-space-size=2048"
  ANDROID_GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvm.options=-Xmx1024m'
  PNPM_STORE_DIR: ${{ github.workspace }}/.pnpm-store
  WORKING_DIR: apps/mobile-admin
  # Offset added to github.run_number to avoid collisions with
  # version codes previously uploaded via EAS (1-9) and earlier runs (10).
  VERSION_CODE_BASE: '10'
  # Keep automatic review by default. Temporarily set this repo variable to
  # true only when Google Play rejects API commits and asks for
  # changesNotSentForReview=true; then submit the pending edit in Play Console.
  ANDROID_ADMIN_CHANGES_NOT_SENT_FOR_REVIEW: ${{ vars.ANDROID_ADMIN_CHANGES_NOT_SENT_FOR_REVIEW || 'false' }}
  # Major.minor for the human-facing versionName; the version code becomes the
  # patch so versionName auto-increments each release (was hardcoded "2.0.1").
  APP_VERSION_MAJOR_MINOR: '2.0'

jobs:
  build-and-deploy:
    name: Build AAB & Upload to Play Store
    runs-on: baci-android
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Pre-run cleanup of stale secrets
        run: |
          rm -f "${{ runner.temp }}/release.keystore"
          rm -f "apps/mobile-admin/android/app/google-services.json"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.30.5

      - name: Configure pnpm store directory
        uses: ./.github/actions/setup-pnpm-store
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
          pnpm-bin-dir: ${{ steps.setup_pnpm.outputs.bin_dest }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Reset Gradle 9 compiled DSL caches
        run: |
          GRADLE_CACHE_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/9.3.1"
          rm -rf "$GRADLE_CACHE_HOME/groovy-dsl" \
                 "$GRADLE_CACHE_HOME/kotlin-dsl" \
                 "$GRADLE_CACHE_HOME/dependencies-accessors"

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install-cached
        env:
          # Node 22+ type stripping breaks expo-modules-core; cap old-space for
          # standard 7GB GitHub-hosted runners.
          NODE_OPTIONS: ${{ env.ANDROID_NODE_OPTIONS }}
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
          install-command: .github/scripts/pnpm-install-with-retry.sh --frozen-lockfile

      - name: Verify Expo Router release tree
        run: >-
          pnpm --filter baci-mobile-admin exec vitest run
          scripts/expo-router-app-tree.test.ts

      - name: Normalize PostHog CLI executable bit
        run: |
          POSTHOG_CLI_JS="$(node --print "require.resolve('@posthog/cli/run-posthog-cli.js')")"
          if [ ! -f "$POSTHOG_CLI_JS" ]; then
            echo "::error::@posthog/cli run-posthog-cli.js is not available after pnpm install"
            exit 1
          fi

          # The PostHog Android Gradle helper executes run-posthog-cli.js
          # directly on Unix. Make the target executable so release uploads do
          # not depend on the package manager's bin-shim permissions.
          chmod +x "$POSTHOG_CLI_JS"
          chmod +x "$GITHUB_WORKSPACE/node_modules/.bin/posthog-cli" 2>/dev/null || true
          node "$POSTHOG_CLI_JS" --version

      - name: Fix Hermes compiler path
        # RN 0.83+ ships hermesc in the hermes-compiler package, but
        # Gradle still resolves it via react-native/sdks/hermesc/.
        # Create a symlink so the build finds the binary.
        run: |
          HERMESC_SRC="$GITHUB_WORKSPACE/node_modules/hermes-compiler/hermesc"
          HERMESC_DST="$GITHUB_WORKSPACE/node_modules/react-native/sdks/hermesc"
          if [ -d "$HERMESC_SRC" ] && [ ! -e "$HERMESC_DST" ]; then
            ln -s "$HERMESC_SRC" "$HERMESC_DST"
            chmod +x "$HERMESC_DST/linux64-bin/hermesc" 2>/dev/null || true
          fi

      - name: Resolve version code
        id: version
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          VERSION_CODE_BASE: ${{ env.VERSION_CODE_BASE }}
          APP_VERSION_MAJOR_MINOR: ${{ env.APP_VERSION_MAJOR_MINOR }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION_CODE" ]; then
            VERSION_CODE="$INPUT_VERSION_CODE"
          elif [ "$GH_REF_TYPE" = "tag" ]; then
            VERSION_CODE="${GITHUB_REF_NAME#v}"
            VERSION_CODE="${VERSION_CODE%-admin}"
          else
            # Auto-bump: run_number + base offset to avoid collisions with
            # previously uploaded version codes (EAS builds, earlier CI runs).
            VERSION_CODE=$(( GH_RUN_NUMBER + VERSION_CODE_BASE ))
          fi

          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid version code '$VERSION_CODE'. Use a positive integer (>=1)."
            exit 1
          fi
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Invalid version code '$VERSION_CODE'. Must be a positive integer <= 2100000000."
            exit 1
          fi

          if ! [[ "$APP_VERSION_MAJOR_MINOR" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid APP_VERSION_MAJOR_MINOR '$APP_VERSION_MAJOR_MINOR'. Must match <major>.<minor> (e.g., 2.0)."
            exit 1
          fi

          # versionName = <major.minor>.<version code> so it auto-increments each
          # release, mirroring the iOS "2.0.<build number>" scheme.
          APP_VERSION="${APP_VERSION_MAJOR_MINOR}.${VERSION_CODE}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Materialize Firebase Android config
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_ADMIN_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            umask 077
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
            chmod 600 google-services.json
            echo "Materialized google-services.json from ANDROID_ADMIN_GOOGLE_SERVICES_JSON_BASE64"
          elif [ -f google-services.json ]; then
            echo "ANDROID_ADMIN_GOOGLE_SERVICES_JSON_BASE64 not set; using tracked google-services.json"
          else
            echo "::error::Missing apps/mobile-admin/google-services.json and ANDROID_ADMIN_GOOGLE_SERVICES_JSON_BASE64 secret"
            exit 1
          fi

      - name: Generate Android project via Expo prebuild
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: "1"
          NODE_OPTIONS: ${{ env.ANDROID_NODE_OPTIONS }}
          ANDROID_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION: ${{ env.APP_VERSION }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID }}
        run: pnpm exec expo prebuild --platform android --clean

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi
          KEYSTORE_PATH="${{ runner.temp }}/release.keystore"
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_ADMIN_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Reset Worklets bundle artifacts
        run: |
          WORKLETS_DIR="$GITHUB_WORKSPACE/node_modules/react-native-worklets/.worklets"
          rm -rf "$WORKLETS_DIR"
          mkdir -p "$WORKLETS_DIR"

          for CACHE_ROOT in "${RUNNER_TEMP:-}" "${TMPDIR:-/tmp}" /tmp; do
            if [ -n "$CACHE_ROOT" ]; then
              rm -rf "$CACHE_ROOT"/metro-* "$CACHE_ROOT"/haste-map-* 2>/dev/null || true
            fi
          done

      - name: Build Android App Bundle
        working-directory: ${{ env.WORKING_DIR }}/android
        env:
          GRADLE_OPTS: ${{ env.ANDROID_GRADLE_OPTS }}
          NODE_OPTIONS: ${{ env.ANDROID_NODE_OPTIONS }}
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_ADMIN_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        # Production Play bundles only need the 64-bit ABI. Avoid compiling
        # emulator/x86 native variants on the persistent runner; that build
        # timed out after spending the final hour in x86_64 CMake work.
        run: ./gradlew app:bundleRelease -PreactNativeArchitectures=arm64-v8a -x lint -x test --configure-on-demand --build-cache --max-workers=2 --no-daemon --stacktrace

      - name: Verify Android release recommendations
        env:
          BUNDLETOOL_VERSION: '1.18.3'
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          BUNDLETOOL_JAR="${RUNNER_TEMP}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 180 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "${BUNDLETOOL_JAR}"
          echo "${BUNDLETOOL_SHA256}  ${BUNDLETOOL_JAR}" | sha256sum --check
          node apps/mobile-admin/scripts/verify-android-release-aab.mjs \
            --aab apps/mobile-admin/android/app/build/outputs/bundle/release/app-release.aab \
            --mapping apps/mobile-admin/android/app/build/outputs/mapping/release/mapping.txt \
            --bundletool "${BUNDLETOOL_JAR}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Guard Google Play upload against stale main builds
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: upload_guard
        run: |
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "::error::Unable to determine current main HEAD"
            exit 1
          fi

          if [ "${GITHUB_SHA}" = "$CURRENT_MAIN_SHA" ]; then
            echo "allow_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "allow_upload=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Google Play upload because this run is not for the current main HEAD."
          fi
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload to Google Play (full production rollout)
        id: play_upload
        if: success() && (github.event_name != 'push' || github.ref != 'refs/heads/main' || steps.upload_guard.outputs.allow_upload == 'true')
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ogabassey.baci
          releaseFiles: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed
          # Keep automatic releases in the normal Play review flow. Manual
          # recovery dispatches or the temporary repo variable can opt into
          # Google's rejected-change recovery mode without editing this workflow.
          changesNotSentForReview: ${{ (github.event_name == 'workflow_dispatch' && inputs.changes_not_sent_for_review) || env.ANDROID_ADMIN_CHANGES_NOT_SENT_FOR_REVIEW == 'true' }}

      - name: Reconcile Android live-build update gate
        if: success() && steps.play_upload.outcome == 'success'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ANDROID_LIVE_BUILD_SYNC_URL: https://usebaci.com/api/cron/android-live-build-sync?app=admin
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is missing; skipping non-fatal Android live-build gate reconciliation"
            exit 0
          fi

          if ! curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ANDROID_LIVE_BUILD_SYNC_URL"; then
            echo "::warning::Android live-build gate reconciliation failed after Play upload; release remains published"
          fi

      - name: Clean up keystore
        if: always()
        run: |
          rm -f "${{ env.ANDROID_ADMIN_KEYSTORE_FILE }}"
          if ! git -C ${{ github.workspace }} ls-files --error-unmatch ${{ env.WORKING_DIR }}/google-services.json >/dev/null 2>&1; then
            rm -f ${{ env.WORKING_DIR }}/google-services.json
          fi
          rm -f ${{ env.WORKING_DIR }}/android/app/google-services.json
