name: Android Storefront Production Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile-storefront/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
    tags:
      # Tag pushes bypass the paths filter above (GitHub Actions behaviour).
      - "v*-storefront"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Play Store version code (must be higher than current production)"
        required: false
        type: string
      publish_to_play:
        description: "Upload the built AAB to Google Play"
        required: true
        default: false
        type: boolean
      track:
        description: "Google Play track used only when publish_to_play is true"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - production

concurrency:
  # Serialize storefront release runs only. Cross-app serialization is avoided
  # because GitHub preserves only one pending run per concurrency group.
  group: android-storefront-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  ANDROID_NODE_OPTIONS: "--no-experimental-strip-types --max-old-space-size=2048"
  ANDROID_GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvm.options=-Xmx1024m'
  PNPM_STORE_DIR: ${{ github.workspace }}/.pnpm-store
  WORKING_DIR: apps/mobile-storefront
  # Offset added to github.run_number to avoid collisions with
  # version codes previously uploaded via EAS or earlier manual runs.
  VERSION_CODE_BASE: '10'

jobs:
  build-and-deploy:
    name: Build Storefront AAB & Upload to Play Store
    runs-on: baci-android
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Pre-run cleanup of stale secrets
        run: |
          rm -f "${{ runner.temp }}/storefront-release-keystore."*
          rm -f "apps/mobile-storefront/android/app/google-services.json"
          rm -f "apps/mobile-storefront/android/sentry.properties"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006

      - name: Configure pnpm store directory
        uses: ./.github/actions/setup-pnpm-store
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
          pnpm-bin-dir: ${{ steps.setup_pnpm.outputs.bin_dest }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Reset Gradle 9 compiled DSL caches
        run: |
          GRADLE_CACHE_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/9.3.1"
          rm -rf "$GRADLE_CACHE_HOME/groovy-dsl" \
                 "$GRADLE_CACHE_HOME/kotlin-dsl" \
                 "$GRADLE_CACHE_HOME/dependencies-accessors"

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install-cached
        env:
          # Node 22+ type stripping breaks expo-modules-core; cap old-space for
          # standard 7GB GitHub-hosted runners.
          NODE_OPTIONS: ${{ env.ANDROID_NODE_OPTIONS }}
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
          install-command: .github/scripts/pnpm-install-with-retry.sh --frozen-lockfile

      - name: Expose PostHog CLI to Gradle
        shell: bash
        run: |
          POSTHOG_CLI_BIN="$GITHUB_WORKSPACE/node_modules/.bin/posthog-cli"
          if [ ! -x "$POSTHOG_CLI_BIN" ]; then
            echo "::error::PostHog CLI is missing or not executable at $POSTHOG_CLI_BIN"
            exit 1
          fi
          dirname "$POSTHOG_CLI_BIN" >> "$GITHUB_PATH"

      - name: Fix Hermes compiler path
        # RN 0.83+ ships hermesc in the hermes-compiler package, but
        # Gradle still resolves it via react-native/sdks/hermesc/.
        # Create a symlink so the build finds the binary.
        run: |
          HERMESC_SRC="$GITHUB_WORKSPACE/node_modules/hermes-compiler/hermesc"
          HERMESC_DST="$GITHUB_WORKSPACE/node_modules/react-native/sdks/hermesc"
          if [ -d "$HERMESC_SRC" ] && [ ! -e "$HERMESC_DST" ]; then
            ln -s "$HERMESC_SRC" "$HERMESC_DST"
            chmod +x "$HERMESC_DST/linux64-bin/hermesc" 2>/dev/null || true
          fi

      - name: Resolve version code
        id: version
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          VERSION_CODE_BASE: ${{ env.VERSION_CODE_BASE }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$VERSION_CODE_INPUT" ]; then
            VERSION_CODE="$VERSION_CODE_INPUT"
          elif [ "$GH_REF_TYPE" = "tag" ]; then
            VERSION_CODE="${GH_REF_NAME#v}"
            VERSION_CODE="${VERSION_CODE%-storefront}"
          else
            # Auto-bump: run_number + base offset to avoid collisions with
            # previously uploaded version codes (EAS builds, earlier CI runs).
            VERSION_CODE=$(( GH_RUN_NUMBER + VERSION_CODE_BASE ))
          fi

          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid version code '$VERSION_CODE'. Use a positive integer (>=1)."
            exit 1
          fi
          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Invalid version code '$VERSION_CODE'. Must be a positive integer <= 2100000000."
            exit 1
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Generate Android project via Expo prebuild
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: "1"
          NODE_OPTIONS: ${{ env.ANDROID_NODE_OPTIONS }}
          ANDROID_VERSION_CODE: ${{ env.VERSION_CODE }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_QUIZ_ADS_ENABLED: 'true'
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID }}
          STOREFRONT_ADMOB_ANDROID_APP_ID: ${{ secrets.STOREFRONT_ADMOB_ANDROID_APP_ID }}
          STOREFRONT_ADMOB_IOS_APP_ID: ${{ secrets.STOREFRONT_ADMOB_IOS_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_FORCE_ENV_TOKEN: '1'
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          STOREFRONT_FACEBOOK_APP_ID: ${{ secrets.STOREFRONT_FACEBOOK_APP_ID }}
          STOREFRONT_FACEBOOK_CLIENT_TOKEN: ${{ secrets.STOREFRONT_FACEBOOK_CLIENT_TOKEN }}
        run: pnpm exec expo prebuild --platform android --clean

      - name: Fix splash screen resource reference
        # expo-splash-screen adds a windowSplashScreenAnimatedIcon style item
        # referencing @drawable/splashscreen_logo, but without a splash image
        # configured, the drawable is never created. The config plugin
        # (withNoSplashImage.js) removes it from styles.xml, but if Expo
        # regenerates it during prebuild, strip it here as a safety net.
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ] && grep -q "splashscreen_logo" "$STYLES"; then
            sed -i '/@drawable\/splashscreen_logo/d' "$STYLES"
            echo "Removed splashscreen_logo reference from styles.xml"
          fi

      - name: Decode keystore
        working-directory: ${{ env.WORKING_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_STOREFRONT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_STOREFRONT_KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi
          KEYSTORE_PATH="$(mktemp "${RUNNER_TEMP}/storefront-release-keystore.XXXXXX")"
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_STOREFRONT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Android App Bundle (storefront)
        working-directory: ${{ env.WORKING_DIR }}/android
        env:
          GRADLE_OPTS: ${{ env.ANDROID_GRADLE_OPTS }}
          NODE_OPTIONS: ${{ env.ANDROID_NODE_OPTIONS }}
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_STOREFRONT_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STOREFRONT_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_STOREFRONT_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_STOREFRONT_KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          EXPO_PUBLIC_QUIZ_ADS_ENABLED: 'true'
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_FORCE_ENV_TOKEN: '1'
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          STOREFRONT_FACEBOOK_APP_ID: ${{ secrets.STOREFRONT_FACEBOOK_APP_ID }}
          STOREFRONT_FACEBOOK_CLIENT_TOKEN: ${{ secrets.STOREFRONT_FACEBOOK_CLIENT_TOKEN }}
        run: |
          GRADLE_ARGS="app:bundleRelease -x lint -x lintVitalAnalyzeRelease -x test --configure-on-demand --build-cache --max-workers=2 --no-daemon --stacktrace"
          # shellcheck disable=SC2086
          ./gradlew $GRADLE_ARGS

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storefront-app-release-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
            ${{ env.WORKING_DIR }}/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 7

      - name: Guard Google Play upload against stale main builds
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: upload_guard
        run: |
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "::error::Unable to determine current main HEAD"
            exit 1
          fi

          if [ "${GITHUB_SHA}" = "$CURRENT_MAIN_SHA" ]; then
            echo "allow_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "allow_upload=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Google Play upload because this run is not for the current main HEAD."
          fi
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload to Google Play
        id: play_upload
        if: >-
          success() &&
          (
            (github.event_name == 'workflow_dispatch' && inputs.publish_to_play) ||
            (
              github.event_name == 'push' &&
              (github.ref != 'refs/heads/main' || steps.upload_guard.outputs.allow_upload == 'true')
            )
          )
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ogabassey.store
          releaseFiles: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: ${{ env.WORKING_DIR }}/android/app/build/outputs/mapping/release/mapping.txt
          tracks: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'production' }}
          status: completed

      # Point the in-app update gate at the build we just published so installs
      # below this versionCode get prompted. The new value applies on the next
      # production web deploy (Vercel snapshots env at deploy time). Non-fatal:
      # a sync hiccup must never fail an otherwise-successful store release.
      - name: Sync Android build number to in-app update gate
        if: >-
          success() &&
          steps.play_upload.outcome == 'success' &&
          (github.event_name != 'workflow_dispatch' || inputs.track == 'production')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel credentials missing — skipping update-gate sync"
            exit 0
          fi
          TEAM_QS=""
          if [ -n "$VERCEL_ORG_ID" ]; then TEAM_QS="&teamId=${VERCEL_ORG_ID}"; fi
          HTTP_CODE=$(curl -sS -o /tmp/vercel_env.json -w '%{http_code}' -X POST \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true${TEAM_QS}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"MOBILE_STOREFRONT_ANDROID_LATEST_BUILD\",\"value\":\"${VERSION_CODE}\",\"type\":\"encrypted\",\"target\":[\"production\"]}")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Synced MOBILE_STOREFRONT_ANDROID_LATEST_BUILD=${VERSION_CODE} (HTTP ${HTTP_CODE})"
          else
            echo "::warning::Vercel env sync failed (HTTP ${HTTP_CODE}): $(cat /tmp/vercel_env.json)"
          fi

      - name: Reconcile storefront Android live-build update gate
        if: >-
          success() &&
          steps.play_upload.outcome == 'success' &&
          (github.event_name != 'workflow_dispatch' || inputs.track == 'production')
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ANDROID_LIVE_BUILD_SYNC_URL: https://usebaci.com/api/cron/android-live-build-sync?app=storefront
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is missing; skipping non-fatal storefront Android live-build gate reconciliation"
            exit 0
          fi

          if ! curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ANDROID_LIVE_BUILD_SYNC_URL"; then
            echo "::warning::Storefront Android live-build gate reconciliation failed after Play upload; release remains published"
          fi

      - name: Clean up release credentials
        if: always()
        run: |
          rm -f "${{ env.ANDROID_STOREFRONT_KEYSTORE_FILE }}"
          rm -f "apps/mobile-storefront/android/app/google-services.json"
          rm -f "apps/mobile-storefront/android/sentry.properties"
