name: Android Storefront Production Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile-storefront/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      # Patch/lockfile changes rebuild ReactAndroid from source.
      - 'patches/**'
      - 'pnpm-lock.yaml'
    tags:
      - "v*-storefront"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Play Store version code (must be higher than current production)"
        required: false
        type: string
      publish_to_play:
        description: "Upload the built AAB to Google Play"
        required: true
        default: false
        type: boolean
      track:
        description: "Google Play track used only when publish_to_play is true"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - production

concurrency:
  # Serialize storefront release runs only. Cross-app serialization is avoided
  # because GitHub preserves only one pending run per concurrency group.
  group: android-storefront-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACI_MOBILE_BUILD_PLATFORM: android
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  ANDROID_NODE_OPTIONS: "--no-experimental-strip-types --max-old-space-size=2048"
  ANDROID_GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvm.options=-Xmx1024m'
  PNPM_STORE_DIR: ${{ github.workspace }}/.pnpm-store
  WORKING_DIR: apps/mobile-storefront
  # Offset added to github.run_number to avoid collisions with
  # version codes previously uploaded via EAS or earlier manual runs.
  VERSION_CODE_BASE: '10'

jobs:
  build-and-deploy:
    name: Build Storefront AAB & Upload to Play Store
    runs-on: baci-android
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pre-run cleanup of stale secrets
        run: |
          rm -f "${{ runner.temp }}/storefront-release-keystore."*
          rm -f "apps/mobile-storefront/android/app/google-services.json"
          rm -f "apps/mobile-storefront/android/sentry.properties"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006

      - name: Configure pnpm store directory
        uses: ./.github/actions/setup-pnpm-store
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
          pnpm-bin-dir: ${{ steps.setup_pnpm.outputs.bin_dest }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Reset Gradle 9 compiled DSL caches
        run: |
          GRADLE_CACHE_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/9.3.1"
          rm -rf "$GRADLE_CACHE_HOME/groovy-dsl" \
                 "$GRADLE_CACHE_HOME/kotlin-dsl" \
                 "$GRADLE_CACHE_HOME/dependencies-accessors"

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install-cached
        env:
          # Node 22+ type stripping breaks expo-modules-core; cap old-space for
          # standard 7GB GitHub-hosted runners.
          NODE_OPTIONS: ${{ env.ANDROID_NODE_OPTIONS }}
        with:
          store-dir: ${{ env.PNPM_STORE_DIR }}
          install-command: .github/scripts/pnpm-install-with-retry.sh --frozen-lockfile

      - name: Expose PostHog CLI to Gradle
        shell: bash
        run: bash "${{ github.workspace }}/.github/scripts/android-storefront-release.sh" expose-posthog-cli

      - name: Fix Hermes compiler path
        # RN 0.83+ ships hermesc in the hermes-compiler package, but
        # Gradle still resolves it via react-native/sdks/hermesc/.
        # Create a symlink so the build finds the binary.
        run: bash "${{ github.workspace }}/.github/scripts/android-storefront-release.sh" fix-hermes

      - name: Resolve version code
        id: version
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          VERSION_CODE_BASE: ${{ env.VERSION_CODE_BASE }}
        run: bash "${{ github.workspace }}/.github/scripts/android-storefront-release.sh" resolve-version

      - name: Generate Android project via Expo prebuild
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: "1"
          NODE_OPTIONS: ${{ env.ANDROID_NODE_OPTIONS }}
          ANDROID_VERSION_CODE: ${{ env.VERSION_CODE }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_QUIZ_ADS_ENABLED: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID != '' && 'true' || 'false' }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID }}
          STOREFRONT_ADMOB_ANDROID_APP_ID: ${{ secrets.STOREFRONT_ADMOB_ANDROID_APP_ID }}
          STOREFRONT_ADMOB_IOS_APP_ID: ${{ secrets.STOREFRONT_ADMOB_IOS_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_FORCE_ENV_TOKEN: '1'
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          STOREFRONT_FACEBOOK_APP_ID: ${{ secrets.STOREFRONT_FACEBOOK_APP_ID }}
          STOREFRONT_FACEBOOK_CLIENT_TOKEN: ${{ secrets.STOREFRONT_FACEBOOK_CLIENT_TOKEN }}
        run: pnpm exec expo prebuild --platform android --clean

      - name: Fix splash screen resource reference
        # expo-splash-screen adds a windowSplashScreenAnimatedIcon style item
        # referencing @drawable/splashscreen_logo, but without a splash image
        # configured, the drawable is never created. The config plugin
        # (withNoSplashImage.js) removes it from styles.xml, but if Expo
        # regenerates it during prebuild, strip it here as a safety net.
        working-directory: ${{ env.WORKING_DIR }}
        run: bash "${{ github.workspace }}/.github/scripts/android-storefront-release.sh" fix-splash

      - name: Decode keystore
        working-directory: ${{ env.WORKING_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_STOREFRONT_KEYSTORE_BASE64 }}
        run: bash "${{ github.workspace }}/.github/scripts/android-storefront-release.sh" decode-keystore

      - name: Build Android App Bundle (storefront)
        working-directory: ${{ env.WORKING_DIR }}/android
        env:
          GRADLE_OPTS: ${{ env.ANDROID_GRADLE_OPTS }}
          NODE_OPTIONS: ${{ env.ANDROID_NODE_OPTIONS }}
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_STOREFRONT_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STOREFRONT_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_STOREFRONT_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_STOREFRONT_KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_QUIZ_ADS_ENABLED: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID != '' && 'true' || 'false' }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID }}
          STOREFRONT_ADMOB_ANDROID_APP_ID: ${{ secrets.STOREFRONT_ADMOB_ANDROID_APP_ID }}
          STOREFRONT_ADMOB_IOS_APP_ID: ${{ secrets.STOREFRONT_ADMOB_IOS_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_FORCE_ENV_TOKEN: '1'
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          STOREFRONT_FACEBOOK_APP_ID: ${{ secrets.STOREFRONT_FACEBOOK_APP_ID }}
          STOREFRONT_FACEBOOK_CLIENT_TOKEN: ${{ secrets.STOREFRONT_FACEBOOK_CLIENT_TOKEN }}
        run: bash "${{ github.workspace }}/.github/scripts/android-storefront-release.sh" build

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storefront-app-release-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
            ${{ env.WORKING_DIR }}/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 7

      - name: Guard Google Play upload against stale main builds
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: upload_guard
        run: bash "${{ github.workspace }}/.github/scripts/android-storefront-release.sh" upload-guard
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload to Google Play
        id: play_upload
        if: >-
          success() &&
          (
            (github.event_name == 'workflow_dispatch' && inputs.publish_to_play) ||
            (
              github.event_name == 'push' &&
              (github.ref != 'refs/heads/main' || steps.upload_guard.outputs.allow_upload == 'true')
            )
          )
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ogabassey.store
          releaseFiles: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: ${{ env.WORKING_DIR }}/android/app/build/outputs/mapping/release/mapping.txt
          tracks: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'production' }}
          status: completed

      # Point the in-app update gate at the build we just published so installs
      # below this versionCode get prompted. The new value applies on the next
      # production web deploy (Vercel snapshots env at deploy time). Non-fatal:
      # a sync hiccup must never fail an otherwise-successful store release.
      - name: Sync Android build number to in-app update gate
        if: >-
          success() &&
          steps.play_upload.outcome == 'success' &&
          (github.event_name != 'workflow_dispatch' || inputs.track == 'production')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: bash "${{ github.workspace }}/.github/scripts/android-storefront-release.sh" sync-update-gate

      - name: Reconcile storefront Android live-build update gate
        if: >-
          success() &&
          steps.play_upload.outcome == 'success' &&
          (github.event_name != 'workflow_dispatch' || inputs.track == 'production')
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ANDROID_LIVE_BUILD_SYNC_URL: https://usebaci.com/api/cron/android-live-build-sync?app=storefront
        run: bash "${{ github.workspace }}/.github/scripts/android-storefront-release.sh" reconcile-live-build

      - name: Clean up release credentials
        if: always()
        run: bash "${{ github.workspace }}/.github/scripts/android-storefront-release.sh" cleanup
