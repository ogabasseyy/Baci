name: API Discovery

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  # v1.0.0 of the discovery action only analyzes and uploads to APIsec;
  # it no longer opens spec PRs, so no write permissions are needed.
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes back to the repo (the v1.0.0
          # discovery action no longer opens spec PRs), so do not persist
          # credentials on the checkout.
          persist-credentials: false
          fetch-depth: 0

      - name: API Discovery
        uses: apisec-inc/apisec-bolt-code-discovery-github-action@3e96353b2a3078aeea3f75bfc7d6bae0acd6be17 # v1.0.0
        with:
          api-endpoint: ${{ secrets.API_DISCOVERY_ENDPOINT }}
          api-token: ${{ secrets.API_DISCOVERY_TOKEN }}
          repo-path: "."
          dry-run: false
