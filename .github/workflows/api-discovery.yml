name: API Discovery

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The API discovery action creates and pushes update PR branches when dry-run is false.
          persist-credentials: true
          fetch-depth: 0

      - name: API Discovery
        uses: apisec-inc/apisec-bolt-code-discovery-github-action@92d3be16d6c716c7524b11628bdac9a24426e6cc # v0.1.9
        with:
          api-endpoint: ${{ secrets.API_DISCOVERY_ENDPOINT }}
          api-token: ${{ secrets.API_DISCOVERY_TOKEN }}
          repo-path: "."
          dry-run: false
