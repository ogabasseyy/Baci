name: Bundle Analysis

on:
  # Run weekly to keep an eye on size drift
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am
  # Allow manual trigger
  workflow_dispatch:
  # Run on main branch pushes to verify impact
  push:
    branches: [main]
    paths:
      - "apps/web/package.json"
      - "pnpm-lock.yaml"
      # The root config is still a Next config entrypoint in this repo; changes
      # can alter web rendering and bundle output without touching apps/web/**.
      - "next.config.ts"
      - "apps/web/next.config.ts"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
          install-command: pnpm install

      - name: Build & Analyze
        run: pnpm --filter @baci/web run analyze
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
          # Fallback to dummy values for Dependabot PRs (which can't access repo secrets)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}

      - name: Upload Analysis Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-analysis-report
          path: apps/web/.next/diagnostics/analyze/
          retention-days: 30
          if-no-files-found: warn
