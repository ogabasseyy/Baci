name: Bundle Analysis

on:
  # Run weekly to keep an eye on size drift
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am
  # Allow manual trigger
  workflow_dispatch:
  # Run on main branch pushes to verify impact
  push:
    branches: [main]
    paths:
      - "apps/web/package.json"
      - "pnpm-lock.yaml"
      # The root config is still a Next config entrypoint in this repo; changes
      # can alter web rendering and bundle output without touching apps/web/**.
      - "next.config.ts"
      - "apps/web/next.config.ts"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Clean stale pnpm setup directory
        run: rm -rf ~/setup-pnpm 2>/dev/null || true

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Dependencies
        uses: ./.github/actions/pnpm-install-cached
        with:
          store-dir: ${{ runner.temp }}/pnpm-store
          install-command: pnpm install

      - name: Build & Analyze
        run: pnpm --filter @baci/web run analyze
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
          # Fallback to dummy values for Dependabot PRs (which can't access repo secrets)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}

      - name: Upload Analysis Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-analysis-report
          path: apps/web/.next/diagnostics/analyze/
          retention-days: 30
          if-no-files-found: warn
