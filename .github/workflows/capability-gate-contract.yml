name: Capability Gate Contract

# Independent guard for the capability gate's own caller. This workflow runs
# from the BASE revision (pull_request_target): it fetches the base-owned
# checker script and runs THAT against the PR head, so a PR that weakens the
# checker, the invocation, or any enforcement file cannot silence the guard —
# the running logic always comes from the target branch. The checker only
# reads PR files as data (hash + parse, never import or execute). On push
# events the checkout itself is the revision under test, so its own script
# runs. Enforcement files and their declared hashes both live in
# .github/scripts/capability_gate_contract_check.py; see its header for the
# refresh procedure.
# Residual limit: direct pushes to protected branches bypass PR guards;
# branch protection with required reviews plus this required check is the
# remaining layer (owner action).

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:

permissions:
  contents: read

env:
  # Baseline hash of the checker script itself. The checker cannot pin
  # itself, so the base-owned workflow carries the baseline and passes it as
  # argv[1]; a same-PR checker change declares its new hash here.
  PINNED_CHECKER_SHA256: fec2a79960820c617c210f77c9ba65a343e461fddbbe88fd27d1fa32ecdbedc8

jobs:
  gate-contract:
    name: Capability Gate Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR head under test; empty on push events (checks out the ref).
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run base-owned contract check against the head
        shell: bash
        run: |
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            git fetch --no-tags --depth 1 origin "${{ github.base_ref }}"
            git show FETCH_HEAD:.github/scripts/capability_gate_contract_check.py > /tmp/contract_check.py
          else
            cp .github/scripts/capability_gate_contract_check.py /tmp/contract_check.py
          fi
          python3 /tmp/contract_check.py "$PINNED_CHECKER_SHA256"
