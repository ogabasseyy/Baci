name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required so the quality gate runs on merge-queue integration commits.
  # Without this, an enabled merge queue would deadlock waiting for checks
  # that never start. See the `changes` job for merge_group handling.
  merge_group:
  workflow_dispatch:
    inputs:
      force_quality_gates:
        description: 'Run lint, typecheck, and test gates even when no web paths changed (used by automation branches)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# TURBO_TOKEN/TURBO_TEAM are Vercel Remote Cache secrets. They are scoped to the
# individual hosted turbo test steps that need them rather than the
# workflow-level env, so they are not exposed to unrelated jobs/steps or the
# third-party actions they run. Lint and typecheck omit these credentials on all
# runners because either job can run on the persistent private runner.
# TURBO_SCM_BASE is not a secret and stays global
# so `turbo --affected` can resolve its base ref everywhere.
env:
  TURBO_SCM_BASE: origin/main

jobs:
  changes:
    # This job holds the capability-gate step, so the base-owned capability-gate
    # contract pins it to a plain, unconditional ubuntu-24.04 runner. Keep it there.
    runs-on: ubuntu-24.04
    outputs:
      mobile_admin: ${{ steps.gate.outputs.mobile_admin }}
      mobile_storefront: ${{ steps.gate.outputs.mobile_storefront }}
      test_plan_mode: ${{ steps.test-plan.outputs.mode }}
      test_plan_reason: ${{ steps.test-plan.outputs.reason }}
      web: ${{ steps.gate.outputs.web }}
      quiz_db: ${{ steps.gate.outputs.quiz_db }}
      cwv_runner: ${{ steps.gate.outputs.cwv_runner }}
      deploy_scripts: ${{ steps.gate.outputs.deploy_scripts }}
      piggyvest_runbook: ${{ steps.gate.outputs.piggyvest_runbook }}
      private_ci_trusted: ${{ github.event.repository.private && vars.BACI_PRIVATE_CI_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gate runs before any PR-controlled script: a preceding step
      # could overwrite the checked-out gate code, which would then execute
      # while the independent contract (separate checkout) sees pristine
      # files. The contract checker enforces this ordering.
      - name: Test capability register binding
        uses: ./.github/actions/capability-gate
      - name: Test Android release SDK alignment
        run: node --test .github/scripts/android-release-sdk.test.mjs .github/scripts/android-release-sdk-platform.test.mjs .github/scripts/android-release-sdk-compat.test.mjs .github/scripts/android-admin-release-budget.test.mjs .github/scripts/mobile-gradle-wrapper.test.mjs .github/scripts/rn-suite-migration.test.mjs
      - name: Test release retries and dependency update policy
        run: node --test .github/scripts/muse-dependabot-policy.test.mjs .github/scripts/posthog-release-cli.test.mjs
      - name: Test loyalty replay binary discovery
        run: node --test tools/test/loyalty-postgres-bin.test.mjs
      - name: Test pnpm store action input hardening
        run: node --test .github/actions/setup-pnpm-store/setup-pnpm-store-allowlist.test.mjs .github/actions/pnpm-install-cached/pnpm-install-cached-allowlist.test.mjs
      - name: Test Sentry Storefront Release Provenance
        run: node --test .github/scripts/sentry-storefront-provenance.test.mjs
      - name: Test pilot change-detection contract
        run: node --test .github/scripts/pilot-change-detection-contract.test.mjs
      # Unfiltered on purpose; see docs/runbooks/storefront-release-gate.md.
      - name: Test storefront release gate
        run: node --test .github/scripts/storefront-release-gate.test.mjs .github/scripts/storefront-release-gate-dispatch.test.mjs .github/scripts/storefront-release-gate-references.test.mjs .github/scripts/storefront-release-gate-scripts.test.mjs .github/scripts/storefront-release-gate-steps.test.mjs .github/scripts/storefront-release-gate-git.test.mjs .github/scripts/storefront-release-gate-server-off.test.mjs .github/scripts/storefront-release-gate-workflows.test.mjs
      - name: Test CI change-scope resolver
        run: bash .github/scripts/resolve-ci-change-scope.test.sh
      - name: Test PiggyVest stuck-funds runbook CI wiring
        run: node --test .github/scripts/piggyvest-stuck-funds-runbook-ci.test.mjs
      # paths-filter can't infer a base on merge_group events, so skip it there
      # and run every gate (the queue validates the full integration anyway).
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'merge_group'
        with:
          token: ''
          filters: .github/filters/ci.yml
      - name: Resolve change flags (run all gates in the merge queue)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_MOBILE_ADMIN: ${{ steps.filter.outputs.mobile_admin }}
          FILTER_MOBILE_STOREFRONT: ${{ steps.filter.outputs.mobile_storefront }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_QUIZ_DB: ${{ steps.filter.outputs.quiz_db }}
          FILTER_CWV_RUNNER: ${{ steps.filter.outputs.cwv_runner }}
          FILTER_DEPLOY_SCRIPTS: ${{ steps.filter.outputs.deploy_scripts }}
          FILTER_PIGGYVEST_RUNBOOK: ${{ steps.filter.outputs.piggyvest_runbook }}
          # Generated Muse pin PRs must run the real gates in their
          # pull_request context; workflow_dispatch checks do not satisfy
          # required PR checks.
          FORCE_QUALITY_GATES: ${{ inputs.force_quality_gates || startsWith(github.head_ref, 'automation/muse-code-pin-') }}
        run: bash .github/scripts/resolve-ci-change-scope.sh
      - name: Resolve test plan
        id: test-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/resolve-ci-test-plan.mjs --event "$EVENT_NAME" --base "$TURBO_SCM_BASE"

  cwv-runner-contracts:
    name: CWV Runner Contracts
    needs: [changes]
    if: needs.changes.outputs.cwv_runner == 'true'
    runs-on: ${{ needs.changes.outputs.private_ci_trusted == 'true' && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run CWV runner contract tests
        run: node --test --test-concurrency=1 infra/cwv-runner/*.test.mjs .github/scripts/cwv-runner-*.test.mjs .github/scripts/actionlint-runner-label-contract.test.mjs
      - name: Check CWV runner formatting
        run: pnpm exec biome check infra/cwv-runner .github/scripts/cwv-runner-*.mjs
      - name: Run CWV workflow actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  quality-lint:
    name: Quality Gate - Lint
    needs: [changes]
    # Mobile-only PRs never trip the web filter, so lint must also run for the
    # mobile filters; otherwise the bypassable pre-commit hook is their only
    # Biome gate. `turbo lint --affected` keeps the run scoped to the changed
    # packages.
    if: (needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile_admin == 'true' || needs.changes.outputs.mobile_storefront == 'true') && needs.changes.outputs.test_plan_mode != 'config-smoke'
    # Opt in only after the repository is private and its dedicated runner is
    # registered. Fork PRs and unverified merge groups stay on hosted runners; no hosted fallback is
    # silently substituted when the private runner is offline.
    runs-on: ${{ needs.changes.outputs.private_ci_trusted == 'true' && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    # Cold cache restores can take over ten minutes on the private runner.
    timeout-minutes: ${{ needs.changes.outputs.private_ci_trusted == 'true' && 30 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run Lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo lint --affected
          else
            pnpm turbo lint
          fi

  quality-typecheck:
    name: Quality Gate - Typecheck
    needs: [changes]
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
    runs-on: ${{ needs.changes.outputs.private_ci_trusted == 'true' && vars.BACI_PRIVATE_TYPECHECK_ENABLED == 'true' && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    # Cold hosted runs can exceed 15 minutes for install plus the normal typecheck; the production
    # build typecheck adds a second pass (~7 min warm, capped at 15 by its own step timeout).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Install isolated builder auth typecheck dependencies
        run: pnpm --dir apps/web/tools/builder-auth install --ignore-workspace --frozen-lockfile
      - name: Run isolated builder auth tests
        id: builder-auth-tests
        run: |
          node --test .github/scripts/ci-builder-container-labels.test.mjs .github/scripts/cleanup-builder-ci-containers.test.mjs .github/scripts/ci-typecheck-runner-contract.test.mjs
          pnpm --dir apps/web/tools/builder-auth test
      - name: Clean builder auth test containers
        if: ${{ always() && runner.environment == 'self-hosted' && (steps.builder-auth-tests.outcome == 'success' || steps.builder-auth-tests.outcome == 'failure' || steps.builder-auth-tests.outcome == 'cancelled') }}
        timeout-minutes: 2
        run: node .github/scripts/cleanup-builder-ci-containers.mjs
      - name: Run Typecheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo typecheck --affected
          else
            pnpm turbo typecheck
          fi
      # `build:ci` skips type checking, so only this step exercises the type-check path of the
      # production `build` script (typegen -> prepared typed routes -> tsconfig.build.json).
      # Pull requests skip it only when they touch nothing in the production program (tests, docs,
      # mobile apps). Pushes to main always run it.
      - name: Decide production build typecheck
        id: production-typecheck-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/production-build-typecheck-scope.mjs
      - name: Run production build typecheck
        if: steps.production-typecheck-scope.outputs.run == 'true'
        # A break here can end in a slow compiler abort; fail within the step instead of the job.
        timeout-minutes: 15
        env:
          # Same soft GC budget as the deploy build. apps/web pins typescript ~7.0.2, the native Go
          # compiler (only the repo root aliases `typescript` to TypeScript 6), so NODE_OPTIONS does not apply.
          GOMEMLIMIT: 6GiB
        run: pnpm turbo typecheck:build --filter=@baci/web

  quality-test:
    name: Quality Gate - Test
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ needs.changes.outputs.private_ci_trusted == 'true' && vars.BACI_PRIVATE_QUALITY_TEST_ENABLED == 'true' && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    # Full web/mobile test fan-out reached ~15 minutes warm, but cold runs
    # (Turbo remote cache unavailable) measure 31m+ on GitHub-hosted runners —
    # three consecutive 30m timeouts on cold caches. Keep headroom for Turbo
    # summary and Actions post-job cleanup.
    timeout-minutes: ${{ needs.changes.outputs.private_ci_trusted == 'true' && vars.BACI_PRIVATE_QUALITY_TEST_ENABLED == 'true' && 60 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Resolve test plan
        id: test-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --test .github/scripts/experience-runner-ci.test.mjs .github/scripts/resolve-ci-test-plan.test.mjs .github/scripts/resolve-ci-test-plan-config.test.mjs .github/scripts/resolve-ci-non-web-test-filters.test.mjs .github/scripts/run-ci-non-web-tests.test.mjs .github/scripts/shared-test-fixtures-boundary.test.mjs .github/scripts/shared-test-fixtures-boundary-patterns.test.mjs
          node .github/scripts/resolve-ci-test-plan.mjs --event "$EVENT_NAME" --base "$TURBO_SCM_BASE"
      - name: Run portable experience runner units
        if: steps.test-plan.outputs.mode != 'config-smoke'
        run: pnpm --filter @baci/web test:experience:runner
      - name: Verify authenticated shipping recovery in PostgreSQL
        id: shipping-recovery
        env:
          BACI_SHIPPING_QUOTE_POSTGRES: '1'
        run: |
          node --test supabase/tests/extract-sql-function-definition.test.mjs
          pnpm --filter @baci/web exec vitest run \
            src/lib/shipping/customer-checkout-shipping-recovery-acl.postgres.test.ts \
            src/lib/shipping/customer-checkout-shipping-recovery.postgres.test.ts \
            src/lib/shipping/customer-checkout-shipping-recovery-concurrency.postgres.test.ts \
            src/lib/shipping/prepare-checkout-shipping-recovery.postgres.test.ts \
            src/lib/shipping/customer-checkout-shipping-recovery-quantity.postgres.test.ts \
            src/lib/shipping/customer-checkout-shipping-recovery-aliases.postgres.test.ts \
            src/lib/shipping/customer-checkout-shipping-recovery-delivery.postgres.test.ts \
            src/lib/shipping/customer-checkout-shipping-recovery-retry.postgres.test.ts \
            src/lib/shipping/gigl-wallet-staff-access.postgres.test.ts \
            src/lib/shipping/gigl-external-waybill-link.postgres.test.ts \
            src/lib/shipping/gigl-price-round-100.postgres.test.ts
      - name: Clean shipping PostgreSQL test containers
        if: ${{ always() && runner.environment == 'self-hosted' && (steps.shipping-recovery.outcome == 'success' || steps.shipping-recovery.outcome == 'failure' || steps.shipping-recovery.outcome == 'cancelled') }}
        timeout-minutes: 2
        run: node .github/scripts/cleanup-shipping-ci-containers.mjs
      - name: Run Tests
        id: test-execution
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_PLAN_MODE: ${{ steps.test-plan.outputs.mode }}
          TEST_PLAN_REASON: ${{ steps.test-plan.outputs.reason }}
        run: |
          if [ "$TEST_PLAN_MODE" = "config-smoke" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm exec biome check turbo.json .github/scripts/resolve-ci-test-plan.mjs .github/scripts/resolve-ci-test-plan.test.mjs .github/scripts/resolve-ci-test-plan-config.mjs .github/scripts/resolve-ci-test-plan-config.test.mjs
            node --test .github/scripts/resolve-ci-test-plan.test.mjs .github/scripts/resolve-ci-test-plan-config.test.mjs .github/scripts/shared-test-fixtures-boundary.test.mjs .github/scripts/shared-test-fixtures-boundary-patterns.test.mjs
            exit 0
          fi

          if [ "$TEST_PLAN_MODE" = "targeted-web-vitest" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm --filter @baci/web exec vitest run --changed "$TURBO_SCM_BASE" --passWithNoTests
            pnpm --filter @baci/web exec vitest run src/lib/shared-test-fixtures-import-boundary.test.ts src/lib/shared-exports-resolution.test.ts
            exit 0
          fi

          if [ "$TEST_PLAN_MODE" = "targeted-storefront-jest" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm --filter @baci/mobile-storefront exec jest --changedSince "$TURBO_SCM_BASE" --runInBand --passWithNoTests
            pnpm --filter @baci/mobile-storefront exec jest lib/shared-test-fixtures-boundary.test.ts components/wallet/savings/shared-fixtures.smoke.test.ts --runInBand
            exit 0
          fi

          if [ "$TEST_PLAN_MODE" = "targeted-web-and-storefront-tests" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm --filter @baci/web exec vitest run --changed "$TURBO_SCM_BASE" --passWithNoTests
            pnpm --filter @baci/web exec vitest run src/lib/shared-test-fixtures-import-boundary.test.ts src/lib/shared-exports-resolution.test.ts
            pnpm --filter @baci/mobile-storefront exec jest --changedSince "$TURBO_SCM_BASE" --runInBand --passWithNoTests
            pnpm --filter @baci/mobile-storefront exec jest lib/shared-test-fixtures-boundary.test.ts components/wallet/savings/shared-fixtures.smoke.test.ts --runInBand
            exit 0
          fi

          node .github/scripts/run-ci-non-web-tests.mjs --event "$EVENT_NAME" --base "$TURBO_SCM_BASE"
      - name: Clean builder auth test containers
        if: ${{ always() && runner.environment == 'self-hosted' && (steps.test-execution.outcome == 'success' || steps.test-execution.outcome == 'failure' || steps.test-execution.outcome == 'cancelled') }}
        timeout-minutes: 2
        run: node .github/scripts/cleanup-builder-ci-containers.mjs

  quality-test-web:
    name: Quality Gate - Test (web shard ${{ matrix.shard }})
    needs: [changes]
    # Only the full-affected plan runs the complete web suite; targeted plans
    # keep their narrow vitest invocations inside quality-test.
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode == 'full-affected'
    runs-on: ${{ needs.changes.outputs.private_ci_trusted == 'true' && vars.BACI_PRIVATE_WEB_TEST_ENABLED == 'true' && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ needs.changes.outputs.private_ci_trusted == 'true' && vars.BACI_PRIVATE_WEB_TEST_ENABLED == 'true' && 45 || 25 }}
    env:
      BACI_FIXTURE_SCOPE: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The full web suite verifies immutable historical event-pipeline
          # source bytes. Hydrate blobs during checkout because credentials are
          # deliberately removed before tests and cannot service lazy fetches.
          filter: ''
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Install isolated builder auth test dependencies
        run: pnpm --dir apps/web/tools/builder-auth install --ignore-workspace --frozen-lockfile
      - name: Run web vitest shard
        id: web-shard
        env:
          VITEST_SHARD: ${{ matrix.shard }}
        run: bash .github/scripts/run-ci-web-shard.sh
      - name: Clean builder auth test containers
        if: ${{ always() && runner.environment == 'self-hosted' && (steps.web-shard.outcome == 'success' || steps.web-shard.outcome == 'failure' || steps.web-shard.outcome == 'cancelled') }}
        timeout-minutes: 2
        run: node .github/scripts/cleanup-builder-ci-containers.mjs

  quality-db-replay:
    name: Quality Gate - DB Replay
    needs: [changes]
    if: needs.changes.outputs.quiz_db == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
    runs-on: ${{ needs.changes.outputs.private_ci_trusted == 'true' && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      BACI_REPLAY_COMMAND_TIMEOUT_MS: 1800000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Install Supabase replay toolchain
        env:
          SUPABASE_CLI_SHA256: 31ee8a152e9c8c8eddae072c6bc7c9119748a96c8cdaf21a6d31c9ce7e62cc18
          SUPABASE_CLI_VERSION: 2.111.0
        run: bash .github/scripts/install-supabase-replay-toolchain.sh
      - name: Test reviewed commerce cart checkout product names
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" python3 supabase/tests/run_commerce_cart_checkout_complete_vouchers.py
      - name: Test shared cart validated-price order binding
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" python3 supabase/tests/run_commerce_cart_remaining_review.py
      - name: Test shared cart reviewed assurance binding
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" python3 supabase/tests/run_commerce_cart_agentic_checkout_economics.py
      - name: Test agentic shared-cart provider dispatch fence
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" python3 supabase/tests/run_agentic_cart_provider_dispatch_fence.py
      - name: Test agentic DVA provider-success evidence boundary
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" python3 supabase/tests/run_agentic_dva_provider_success_evidence.py
      - name: Prepare pinned Supabase database image
        run: bash .github/scripts/prepare-supabase-replay-image.sh
      - name: Test loyalty checkout replay fixture against PostgreSQL
        env:
          PG_BINDIR: /usr/lib/postgresql/18/bin
        run: node --test tools/test/loyalty-checkout-replay-local.test.mjs
      - name: Test merchant blog classification permissions and lifecycle
        run: bash supabase/tests/run-merchant-blog-classification.sh
      - name: Test Oxygen draft and workflow lock ordering
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" bash supabase/tests/oxygen_draft_workflow_first_concurrency.sh
      - name: Test Oxygen queued phone verification claim race
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" bash supabase/tests/oxygen_phone_retirement_concurrency.sh
      - name: Test Oxygen queued address recovery claim race
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" bash supabase/tests/oxygen_address_retirement_concurrency.sh
      - name: Test Oxygen financial edit concurrency
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" bash supabase/tests/oxygen_financial_edit_concurrency.sh
      - name: Test Oxygen activation recovery
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" bash supabase/tests/oxygen_general_activation_recovery.sh
      - name: Test REDVAULT fresh-claim concurrency
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" bash supabase/tests/redvault_fresh_claim_concurrency.sh
      - name: Test Oxygen local credit admission
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" bash supabase/tests/oxygen_local_credit_admission.sh
      - name: Test Oxygen recorded gateway admission
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" bash supabase/tests/oxygen_recorded_gateway_fence.sh
      - name: Test Oxygen payment rail origin and in-flight gateway fence
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" bash supabase/tests/oxygen_payment_rail_origin.sh
      - name: Test interrupted Oxygen eligibility status recovery
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" bash supabase/tests/oxygen_interrupted_eligibility_read.sh
      # Every replay SQL suite is registered in
      # apps/web/tools/db/replay-registry/*/sql-checks.txt, one folder per
      # change, and --sql-check-registry expands them in sorted folder
      # order (the baseline folder keeps the pre-registry order, so
      # public_definer_function_exposure.sql still runs first). Register a
      # new suite by adding a folder, not by editing this step; see the
      # registry README.md. Each suite EXECUTES against live PostgreSQL
      # (psql -f with ON_ERROR_STOP=1 over the replayed database, via
      # create-supabase-replay-sql-applier.ts) — it is not a parse
      # check. RLS, advisory locks, triggers, and unique violations
      # all surface here (e.g. the id_snapshot 23505 caught pre-merge),
      # so replay sql-check is sufficient for the order-offer and
      # product-request suites without a second disposable runner.
      - name: Test final order-notification outbox RPC privileges
        run: >-
          pnpm --filter @baci/web db:replay:chronological
          --sql-check-registry apps/web/tools/db/replay-registry
      - name: Run migration replay regression test
