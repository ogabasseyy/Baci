  # The only CI step holding the Supabase service-role key. It must never run on
  # the general private runner, which executes branch code. Trusted main pushes
  # run it on the deploy runner; merge_group (not in use) falls back to hosted. A merge_group commit
  # contains pull request code, so that event checks out the base commit the queue builds on (see the
  # checkout below): the key only ever meets trusted code. The check reads live database state, not the
  # diff, and its own logic keeps secret-free unit tests that run on the pull request code.
  quality-quiz-approval:
    name: Quality Gate - Quiz Approval
    needs: [changes]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'merge_group') &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.quiz_db == 'true') &&
      needs.changes.outputs.test_plan_mode != 'config-smoke' &&
      (vars.QUIZ_PHASE == '1a' || vars.QUIZ_PHASE == 'production')
    # Same kill switch as every private route (private repo + BACI_PRIVATE_CI_ENABLED, via
    # private_ci_trusted). While the repo is public, or with the switch off, this stays on a
    # GitHub-hosted runner; only trusted pushes reach the deploy runner.
    runs-on: ${{ needs.changes.outputs.private_ci_trusted == 'true' && github.event_name == 'push' && fromJSON('["self-hosted","Linux","X64","baci-deploy"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          # merge_group: the queue's base commit (trusted). push: no merge_group payload, so the pushed commit.
          ref: ${{ github.event.merge_group.base_sha || github.sha }}
      - uses: ./.github/actions/pnpm-install-cached
      - name: Verify Quiz Production Approval
        env:
          QUIZ_PHASE: ${{ vars.QUIZ_PHASE }}
          QUIZ_PRODUCTION_APPROVED: ${{ vars.QUIZ_PRODUCTION_APPROVED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUIZ_RPC_SERVER_SECRET: ${{ secrets.QUIZ_RPC_SERVER_SECRET }}
        run: pnpm --filter @baci/web check:quiz-approval

  silent-revert-guard:
    name: Silent Revert Guard
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.repository.private && vars.BACI_PRIVATE_CI_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify checked-out commit history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit SHA' >&2; exit 1; }
            git cat-file -e "${sha}^{commit}"
          done
      - name: Detect silent reverts of recent main commits
        env:
          ALLOW_SILENT_REVERT: ${{ contains(github.event.pull_request.labels.*.name, 'allow-silent-revert') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SILENT_REVERT_LOOKBACK: '80'
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "Exact base commit is missing from checkout. Refresh the PR branch and retry." >&2
            exit 1
          fi
          node ci_scripts/detect-silent-reverts.mjs

  quality:
    name: Quality Gate
    needs: [changes, cwv-runner-contracts, quality-lint, quality-typecheck, quality-test, quality-test-web, quality-misc, quality-db-replay, quality-disposable-sql, quality-quiz-approval, mobile-quality, silent-revert-guard]
    if: ${{ always() }}
    # Aggregate must not depend on `changes` outputs: if `changes` fails it still has to report.
    runs-on: ${{ github.event.repository.private && vars.BACI_PRIVATE_CI_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Verify split quality gate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CWV_RUNNER_CONTRACTS_RESULT: ${{ needs['cwv-runner-contracts'].result }}
          LINT_RESULT: ${{ needs['quality-lint'].result }}
          TYPECHECK_RESULT: ${{ needs['quality-typecheck'].result }}
          TEST_RESULT: ${{ needs['quality-test'].result }}
          MISC_RESULT: ${{ needs['quality-misc'].result }}
          DB_REPLAY_RESULT: ${{ needs['quality-db-replay'].result }}
          DISPOSABLE_SQL_RESULT: ${{ needs['quality-disposable-sql'].result }}
          WEB_TEST_RESULT: ${{ needs['quality-test-web'].result }}
          MOBILE_QUALITY_RESULT: ${{ needs['mobile-quality'].result }}
          SILENT_REVERT_GUARD_RESULT: ${{ needs['silent-revert-guard'].result }}
          QUIZ_APPROVAL_RESULT: ${{ needs['quality-quiz-approval'].result }}
          QUIZ_DB_CHANGED: ${{ needs.changes.outputs.quiz_db }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          MOBILE_ADMIN_CHANGED: ${{ needs.changes.outputs.mobile_admin }}
          MOBILE_STOREFRONT_CHANGED: ${{ needs.changes.outputs.mobile_storefront }}
          TEST_PLAN_MODE: ${{ needs.changes.outputs.test_plan_mode }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job result: $CHANGES_RESULT"
            exit 1
          fi

          # A skipped DB gate is success only when no DB paths changed: if
          # the detector flagged DB changes, replay and the disposable
          # suites must have actually run (skipped would silently waive
          # them). Config-smoke mode skips by design and stays exempt.
          if [[ "$QUIZ_DB_CHANGED" == "true" && "$TEST_PLAN_MODE" != "config-smoke" ]]; then
            for db_result in "$DB_REPLAY_RESULT" "$DISPOSABLE_SQL_RESULT"; do
              if [[ "$db_result" == "skipped" ]]; then
                echo "DB paths changed but a DB gate was skipped: $db_result"
                exit 1
              fi
            done
          fi

          # Same rule for lint: a skip is only success when no lintable
          # web or mobile paths changed.
          if [[ ( "$WEB_CHANGED" == "true" || "$MOBILE_ADMIN_CHANGED" == "true" || "$MOBILE_STOREFRONT_CHANGED" == "true" ) && "$TEST_PLAN_MODE" != "config-smoke" && "$LINT_RESULT" == "skipped" ]]; then
            echo "Web or mobile paths changed but the lint gate was skipped"
            exit 1
          fi

          for result in "$CWV_RUNNER_CONTRACTS_RESULT" "$LINT_RESULT" "$TYPECHECK_RESULT" "$TEST_RESULT" "$WEB_TEST_RESULT" "$MISC_RESULT" "$DB_REPLAY_RESULT" "$DISPOSABLE_SQL_RESULT" "$MOBILE_QUALITY_RESULT" "$SILENT_REVERT_GUARD_RESULT" "$QUIZ_APPROVAL_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "split quality job failed or was cancelled: $result"
                exit 1
                ;;
            esac
          done

          echo "Split quality gates passed."

  mobile-quality:
    name: Mobile Admin Guardrails
    needs: [changes]
    runs-on: ${{ needs.changes.outputs.private_ci_trusted == 'true' && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: ./.github/actions/pnpm-install-cached
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-platform-drift.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-module-size.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin exec vitest run lib/shared-test-fixtures-boundary.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin check:platform-drift
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin check:module-size
      - if: needs.changes.outputs.mobile_admin != 'true' || needs.changes.outputs.test_plan_mode == 'config-smoke'
        run: echo "No mobile-admin changes — skipping mobile guardrail checks"

  build:
    name: Build
    # Only `changes` outputs are consumed below. Running in parallel with the
    # quality jobs (instead of after them) halves the critical path of every
    # PR head: max(test, build) instead of test-then-build.
    needs: [changes]
    runs-on: ${{ needs.changes.outputs.private_ci_trusted == 'true' && vars.BACI_PRIVATE_BUILD_ENABLED == 'true' && needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke' && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    # Bounded build-time storefront reads can extend page-data collection past
    # 30 minutes on a cold runner. Keep enough headroom for that safe pressure
    # control plus setup and post-job cache/checkout cleanup.
    timeout-minutes: ${{ needs.changes.outputs.private_ci_trusted == 'true' && vars.BACI_PRIVATE_BUILD_ENABLED == 'true' && needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke' && 75 || 45 }}
    steps:
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDK space
        if: runner.environment == 'github-hosted' && needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: bash .github/scripts/reclaim-hosted-build-space.sh
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: ./.github/actions/pnpm-install-cached
      - id: next-cache
        name: Restore Next.js build cache
        # Avoid hashing the full installed workspace and restoring a shared
        # cache on the persistent private runner. The checkout above runs
        # `git clean -ffdx` (its default), which also removes the ignored
        # .next/cache, so private builds start cold. A persistent Next.js cache
        # outside the workspace is future work.
        if: runner.environment == 'github-hosted' && needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig*.json', 'apps/web/**/*', 'packages/shared/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --filter @baci/web build:ci
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          SUPABASE_JWT_SECRET: placeholder-jwt-secret
      - name: Save Next.js build cache (main branch only)
        if: >
          runner.environment == 'github-hosted' &&
          needs.changes.outputs.web == 'true' &&
          needs.changes.outputs.test_plan_mode != 'config-smoke' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - if: needs.changes.outputs.web != 'true' || needs.changes.outputs.test_plan_mode == 'config-smoke'
        run: echo "No web changes — skipping build"
