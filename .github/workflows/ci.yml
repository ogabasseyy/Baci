      - name: Verify Quiz Assets
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.quiz_db == 'true'
        run: pnpm --filter @baci/web verify:quiz-assets
      # A migration-only (quiz_db) PR would otherwise satisfy this required gate
      # with no real work, because every other step is web/mobile/production-only.
      # Run the quiz + orders suites (which exercise the RPC-dependent route
      # logic) so a DB-only change is actually validated here. Migration-specific
      # PostgreSQL fixtures run in quality-db-replay; a full from-scratch Supabase apply remains
      # out of scope because it depends on Supabase-specific schema and roles.
      - name: Run Quiz Suite for DB-only Changes
        if: needs.changes.outputs.quiz_db == 'true' && needs.changes.outputs.web != 'true'
        run: >-
          pnpm --filter @baci/web exec vitest run
          src/app/api/quiz
          src/app/api/orders
          src/app/api/merchant/quiz
          src/app/dashboard/quiz
      # Quiz runtime gate: enforced for either supported quiz phase. Phase 1a
      # still signs negotiated-checkout proofs, so validate the runtime secret
      # against the live database there too; production additionally validates
      # prize approval evidence. Run only on trusted main pushes and merge
      # queue integration commits so pull requests stay secret-free.
      - name: Verify Quiz Production Approval
        if: >-
          (
            (
              github.event_name == 'push' &&
              github.ref == 'refs/heads/main'
            ) ||
            github.event_name == 'merge_group'
          ) &&
          (needs.changes.outputs.web == 'true' || needs.changes.outputs.quiz_db == 'true') &&
          (vars.QUIZ_PHASE == '1a' || vars.QUIZ_PHASE == 'production')
        env:
          QUIZ_PHASE: ${{ vars.QUIZ_PHASE }}
          QUIZ_PRODUCTION_APPROVED: ${{ vars.QUIZ_PRODUCTION_APPROVED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUIZ_RPC_SERVER_SECRET: ${{ secrets.QUIZ_RPC_SERVER_SECRET }}
        run: pnpm --filter @baci/web check:quiz-approval
      - name: Run Storefront Guardrail Unit Tests
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront exec jest scripts/check-platform-drift.test.ts scripts/check-module-size.test.ts scripts/check-ad-tracking-native-config.test.ts scripts/validate-fastfile-submit-version-guard.test.ts scripts/validate-fastfile-submit-version-guard-settle.test.ts --runInBand && ruby apps/mobile-storefront/scripts/asc_version_slot_load_test.rb && ruby apps/mobile-storefront/scripts/asc_version_slot_settle_test.rb
      - name: Verify Storefront Ad Tracking Native Config
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:ad-tracking-native-config
      - name: Verify Storefront Route Size
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:route-size
      - name: Verify Storefront Platform Drift
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:platform-drift
      - name: Verify Storefront Module Size
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:module-size
      - if: needs.changes.outputs.mobile_storefront == 'true'
        uses: ./.github/actions/storefront-release-tests
      - name: Run Knip Dead Code Check
        if: needs.changes.outputs.web == 'true'
        run: pnpm knip


  silent-revert-guard:
    name: Silent Revert Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch base branch history
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --filter=blob:none --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Detect silent reverts of recent main commits
        env:
          ALLOW_SILENT_REVERT: ${{ contains(github.event.pull_request.labels.*.name, 'allow-silent-revert') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SILENT_REVERT_LOOKBACK: '80'
        run: node ci_scripts/detect-silent-reverts.mjs

  quality-auditor-selftest:
    uses: ./.github/workflows/muse-review-selftest.yml
    permissions:
      contents: read

  quality:
    name: Quality Gate
    needs: [changes, cwv-runner-contracts, quality-lint, quality-typecheck, quality-test, quality-test-web, quality-misc, quality-db-replay, quality-disposable-sql, mobile-quality, silent-revert-guard, quality-auditor-selftest]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify split quality gate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CWV_RUNNER_CONTRACTS_RESULT: ${{ needs['cwv-runner-contracts'].result }}
          LINT_RESULT: ${{ needs['quality-lint'].result }}
          TYPECHECK_RESULT: ${{ needs['quality-typecheck'].result }}
          TEST_RESULT: ${{ needs['quality-test'].result }}
          MISC_RESULT: ${{ needs['quality-misc'].result }}
          DB_REPLAY_RESULT: ${{ needs['quality-db-replay'].result }}
          DISPOSABLE_SQL_RESULT: ${{ needs['quality-disposable-sql'].result }}
          WEB_TEST_RESULT: ${{ needs['quality-test-web'].result }}
          MOBILE_QUALITY_RESULT: ${{ needs['mobile-quality'].result }}
          SILENT_REVERT_GUARD_RESULT: ${{ needs['silent-revert-guard'].result }}
          AUDITOR_SELFTEST_RESULT: ${{ needs['quality-auditor-selftest'].result }}
          QUIZ_DB_CHANGED: ${{ needs.changes.outputs.quiz_db }}
          TEST_PLAN_MODE: ${{ needs.changes.outputs.test_plan_mode }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job result: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$AUDITOR_SELFTEST_RESULT" != "success" ]]; then
            echo "Auditor selftest did not pass: $AUDITOR_SELFTEST_RESULT"
            exit 1
          fi

          # A skipped DB gate is success only when no DB paths changed: if
          # the detector flagged DB changes, replay and the disposable
          # suites must have actually run (skipped would silently waive
          # them). Config-smoke mode skips by design and stays exempt.
          if [[ "$QUIZ_DB_CHANGED" == "true" && "$TEST_PLAN_MODE" != "config-smoke" ]]; then
            for db_result in "$DB_REPLAY_RESULT" "$DISPOSABLE_SQL_RESULT"; do
              if [[ "$db_result" == "skipped" ]]; then
                echo "DB paths changed but a DB gate was skipped: $db_result"
                exit 1
              fi
            done
          fi

          for result in "$CWV_RUNNER_CONTRACTS_RESULT" "$LINT_RESULT" "$TYPECHECK_RESULT" "$TEST_RESULT" "$WEB_TEST_RESULT" "$MISC_RESULT" "$DB_REPLAY_RESULT" "$DISPOSABLE_SQL_RESULT" "$MOBILE_QUALITY_RESULT" "$SILENT_REVERT_GUARD_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "split quality job failed or was cancelled: $result"
                exit 1
                ;;
            esac
          done

          echo "Split quality gates passed."

  mobile-quality:
    name: Mobile Admin Guardrails
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: ./.github/actions/pnpm-install-cached
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-platform-drift.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-module-size.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin exec vitest run lib/shared-test-fixtures-boundary.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin check:platform-drift
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin check:module-size
      - if: needs.changes.outputs.mobile_admin != 'true' || needs.changes.outputs.test_plan_mode == 'config-smoke'
        run: echo "No mobile-admin changes — skipping mobile guardrail checks"

  build:
    name: Build
    # Only `changes` outputs are consumed below. Running in parallel with the
    # quality jobs (instead of after them) halves the critical path of every
    # PR head: max(test, build) instead of test-then-build.
    needs: [changes]
    runs-on: ubuntu-24.04
    # Bounded build-time storefront reads can extend page-data collection past
    # 30 minutes on a cold runner. Keep enough headroom for that safe pressure
    # control plus setup and post-job cache/checkout cleanup.
    timeout-minutes: 45
    steps:
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDK space
        if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: |
          df -h .
          # This web-only hosted job does not use .NET, Android, or Haskell.
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: ./.github/actions/pnpm-install-cached
      - id: next-cache
        name: Restore Next.js build cache
        if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig*.json', 'apps/web/**/*', 'packages/shared/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --filter @baci/web build:ci
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          SUPABASE_JWT_SECRET: placeholder-jwt-secret
      - name: Save Next.js build cache (main branch only)
        if: >
          needs.changes.outputs.web == 'true' &&
          needs.changes.outputs.test_plan_mode != 'config-smoke' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - if: needs.changes.outputs.web != 'true' || needs.changes.outputs.test_plan_mode == 'config-smoke'
        run: echo "No web changes — skipping build"
