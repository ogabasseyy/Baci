name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required so the quality gate runs on merge-queue integration commits.
  # Without this, an enabled merge queue would deadlock waiting for checks
  # that never start. See the `changes` job for merge_group handling.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# TURBO_TOKEN/TURBO_TEAM are Vercel Remote Cache secrets. They are scoped to the
# individual turbo steps that need them (lint/typecheck/test) rather than the
# workflow-level env, so they are not exposed to unrelated jobs/steps or the
# third-party actions they run. TURBO_SCM_BASE is not a secret and stays global
# so `turbo --affected` can resolve its base ref everywhere.
env:
  TURBO_SCM_BASE: origin/main

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      mobile_admin: ${{ steps.gate.outputs.mobile_admin }}
      mobile_storefront: ${{ steps.gate.outputs.mobile_storefront }}
      test_plan_mode: ${{ steps.test-plan.outputs.mode }}
      test_plan_reason: ${{ steps.test-plan.outputs.reason }}
      web: ${{ steps.gate.outputs.web }}
      quiz_db: ${{ steps.gate.outputs.quiz_db }}
      cwv_runner: ${{ steps.gate.outputs.cwv_runner }}
      deploy_scripts: ${{ steps.gate.outputs.deploy_scripts }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # paths-filter can't infer a base on merge_group events, so skip it there
      # and run every gate (the queue validates the full integration anyway).
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name != 'merge_group'
        with:
          token: ''
          filters: .github/filters/ci.yml
      - name: Resolve change flags (run all gates in the merge queue)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_MOBILE_ADMIN: ${{ steps.filter.outputs.mobile_admin }}
          FILTER_MOBILE_STOREFRONT: ${{ steps.filter.outputs.mobile_storefront }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_QUIZ_DB: ${{ steps.filter.outputs.quiz_db }}
          FILTER_CWV_RUNNER: ${{ steps.filter.outputs.cwv_runner }}
          FILTER_DEPLOY_SCRIPTS: ${{ steps.filter.outputs.deploy_scripts }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            mobile_admin=true
            mobile_storefront=true
            web=true
            quiz_db=true
            cwv_runner=true
            deploy_scripts=true
          else
            mobile_admin="${FILTER_MOBILE_ADMIN:-false}"
            mobile_storefront="${FILTER_MOBILE_STOREFRONT:-false}"
            web="${FILTER_WEB:-false}"
            quiz_db="${FILTER_QUIZ_DB:-false}"
            cwv_runner="${FILTER_CWV_RUNNER:-false}"
            deploy_scripts="${FILTER_DEPLOY_SCRIPTS:-false}"
          fi
          {
            echo "mobile_admin=$mobile_admin"
            echo "mobile_storefront=$mobile_storefront"
            echo "web=$web"
            echo "quiz_db=$quiz_db"
            echo "cwv_runner=$cwv_runner"
            echo "deploy_scripts=$deploy_scripts"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve test plan
        id: test-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/resolve-ci-test-plan.mjs --event "$EVENT_NAME" --base "$TURBO_SCM_BASE"

  cwv-runner-contracts:
    name: CWV Runner Contracts
    needs: [changes]
    if: needs.changes.outputs.cwv_runner == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run CWV runner contract tests
        run: node --test --test-concurrency=1 infra/cwv-runner/*.test.mjs .github/scripts/cwv-runner-*.test.mjs .github/scripts/actionlint-runner-label-contract.test.mjs
      - name: Check CWV runner formatting
        run: pnpm exec biome check infra/cwv-runner .github/scripts/cwv-runner-*.mjs
      - name: Run CWV workflow actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  quality-lint:
    name: Quality Gate - Lint
    needs: [changes]
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run Lint
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo lint --affected
          else
            pnpm turbo lint
          fi

  quality-typecheck:
    name: Quality Gate - Typecheck
    needs: [changes]
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run Typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo typecheck --affected
          else
            pnpm turbo typecheck
          fi

  quality-test:
    name: Quality Gate - Test
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    # Full web/mobile test fan-out reached ~15 minutes warm, but cold runs
    # (Turbo remote cache unavailable) measure 31m+ on GitHub-hosted runners —
    # three consecutive 30m timeouts on cold caches. Keep headroom for Turbo
    # summary and Actions post-job cleanup.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Resolve test plan
        id: test-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --test .github/scripts/resolve-ci-test-plan.test.mjs .github/scripts/resolve-ci-test-plan-config.test.mjs .github/scripts/resolve-ci-non-web-test-filters.test.mjs .github/scripts/run-ci-non-web-tests.test.mjs
          node .github/scripts/resolve-ci-test-plan.mjs --event "$EVENT_NAME" --base "$TURBO_SCM_BASE"
      - name: Run Tests
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_PLAN_MODE: ${{ steps.test-plan.outputs.mode }}
          TEST_PLAN_REASON: ${{ steps.test-plan.outputs.reason }}
        run: |
          if [ "$TEST_PLAN_MODE" = "config-smoke" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm exec biome check turbo.json .github/scripts/resolve-ci-test-plan.mjs .github/scripts/resolve-ci-test-plan.test.mjs .github/scripts/resolve-ci-test-plan-config.mjs .github/scripts/resolve-ci-test-plan-config.test.mjs
            node --test .github/scripts/resolve-ci-test-plan.test.mjs .github/scripts/resolve-ci-test-plan-config.test.mjs
            exit 0
          fi

          if [ "$TEST_PLAN_MODE" = "targeted-web-vitest" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm --filter @baci/web exec vitest run --changed "$TURBO_SCM_BASE" --passWithNoTests
            exit 0
          fi

          if [ "$TEST_PLAN_MODE" = "targeted-storefront-jest" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm --filter @baci/mobile-storefront exec jest --changedSince "$TURBO_SCM_BASE" --runInBand --passWithNoTests
            exit 0
          fi

          if [ "$TEST_PLAN_MODE" = "targeted-web-and-storefront-tests" ]; then
            echo "$TEST_PLAN_REASON"
            pnpm --filter @baci/web exec vitest run --changed "$TURBO_SCM_BASE" --passWithNoTests
            pnpm --filter @baci/mobile-storefront exec jest --changedSince "$TURBO_SCM_BASE" --runInBand --passWithNoTests
            exit 0
          fi

          node .github/scripts/run-ci-non-web-tests.mjs --event "$EVENT_NAME" --base "$TURBO_SCM_BASE"

  quality-test-web:
    name: Quality Gate - Test (web shard ${{ matrix.shard }})
    needs: [changes]
    # Only the full-affected plan runs the complete web suite; targeted plans
    # keep their narrow vitest invocations inside quality-test.
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode == 'full-affected'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # The full web suite verifies immutable historical event-pipeline
          # source bytes. Hydrate blobs during checkout because credentials are
          # deliberately removed before tests and cannot service lazy fetches.
          filter: ''
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Run web vitest shard
        run: pnpm --filter @baci/web exec vitest run --shard=${{ matrix.shard }}/6

  quality-db-replay:
    name: Quality Gate - DB Replay
    needs: [changes]
    if: needs.changes.outputs.quiz_db == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BACI_REPLAY_COMMAND_TIMEOUT_MS: 1800000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Install Supabase replay toolchain
        env:
          SUPABASE_CLI_SHA256: 01a3b8f5861d108a934937cae88e8d503093c3f7d3aa32d959f69b099b4f9ef3
          SUPABASE_CLI_VERSION: 2.95.4
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18=18.3-1.pgdg24.04+1
          SUPABASE_ARCHIVE="${RUNNER_TEMP}/supabase_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz" \
            --output "${SUPABASE_ARCHIVE}"
          echo "${SUPABASE_CLI_SHA256}  ${SUPABASE_ARCHIVE}" | sha256sum --check
          sudo tar -xz -f "${SUPABASE_ARCHIVE}" -C /usr/local/bin supabase
          sudo chmod 0755 /usr/local/bin/supabase
          test "$(supabase --version)" = "${SUPABASE_CLI_VERSION}"
          PSQL_BIN="$(command -v psql)"
          "$PSQL_BIN" --version | grep -Eq '^psql \(PostgreSQL\) 18\.3( \(.+\))?$'
          echo "PSQL_BIN=$PSQL_BIN" >> "$GITHUB_ENV"
      - name: Test final order-notification outbox RPC privileges
        run: >-
          pnpm --filter @baci/web db:replay:chronological
          --sql-check supabase/tests/order_notification_outbox_rpc_privileges.sql
          --sql-check supabase/tests/paystack_order_dva_balance_refresh_permissions.sql
          --sql-check supabase/tests/paystack_order_dva_balance_refresh_history.sql
          --sql-check supabase/tests/agentic_paystack_dva_alias_conflict.sql
          --sql-check supabase/tests/negotiation_customer_contact.sql
          --sql-check supabase/tests/storefront_pdp_preflight_relation_category.sql
          --sql-check supabase/tests/storefront_cluster_guide_candidates_rpc.sql
          --sql-check supabase/tests/storefront_cluster_guide_classifier_behavior.sql
          --sql-check supabase/migrations/tests/admin_order_transaction_discount_cleanup.sql
          --sql-check supabase/migrations/tests/persist_quiz_award_amount_snapshot.sql
          --sql-check supabase/tests/search_products_not_archived_nulls.sql
          --sql-check supabase/migrations/tests/quiz_instant_deadline_publication_v2.sql
          --sql-check supabase/migrations/tests/quiz_instant_deadline_runtime_gate_v2.sql
          --sql-check supabase/migrations/tests/quiz_live_score_publication_gate_v2.sql
          --sql-check supabase/migrations/tests/quiz_instant_live_award_retry_v2.sql
          --sql-check supabase/migrations/tests/quiz_instant_score_repair_lock_order_v2.sql
          --sql-check supabase/migrations/tests/quiz_instant_retry_pending_health_v2.sql
          --sql-check supabase/migrations/tests/quiz_results_wakeup_player_access_v2.sql
          --sql-check supabase/migrations/tests/quiz_test_publication_control_rls_v2.sql
          --sql-check supabase/migrations/tests/quiz_cascade_score_consistency_v2.sql
          --sql-check supabase/migrations/tests/quiz_runtime_gate_stale_health_v2.sql
          --sql-check supabase/migrations/tests/quiz_score_repair_quiescence_gate_v2.sql
          --sql-check supabase/migrations/tests/public_shipping_sender_projection.sql
          --sql-check supabase/migrations/tests/repair_pickup_payment_confirmation.sql
          --sql-check supabase/migrations/tests/repair_pickup_receiver_projection.sql
          --sql-check supabase/migrations/tests/find_resumable_repair_pickup.sql
          --sql-check supabase/migrations/tests/claim_repair_pickup_booking_terminal.sql
          --sql-check supabase/migrations/tests/claim_repair_pickup_booking_manual_fulfilled.sql
          --sql-check supabase/migrations/tests/normalize_nigerian_repair_pickup_receiver_phone.sql
          --sql-check supabase/migrations/tests/repair_pickup_receiver_fulfillment.sql
          --sql-check supabase/migrations/tests/gigl_tracking_orderless_repair_unlink.sql
      - name: Run migration replay regression test
        run: pnpm --filter @baci/web exec vitest run src/lib/agentic/order-private-schema-usage-migration.test.ts
      - name: Test Cache Invalidation Outbox SQL
        run: >-
          bash supabase/tests/run-cache-invalidation-outbox-test-runner.test.sh &&
          bash supabase/tests/run-cache-invalidation-outbox-test.sh

  quality-misc:
    name: Quality Gate - Misc
    needs: [changes]
    if: (needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile_storefront == 'true' || needs.changes.outputs.quiz_db == 'true' || needs.changes.outputs.deploy_scripts == 'true') && needs.changes.outputs.test_plan_mode != 'config-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Test Migration Version Guard
        run: bash .github/scripts/check-migration-versions.test.sh
      - name: Test Migration Applier Collision Handling
        run: bash .github/scripts/run-migration-applier-tests.sh
      - name: Verify Migration Versions
        run: bash .github/scripts/check-migration-versions.sh
      - name: Run CI Test Planner Unit Tests
        if: needs.changes.outputs.web == 'true'
        run: node --test .github/scripts/resolve-ci-test-plan.test.mjs .github/scripts/resolve-ci-test-plan-config.test.mjs .github/scripts/quiz-production-approval-workflow.test.mjs
      - name: Run storefront origin cost-contract tests
        if: needs.changes.outputs.web == 'true'
        run: >-
          pnpm --filter @baci/shared test -- src/storefront/delivery-evidence.test.ts src/storefront/delivery-evidence-manifest.test.ts &&
          pnpm --filter @baci/cloudflare-evidence-qualification-worker test &&
          pnpm --filter @baci/web exec vitest run tools/cost/storefront-origin-budget.test.ts tools/cost/ogabassey-current-origin-baseline.test.ts tools/cost/qualify-cloudflare-evidence-sources.test.ts tools/cost/cloudflare-evidence-process-isolation.test.ts tools/cost/mutate-cloudflare-evidence-sources.test.ts tools/cost/measure-cloudflare-evidence-sources.test.ts tools/cost/verify-cloudflare-evidence-token-policy.test.ts tools/cost/verify-cloudflare-evidence-read-token-policy.test.ts tools/cost/cloudflare-evidence-run-journal.test.ts
      - name: Test Deployment and VPS Worker Scripts
        if: needs.changes.outputs.deploy_scripts == 'true'
        run: >-
          pnpm --dir vps-workers test &&
          node --test
          .github/scripts/current-main-deploy-guard.test.mjs
          .github/scripts/deploy-vps-readiness-checkout.test.mjs
          .github/scripts/deploy-with-retry-current-main.test.mjs
          .github/scripts/deploy-with-retry.test.mjs
          .github/scripts/run-pinned-vercel.test.mjs
          .github/scripts/inject-prebuilt-env-secret.jwk.test.mjs
          .github/scripts/inject-prebuilt-env-secret.test.mjs
          .github/scripts/sync-cloudflare-vercel-production-env.test.mjs
          .github/scripts/storefront-release-coherence.test.mjs
          .github/scripts/storefront-release-coherence-warming.test.mjs
          .github/scripts/storefront-release-config.test.mjs
          .github/scripts/storefront-release-marker.test.mjs
      - name: Verify Quiz Assets
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.quiz_db == 'true'
        run: pnpm --filter @baci/web verify:quiz-assets
      # A migration-only (quiz_db) PR would otherwise satisfy this required gate
      # with no real work, because every other step is web/mobile/production-only.
      # Run the quiz + orders suites (which exercise the RPC-dependent route
      # logic) so a DB-only change is actually validated here. Migration-specific
      # PostgreSQL fixtures run in quality-db-replay; a full from-scratch Supabase apply remains
      # out of scope because it depends on Supabase-specific schema and roles.
      - name: Run Quiz Suite for DB-only Changes
        if: needs.changes.outputs.quiz_db == 'true' && needs.changes.outputs.web != 'true'
        run: >-
          pnpm --filter @baci/web exec vitest run
          src/app/api/quiz
          src/app/api/orders
          src/app/api/merchant/quiz
          src/app/dashboard/quiz
      # Quiz runtime gate: enforced for either supported quiz phase. Phase 1a
      # still signs negotiated-checkout proofs, so validate the runtime secret
      # against the live database there too; production additionally validates
      # prize approval evidence. Run only on trusted main pushes and merge
      # queue integration commits so pull requests stay secret-free.
      - name: Verify Quiz Production Approval
        if: >-
          (
            (
              github.event_name == 'push' &&
              github.ref == 'refs/heads/main'
            ) ||
            github.event_name == 'merge_group'
          ) &&
          (needs.changes.outputs.web == 'true' || needs.changes.outputs.quiz_db == 'true') &&
          (vars.QUIZ_PHASE == '1a' || vars.QUIZ_PHASE == 'production')
        env:
          QUIZ_PHASE: ${{ vars.QUIZ_PHASE }}
          QUIZ_PRODUCTION_APPROVED: ${{ vars.QUIZ_PRODUCTION_APPROVED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUIZ_RPC_SERVER_SECRET: ${{ secrets.QUIZ_RPC_SERVER_SECRET }}
        run: pnpm --filter @baci/web check:quiz-approval
      - name: Run Storefront Guardrail Unit Tests
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront exec jest scripts/check-platform-drift.test.ts scripts/check-module-size.test.ts scripts/check-ad-tracking-native-config.test.ts --runInBand
      - name: Verify Storefront Ad Tracking Native Config
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:ad-tracking-native-config
      - name: Verify Storefront Route Size
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:route-size
      - name: Verify Storefront Platform Drift
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:platform-drift
      - name: Verify Storefront Module Size
        if: needs.changes.outputs.mobile_storefront == 'true'
        run: pnpm --filter @baci/mobile-storefront check:module-size
      - if: needs.changes.outputs.mobile_storefront == 'true'
        uses: ./.github/actions/storefront-release-tests
      - name: Run Knip Dead Code Check
        if: needs.changes.outputs.web == 'true'
        run: pnpm knip


  silent-revert-guard:
    name: Silent Revert Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch base branch history
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --filter=blob:none --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Detect silent reverts of recent main commits
        env:
          ALLOW_SILENT_REVERT: ${{ contains(github.event.pull_request.labels.*.name, 'allow-silent-revert') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SILENT_REVERT_LOOKBACK: '80'
        run: node ci_scripts/detect-silent-reverts.mjs

  quality:
    name: Quality Gate
    needs: [changes, cwv-runner-contracts, quality-lint, quality-typecheck, quality-test, quality-test-web, quality-misc, quality-db-replay, mobile-quality, silent-revert-guard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify split quality gate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CWV_RUNNER_CONTRACTS_RESULT: ${{ needs['cwv-runner-contracts'].result }}
          LINT_RESULT: ${{ needs['quality-lint'].result }}
          TYPECHECK_RESULT: ${{ needs['quality-typecheck'].result }}
          TEST_RESULT: ${{ needs['quality-test'].result }}
          MISC_RESULT: ${{ needs['quality-misc'].result }}
          DB_REPLAY_RESULT: ${{ needs['quality-db-replay'].result }}
          WEB_TEST_RESULT: ${{ needs['quality-test-web'].result }}
          MOBILE_QUALITY_RESULT: ${{ needs['mobile-quality'].result }}
          SILENT_REVERT_GUARD_RESULT: ${{ needs['silent-revert-guard'].result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes job result: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$CWV_RUNNER_CONTRACTS_RESULT" "$LINT_RESULT" "$TYPECHECK_RESULT" "$TEST_RESULT" "$WEB_TEST_RESULT" "$MISC_RESULT" "$DB_REPLAY_RESULT" "$MOBILE_QUALITY_RESULT" "$SILENT_REVERT_GUARD_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "split quality job failed or was cancelled: $result"
                exit 1
                ;;
            esac
          done

          echo "Split quality gates passed."

  mobile-quality:
    name: Mobile Admin Guardrails
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: ./.github/actions/pnpm-install-cached
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-platform-drift.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin exec vitest run scripts/check-module-size.test.ts
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin check:platform-drift
      - if: needs.changes.outputs.mobile_admin == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --dir apps/mobile-admin check:module-size
      - if: needs.changes.outputs.mobile_admin != 'true' || needs.changes.outputs.test_plan_mode == 'config-smoke'
        run: echo "No mobile-admin changes — skipping mobile guardrail checks"

  build:
    name: Build
    # Only `changes` outputs are consumed below. Running in parallel with the
    # quality jobs (instead of after them) halves the critical path of every
    # PR head: max(test, build) instead of test-then-build.
    needs: [changes]
    runs-on: ubuntu-24.04
    # Bounded build-time storefront reads can extend page-data collection past
    # 30 minutes on a cold runner. Keep enough headroom for that safe pressure
    # control plus setup and post-job cache/checkout cleanup.
    timeout-minutes: 45
    steps:
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: ./.github/actions/pnpm-install-cached
      - id: next-cache
        name: Restore Next.js build cache
        if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig*.json', 'apps/web/**/*', 'packages/shared/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
        run: pnpm --filter @baci/web build:ci
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          SUPABASE_JWT_SECRET: placeholder-jwt-secret
      - name: Save Next.js build cache (main branch only)
        if: >
          needs.changes.outputs.web == 'true' &&
          needs.changes.outputs.test_plan_mode != 'config-smoke' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - if: needs.changes.outputs.web != 'true' || needs.changes.outputs.test_plan_mode == 'config-smoke'
        run: echo "No web changes — skipping build"
