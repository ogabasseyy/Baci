  quality-disposable-sql:
    name: Quality Gate - Disposable SQL Suites
    needs: [changes]
    if: needs.changes.outputs.quiz_db == 'true' && needs.changes.outputs.test_plan_mode != 'config-smoke'
    runs-on: ${{ needs.changes.outputs.private_ci_trusted == 'true' && fromJSON('["self-hosted","Linux","X64","baci-private-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    services:
      postgres:
        # Pinned to the same PostgreSQL release as the DB Replay toolchain (18.6). The digest is the
        # multi-architecture manifest list of postgres:18.6 (Docker Hub, verified 2026-11-11; its linux/amd64
        # image is sha256:e923a22ac074261dd73970c57edf659475bf0497cb9456f17d98ed7cdd3ca913). The first step
        # asserts that the running container reports 18.6, so a stale or mistyped digest fails the job instead
        # of passing silently. Needs Docker on the runner (checked on the Contabo CI server). Docker picks the
        # host port (the steps read it from job.services.postgres.ports), so two Disposable SQL jobs on one
        # server never collide on 5432.
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Assert the database container runs the pinned PostgreSQL release
        env:
          CONTAINER_ID: ${{ job.services.postgres.id }}
          # 18.6 written as server_version_num (major * 10000 + minor); keep in step with the image tag above.
          EXPECTED_SERVER_VERSION_NUM: '180006'
        run: |
          set -euo pipefail
          actual="$(docker exec "$CONTAINER_ID" psql -U postgres -X -At -c 'SHOW server_version_num')"
          if [ "$actual" != "$EXPECTED_SERVER_VERSION_NUM" ]; then
            echo "::error::the postgres service container reports server_version_num ${actual:-unknown}, expected ${EXPECTED_SERVER_VERSION_NUM} (the image tag and digest must name the same release)"
            exit 1
          fi
          echo "Database container reports server_version_num ${actual}"
      - name: Install PostgreSQL client and server binaries
        run: |
          set -euo pipefail
          # Pre-installed on the self-hosted CI server, whose runner user has no sudo. RUNNER_ENVIRONMENT is a
          # default variable the runner sets for every job: 'github-hosted' or 'self-hosted'.
          if [ "$RUNNER_ENVIRONMENT" = 'github-hosted' ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client postgresql-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb
      - name: Test storefront order explicit delegation
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          TEST_LINE_ENDINGS=lf python3 supabase/tests/run_storefront_order_explicit_columns.py
          TEST_LINE_ENDINGS=crlf python3 supabase/tests/run_storefront_order_explicit_columns.py

      - name: Run disposable search suites
        env:
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/migrations/tests/run-disposable-search-suites.sh

      - name: Test serialized inventory pagination
        env:
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/migrations/tests/run-serialized-inventory-pagination.sh

      - name: Test serialized inventory listing edit fields
        env:
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          TEST_LINE_ENDINGS=lf bash supabase/tests/run-serialized-inventory-listing-fields.sh
          TEST_LINE_ENDINGS=crlf bash supabase/tests/run-serialized-inventory-listing-fields.sh

      - name: Run X token authentication SQL contract
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          command -v node >/dev/null
          for binary in initdb pg_ctl psql; do
            test -x "$PG_BIN/$binary"
          done
          node --test .github/scripts/x-pixel-token-authentication.sql.test.mjs

      - name: Test PiggyVest stuck-funds runbook SQL
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          python3 -I supabase/tests/run_piggyvest_stuck_funds_runbook.py

      - name: Run IMEI authenticated access SQL contracts
        env:
          IMEI_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 supabase/tests/run_imei_access_boundary.py

