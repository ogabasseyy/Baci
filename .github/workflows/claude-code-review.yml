name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Parse review command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          first_line="$(printf '%s\n' "$COMMENT_BODY" | tr -d '\r' | awk 'NF { print; exit }')"

          if [[ "$first_line" == '/claude review' ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping Claude review because the first non-empty line is not exactly /claude review."

      - name: Checkout repository
        if: steps.command.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        if: steps.command.outputs.should_run == 'true'
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Run Claude Code Review
        if: steps.command.outputs.should_run == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}

            Review contract:
            - Always post a PR review. If there are no meaningful issues, post a concise no-findings review.
            - Prioritize correctness, security, data safety, auth/tenant isolation, payment safety, regressions, and missing tests.
            - Enforce Baci rules: pnpm/Turborepo only, Biome not ESLint, React Compiler means no routine React.memo/useMemo/useCallback, Zod at API boundaries, auth first in protected routes, no select('*'), and append-only migrations.
            - For Next.js 16 and React 19, prefer Server Components, avoid client-side data waterfalls, keep uncached data behind Suspense where required, use next/image and next/font, and preserve storefront Core Web Vitals.
            - For Supabase changes, check RLS, scoped queries, explicit column selection, service-role isolation, and race conditions around read-modify-write flows.
            - For public storefront changes, check semantic HTML, metadata, JSON-LD, accessible labels, keyboard behavior, focus states, and themed CSS variables instead of hardcoded storefront colors.
            - Do not speculate beyond the PR diff and repository evidence. Do not produce broad style commentary when there is no concrete risk.
            - Use these sections in the posted review: Verdict, Findings, Suggested next steps. Findings must be flat bullets with severity and file path when possible.
          # Set the repository variable CLAUDE_MODEL to pin a specific Claude model.
          claude_args: >-
            ${{ vars.CLAUDE_MODEL != '' && format('--model {0}', vars.CLAUDE_MODEL) || '' }}
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
