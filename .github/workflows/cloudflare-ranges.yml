name: Cloudflare Ranges Freshness

# The cart quota identity trusts CF-Connecting-IP only from peers in
# Cloudflare's published egress ranges, hardcoded in
# apps/web/src/lib/cloudflare-peer.ts. This check fails when Cloudflare
# publishes different ranges so the trust anchor cannot go silently
# stale: update the constants (and fetch date) to fix it.

on:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - apps/web/src/lib/cloudflare-peer.ts
      - .github/workflows/cloudflare-ranges.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare hardcoded ranges with Cloudflare publication
        run: |
          set -euo pipefail
          file=apps/web/src/lib/cloudflare-peer.ts
          # Extract only the two named range arrays, anchored by their
          # const declarations, so other CIDR-shaped literals elsewhere
          # in the file can neither pollute nor dodge the check.
          sed -n '/^const CLOUDFLARE_IPV4_RANGES = \[/,/^] as const;/p' "$file" \
            | grep -oE "'[^']+'" | tr -d "'" | sort > /tmp/hardcoded-v4.txt
          sed -n '/^const CLOUDFLARE_IPV6_RANGES = \[/,/^] as const;/p' "$file" \
            | grep -oE "'[^']+'" | tr -d "'" | sort > /tmp/hardcoded-v6.txt
          test -s /tmp/hardcoded-v4.txt && test -s /tmp/hardcoded-v6.txt
          curl -fsS https://www.cloudflare.com/ips-v4 | sort > /tmp/live-v4.txt
          curl -fsS https://www.cloudflare.com/ips-v6 | sort > /tmp/live-v6.txt
          diff -u /tmp/live-v4.txt /tmp/hardcoded-v4.txt
          diff -u /tmp/live-v6.txt /tmp/hardcoded-v6.txt
          echo "Cloudflare ranges match the published lists."
      # A red scheduled run nobody sees helps no one: drift silently
      # collapses verified-visitor identity back into the shared
      # egress bucket. File (or refresh) an issue instead.
      - name: Open an issue when ranges drift (scheduled runs)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title='Cloudflare egress ranges drifted from cloudflare-peer.ts'
          body='The weekly freshness check failed: Cloudflare published egress ranges that differ from the hardcoded lists in `apps/web/src/lib/cloudflare-peer.ts`. Until updated, shoppers arriving via unlisted egress ranges lose verified-visitor quota identity and share the egress bucket. Update `CLOUDFLARE_IPV4_RANGES`/`CLOUDFLARE_IPV6_RANGES` (and the fetch date) from https://www.cloudflare.com/ips-v4 and /ips-v6. Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
