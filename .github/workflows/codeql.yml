# CodeQL Security Analysis Workflow
# Performs static code analysis to find security vulnerabilities

name: "CodeQL"

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  schedule:
    # Run weekly on Sundays at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  # Only cancel in-progress for PRs, allow scheduled/push scans to complete
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The CodeQL CLI license does not cover this private personal repository.
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (toJSON(github.event.repository.private) == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'actions']

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # Pin to full SHA for supply chain security
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Keep CodeQL configuration source explicit to avoid stale config drift in code scanning UI
          config-file: ./.github/codeql/codeql-config.yml
          # Use extended security queries for more comprehensive analysis
          queries: security-extended,security-and-quality

      - name: Autobuild
        # Pin to full SHA for supply chain security
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        # Pin to full SHA for supply chain security
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  private-unavailable:
    name: CodeQL unavailable for private repository
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (toJSON(github.event.repository.private) == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain unavailable CodeQL scan
        run: |
          echo '::warning::CodeQL is unavailable for this private repository under its current license.'
          echo 'CodeQL is unavailable for this private repository under its current license. Semgrep continues to run separately; it has different coverage.' >> "$GITHUB_STEP_SUMMARY"
