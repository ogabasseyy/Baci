# Diff Guardian — a QUORUM gate over the AI code reviewers.
#
# WHY THIS EXISTS
# The repo already runs several AI reviewers (Gemini, Jules, Claude, CodeRabbit,
# Codex). Each is good but each, alone, occasionally (a) raises a false-positive
# you can't easily refute, or (b) crashes/times out. If any single reviewer is a
# *required* merge gate, one bad call or one outage blocks every merge.
#
# Diff Guardian fixes that by VOTING: it watches the other reviewers' pass/fail
# results on the PR and reports ONE status — and it only BLOCKS the merge when a
# QUORUM of reviewers agree there is a problem. So:
#   - one reviewer false-positives  -> does NOT block (others didn't agree)
#   - one reviewer is down/flaky     -> does NOT block (it just abstains)
#   - two+ reviewers flag a problem  -> BLOCKS (real signal, worth a human look)
#
# It re-implements no model calls; it only tallies the existing reviewers'
# statuses, so it's cheap and can't itself hallucinate.
#
# HOW TO ADOPT (branch protection, main):
#   1. Let this run on a few PRs first and confirm the `Diff Guardian / quorum`
#      status appears and matches your expectation.
#   2. Then in main's required status checks: ADD `Diff Guardian / quorum`, and REMOVE the
#      individual `Gemini review` / `Jules review` from *required* (they keep
#      running + commenting, just no longer block on their own). Diff Guardian
#      becomes the single AI gate. Keep `Build` + `Quality Gate` (tests) required.
#   3. Escape hatch: add the `bypass-ai-gate` label to a PR to force this green
#      (same label the individual reviewers already honor).
#
# TUNING: edit VOTERS (the reviewers to tally) and BLOCK_QUORUM (how many must
# agree to block) in the env block below. With 2 voters, BLOCK_QUORUM=2 means
# "both must agree to block" (lenient — favors not-blocking). Add `Claude review`
# as a 3rd voter (once it auto-runs + sets a status) and set BLOCK_QUORUM=2 for a
# true majority.
#
# NOTE (merge queue): the voter reviewers run on `pull_request`, not
# `merge_group`. If/when you enable the merge queue, add `merge_group` triggers
# to the voters AND here, or this gate will just pass on the queue.

name: Diff Guardian

on:
  # This workflow never checks out or executes pull-request code. Run in the
  # base-repo context so fork PRs can get the statuses:write token GitHub
  # withholds from pull_request runs.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # Re-tally when an automatic (pull_request) voter run finishes. Same-repo voter
  # runs carry the PR head SHA + pull_requests on their workflow_run completion;
  # manual comment-triggered voter runs do not (GitHub runs issue_comment against
  # the default branch), so this gate deliberately does NOT listen to comments —
  # it always reflects the latest automatic voter results for the current head.
  workflow_run:
    workflows: [Gemini Code Review, Jules PR Review]
    types: [completed]

permissions:
  contents: read
  statuses: write
  checks: read
  pull-requests: read

concurrency:
  # Collapse repeated pull_request_target runs for the same PR (newest push
  # wins). Each workflow_run completion gets a unique group so a voter completion
  # can never cancel an in-flight pull_request_target tally and leave the
  # required status stuck pending.
  group: diff-guardian-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}-${{ github.event_name == 'pull_request_target' && 'pr' || github.run_id }}
  cancel-in-progress: true

jobs:
  guardian:
    name: AI Review Quorum
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tally AI reviewers and gate by quorum
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || '' }}
          PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          # The reviewers to tally (commit-status context or check-run names), pipe-separated.
          VOTERS: 'Gemini review|Jules review'
          # How many voters must report a FAILURE for Diff Guardian to BLOCK.
          BLOCK_QUORUM: '2'
        run: |
          set -euo pipefail

          set_status() { # state, description
            gh api -X POST "repos/$REPO/statuses/$SHA" \
              -f state="$1" \
              -f context='Diff Guardian / quorum' \
              -f description="$2" \
              -f target_url="https://github.com/$REPO/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          }

          resolve_pr_from_commit() {
            [ -n "${SHA:-}" ] || return 0
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPO/commits/$SHA/pulls" \
              --jq '.[0].number // empty' 2>/dev/null || true
          }

          if [ -z "${PR:-}" ]; then
            PR="$(resolve_pr_from_commit)"
          fi

          if [ -z "${PR:-}" ]; then
            echo "::notice::Diff Guardian trigger has no associated PR; nothing to tally."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPO/pulls/$PR")"
          current_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
          if [ -z "${SHA:-}" ]; then
            SHA="$current_sha"
          fi
          if [ "$SHA" != "$current_sha" ]; then
            echo "::notice::Ignoring stale Diff Guardian trigger for $SHA; PR #$PR now points at $current_sha."
            exit 0
          fi

          head_repo="$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name')"
          has_bypass="$(printf '%s' "$pr_json" | jq -r '[.labels[].name] | index("bypass-ai-gate") != null')"
          is_fork_pr="false"
          if [ "$head_repo" != "$REPO" ]; then
            is_fork_pr="true"
          fi

          if [ "$has_bypass" = "true" ]; then
            # Security: on a FORK PR, an external contributor can push new commits
            # after a maintainer applied the bypass. Do not honor a stale bypass
            # across a fork head change — require the maintainer to re-review and
            # re-apply the label (re-adding fires a fresh `labeled` event).
            if [ "$is_fork_pr" = "true" ] && [ "$EVENT_ACTION" = "synchronize" ]; then
              echo "::error::Fork PR changed after 'bypass-ai-gate' was applied. Re-review the new commits and re-apply the label."
              set_status failure "Fork PR changed; re-review and re-apply bypass-ai-gate"
              exit 1
            fi
            echo "::notice::'bypass-ai-gate' label present — Diff Guardian passing without tallying."
            set_status success "Bypassed via bypass-ai-gate label"
            exit 0
          fi
          # Removing the bypass label does not re-run the individual voters.
          # Fail closed until a new commit re-runs them, otherwise stale
          # bypass-success votes can be misread as real review passes.
          if [ "$EVENT_ACTION" = "unlabeled" ] && [ "$EVENT_LABEL" = "bypass-ai-gate" ]; then
            echo "::error::'bypass-ai-gate' label was removed. Push a new commit to re-run AI reviewers before Diff Guardian can tally them."
            set_status failure "Push a new commit after removing bypass-ai-gate"
            exit 1
          fi

          # Fork PRs get no automatic same-repo voter runs, and GitHub does not
          # reliably carry the PR head SHA to comment-triggered voter
          # `workflow_run` completions, so a manual fork review cannot be
          # re-tallied against this head. Fail closed: a maintainer reviews the
          # fork PR and adds 'bypass-ai-gate' to merge (bypass is honored above).
          if [ "$is_fork_pr" = "true" ]; then
            echo "::error::Diff Guardian: fork PR requires maintainer review + the 'bypass-ai-gate' label to merge."
            set_status failure "Fork PR: add 'bypass-ai-gate' after maintainer review"
            exit 1
          fi

          # Every event (pull_request_target incl. label changes, and reviewer
          # workflow_run completions) flows into the single tally below. The tally
          # is idempotent: with no voter results yet it posts `pending`; a
          # label-only change therefore never clobbers an already-decided status,
          # and a reviewer completion always re-tallies.

          # Pipe-separated -> newline list of voter contexts.
          voters="$(printf '%s\n' "$VOTERS" | tr '|' '\n' | sed '/^$/d')"
          voter_count="$(printf '%s\n' "$voters" | grep -c . || true)"
          echo "Voters ($voter_count): $(printf '%s' "$VOTERS")  |  block quorum: $BLOCK_QUORUM"

          # A voter can report either as a commit status (external services) or
          # as a check run (GitHub Actions). Gemini currently reports both; Jules
          # currently reports only a check run. Read both current GitHub API
          # surfaces so a check-only voter cannot be mistaken as missing.
          status_state() {
            printf '%s' "$1" | jq -r --arg c "$2" \
              '([.statuses[] | select(.context==$c)] | sort_by(.updated_at) | last | .state) // "missing"'
          }

          # A completed check that did not clearly pass or fail (timed_out,
          # cancelled, action_required, skipped, stale, startup_failure, …) is an
          # ABSTENTION, not a blocking vote — a reviewer outage must never block.
          check_state() {
            printf '%s' "$1" | jq -r --arg c "$2" '
              ([.check_runs[] | select(.name==$c)]
                | sort_by(.completed_at // .started_at // .created_at // "")
                | last) as $run
              | if $run == null then "missing"
                elif $run.status != "completed" then "pending"
                elif ($run.conclusion // "") == "success" then "success"
                elif ($run.conclusion // "") == "neutral" then "success"
                elif ($run.conclusion // "") == "failure" then "failure"
                else "abstain"
                end
            '
          }

          # Combine the two surfaces into one vote. A real success/failure on
          # either wins; otherwise pending (still running) outranks abstain (done,
          # no verdict) outranks missing (never appeared). A commit-status "error"
          # is treated as an abstention (infra failure), not a blocking vote.
          voter_state() {
            local cs cr
            cs="$(status_state "$1" "$3")"
            cr="$(check_state "$2" "$3")"
            case "$cs" in
              success|failure)
                printf '%s' "$cs"
                return
                ;;
            esac
            case "$cr" in
              success|failure)
                printf '%s' "$cr"
                return
                ;;
            esac
            if [ "$cs" = "pending" ] || [ "$cr" = "pending" ]; then printf 'pending' ; return ; fi
            if [ "$cs" = "error" ] || [ "$cr" = "abstain" ]; then printf 'abstain' ; return ; fi
            printf 'missing'
          }

          combined="$(gh api "repos/$REPO/commits/$SHA/status" 2>/dev/null || echo '{"statuses":[]}')"
          checks="$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" 2>/dev/null | jq -s '{"check_runs":[.[].check_runs[]?]}' 2>/dev/null || echo '{"check_runs":[]}')"

          reported=0 ; blocking=0 ; active_pending=0 ; abstained=0 ; missing=0 ; summary=""
          while IFS= read -r ctx; do
            [ -z "$ctx" ] && continue
            st="$(voter_state "$combined" "$checks" "$ctx")"
            summary="${summary}${ctx}=${st}; "
            case "$st" in
              failure) reported=$((reported+1)); blocking=$((blocking+1)) ;;
              success) reported=$((reported+1)) ;;
              pending) active_pending=$((active_pending+1)) ;;
              abstain) abstained=$((abstained+1)) ;;
              *)       missing=$((missing+1)) ;;
            esac
          done <<< "$voters"

          # "Outstanding" = voters that have NOT reported a verdict yet but still
          # could (running, or no check created yet). Abstentions (done, no
          # verdict — timeout/outage) are final and excluded, so an outage can
          # never keep the gate pending nor count toward the block quorum.
          unknown=$((active_pending + missing))
          echo "${summary}| reported=$reported blocking=$blocking pending=$active_pending abstained=$abstained missing=$missing outstanding=$unknown quorum=$BLOCK_QUORUM"

          # BLOCK: a quorum of voters reported real, blocking failures.
          if [ "$blocking" -ge "$BLOCK_QUORUM" ]; then
            echo "::error::Diff Guardian: $blocking reviewers flagged blocking issues (quorum $BLOCK_QUORUM). Fix the findings, or add 'bypass-ai-gate'."
            set_status failure "$blocking reviewers flagged blocking issues (quorum $BLOCK_QUORUM)"
            exit 1
          fi

          # PASS: even if every still-outstanding voter were to fail, the block
          # quorum is unreachable. Covers all-success, success+lone-failure, and
          # one-real-failure+one-abstention (an outage never blocks).
          if [ $((blocking + unknown)) -lt "$BLOCK_QUORUM" ]; then
            echo "Diff Guardian: block quorum unreachable ($blocking blocking + $unknown outstanding < $BLOCK_QUORUM) — passing."
            set_status success "No reviewer quorum on blocking issues ($blocking/$BLOCK_QUORUM)"
            exit 0
          fi

          # Otherwise an outstanding voter could still reach the block quorum. Stay
          # pending; a reviewer workflow_run completion re-tallies. There is no
          # fixed poll window, so a slow voter (Jules can run for hours) is always
          # awaited rather than declared green prematurely.
          echo "Diff Guardian: outstanding voters could still reach block quorum; awaiting completion."
          set_status pending "Waiting for AI reviewer completion"
