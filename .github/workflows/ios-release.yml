name: iOS Production Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile-admin/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      # pnpm patches ship native code (e.g. expo-modules-jsi); a patch or
      # lockfile-only change must still trigger a release build.
      - 'patches/**'
      - 'pnpm-lock.yaml'
    tags:
      # Tag pushes bypass the paths filter above (GitHub Actions behaviour).
      - 'v*-admin-ios'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'iOS build number override (leave empty for auto)'
        required: false
        type: string

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  RUBY_VERSION: '3.4'
  XCODE_VERSION: '26.2'
  WORKING_DIR: apps/mobile-admin
  # Offset added to github.run_number to avoid collisions with
  # build numbers previously uploaded via EAS or manual Xcode archives.
  BUILD_NUMBER_BASE: '30'
  # Major.minor for App Store version. Patch auto-appends build number.
  # Bump manually when releasing a breaking/feature change (e.g., 2.0 -> 2.1).
  APP_VERSION_MAJOR_MINOR: '2.0'

jobs:
  build-and-submit:
    name: Build IPA & Submit to App Store Connect
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          # This release job later materializes signing, match, and ASC secrets.
          # Keep Bundler cache restores disabled here to avoid executing restored
          # cache contents in a secret-bearing job; install gems explicitly below.
          bundler-cache: false
          working-directory: ${{ env.WORKING_DIR }}

      - name: Install Ruby dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: bundle install --jobs 4 --retry 3

      - name: Disable Node type stripping
        run: echo "NODE_OPTIONS=--no-strip-types" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_CHROME_SKIP_DOWNLOAD: 'true'
          PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify Expo Router release tree
        run: >-
          pnpm --filter baci-mobile-admin exec vitest run
          scripts/expo-router-app-tree.test.ts

      - name: Expose PostHog CLI to Xcode
        run: |
          POSTHOG_CLI_JS="$(node --print "require.resolve('@posthog/cli/run-posthog-cli.js')")"
          if [ ! -f "$POSTHOG_CLI_JS" ]; then
            echo "::error::@posthog/cli run-posthog-cli.js is not available after pnpm install"
            exit 1
          fi

          # PostHog's React Native Xcode helper requires an executable path at
          # $HOME/.posthog/posthog-cli. Use a tiny Node wrapper so the release
          # job does not depend on pnpm preserving executable bits on JS shims.
          chmod +x "$POSTHOG_CLI_JS"
          mkdir -p "$HOME/.posthog"
          # Inject --skip-on-conflict for dSYM uploads. Admin and storefront share a
          # PostHog project, so their shared framework dSYMs (ExpoModulesJSI, etc.)
          # collide; posthog-cli treats the conflict as fatal and aborts the archive.
          # upload-symbols.sh (posthog-ios pod) runs "posthog-cli dsym upload ..."
          # with no conflict flag and no env hook, so add it here (CLI >= 0.7.12
          # supports it): existing symbol sets are kept and this app's own dSYM
          # still uploads so its native crashes symbolicate.
          {
            echo '#!/usr/bin/env sh'
            # shellcheck disable=SC2016 # $1/$2/$@ must remain literal in the generated wrapper.
            printf 'if [ "$1" = "dsym" ] && [ "$2" = "upload" ]; then exec node "%s" "$@" --skip-on-conflict; fi\n' "$POSTHOG_CLI_JS"
            printf 'exec node "%s" "$@"\n' "$POSTHOG_CLI_JS"
          } > "$HOME/.posthog/posthog-cli"
          chmod +x "$HOME/.posthog/posthog-cli"
          "$HOME/.posthog/posthog-cli" --version

      - name: Resolve build number
        id: version
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NUMBER_BASE: ${{ env.BUILD_NUMBER_BASE }}
          APP_VERSION_MAJOR_MINOR: ${{ env.APP_VERSION_MAJOR_MINOR }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          elif [ "$GH_REF_TYPE" = "tag" ]; then
            BUILD_NUMBER="${GH_REF_NAME#v}"
            BUILD_NUMBER="${BUILD_NUMBER%-admin-ios}"
          else
            BUILD_NUMBER=$(( GH_RUN_NUMBER + BUILD_NUMBER_BASE ))
          fi

          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid build number '$BUILD_NUMBER'. Use a positive integer (>=1)."
            exit 1
          fi

          if ! [[ "$APP_VERSION_MAJOR_MINOR" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid APP_VERSION_MAJOR_MINOR '$APP_VERSION_MAJOR_MINOR'. Must match <major>.<minor> (e.g., 2.0)." >&2
            exit 1
          fi

          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "IOS_APP_VERSION=${APP_VERSION_MAJOR_MINOR}.$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Materialize iOS Firebase config
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GOOGLE_SERVICES_PLIST_BASE64: ${{ secrets.IOS_ADMIN_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_PLIST_BASE64" ]; then
            umask 077
            echo "$GOOGLE_SERVICES_PLIST_BASE64" | base64 -d > GoogleService-Info.plist
            chmod 600 GoogleService-Info.plist
            echo "Materialized GoogleService-Info.plist from secret"
          elif [ -f GoogleService-Info.plist ]; then
            echo "IOS_ADMIN_GOOGLE_SERVICE_INFO_PLIST_BASE64 not set; using tracked plist"
          else
            echo "::error::Missing apps/mobile-admin/GoogleService-Info.plist and secret"
            exit 1
          fi

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          if [ -z "$ASC_API_KEY_P8_BASE64" ] || [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ]; then
            echo "::error::ASC_API_KEY_P8_BASE64, ASC_API_KEY_ID, and ASC_API_ISSUER_ID secrets must be set"
            exit 1
          fi
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          umask 077
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Configure match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          if [ -z "$MATCH_DEPLOY_KEY" ]; then
            echo "::error::MATCH_DEPLOY_KEY secret is required"
            exit 1
          fi
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/match_deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Generate iOS project via Expo prebuild
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: '1'
          IOS_BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
          IOS_APP_VERSION: ${{ env.IOS_APP_VERSION }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_REVENUECAT_API_KEY_IOS: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY_IOS }}
          ADMIN_TIKTOK_APP_ID: ${{ secrets.ADMIN_TIKTOK_APP_ID }}
          ADMIN_TIKTOK_APP_SECRET: ${{ secrets.ADMIN_TIKTOK_APP_SECRET }}
        run: pnpm exec expo prebuild --platform ios --clean

      - name: Fix prebuild signing style for archive
        # Expo prebuild sets CODE_SIGN_IDENTITY="Apple Distribution"; Fastlane
        # match will override, but the default breaks automatic resolution.
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          PBXPROJ="ios/BaciTheEcommerceBuilder.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/"Apple Distribution"/"Apple Development"/g' "$PBXPROJ" || true
          fi

      - name: Install CocoaPods
        # Intentionally do not restore an actions/cache CocoaPods directory in this
        # secret-bearing signing job. The storefront release can keep its cache
        # because this admin workflow prioritizes cache-poisoning resistance over speed.
        working-directory: ${{ env.WORKING_DIR }}/ios
        env:
          LANG: en_US.UTF-8
        run: |
          bundle exec pod install --repo-update

      - name: Fastlane release
        id: fastlane_release
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_REVENUECAT_API_KEY_IOS: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY_IOS }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ env.ASC_API_KEY_PATH }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios release

      - name: Upload IPA artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-admin-release-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIR }}/build/*.ipa
            ${{ env.WORKING_DIR }}/build/*.app.dSYM.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Resolve App Store submission eligibility
        if: ${{ !cancelled() && steps.fastlane_release.outcome == 'success' }}
        id: submit_guard
        shell: bash
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
        run: |
          allow_submit=false
          reason="not a protected App Store submission trigger"

          if [ "$GH_EVENT_NAME" = "push" ] && [ "$GH_REF" = "refs/heads/main" ]; then
            # Checkout disables persisted credentials. Fetch exactly the main ref
            # we will compare against with a one-command token header, then diff
            # against the fetched remote-tracking object. This avoids GitHub
            # Compare API file-list caps and avoids a race where an API SHA and a
            # later branch fetch point at different main commits.
            # Use Git's credential helper instead of precomputing a Basic
            # auth header. GitHub masks GITHUB_TOKEN itself in logs, but it does
            # not automatically mask transformed values such as base64 output.
            # shellcheck disable=SC2016 # Git invokes the helper later; keep env expansion out of this shell.
            git -c credential.helper='!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f' \
              fetch --no-tags --prune --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            FETCHED_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
            if [ -z "$FETCHED_MAIN_SHA" ]; then
              echo "::error::Unable to determine fetched main HEAD"
              exit 1
            fi

            if [ "$GITHUB_SHA" = "$FETCHED_MAIN_SHA" ]; then
              allow_submit=true
              reason="current main HEAD"
            else
              RELEVANT_SUCCESSOR_FILES="$(git diff --name-only "${GITHUB_SHA}" "${FETCHED_MAIN_SHA}" -- pnpm-lock.yaml apps/mobile-admin packages/shared)"
              if [ -n "$RELEVANT_SUCCESSOR_FILES" ]; then
                echo "Relevant successor release files:"
                printf '%s\n' "$RELEVANT_SUCCESSOR_FILES"
                reason="stale mobile-admin release build"
              else
                allow_submit=true
                reason="current mobile-admin release content; main only advanced by unrelated paths"
              fi
            fi
          elif [ "$GH_EVENT_NAME" = "push" ] && [ "$GH_REF_TYPE" = "tag" ] && [[ "$GH_REF_NAME" == v*-admin-ios ]]; then
            allow_submit=true
            reason="admin iOS release tag"
          else
            reason="${GH_EVENT_NAME} on ${GH_REF}"
          fi

          if [ "$allow_submit" = "true" ]; then
            echo "allow_submit=true" >> "$GITHUB_OUTPUT"
            echo "App Store review submission enabled for ${reason}."
          else
            echo "allow_submit=false" >> "$GITHUB_OUTPUT"
            echo "Skipping App Store review submission for ${reason}."
          fi

      - name: Resolve release notes
        if: ${{ !cancelled() && steps.fastlane_release.outcome == 'success' && steps.submit_guard.outputs.allow_submit == 'true' }}
        shell: bash
        env:
          WORKFLOW_NOTES: ${{ vars.IOS_ADMIN_RELEASE_NOTES }}
        run: |
          NOTES="${WORKFLOW_NOTES:-Bug fixes and performance improvements.}"
          NOTES="${NOTES:0:4000}"
          DELIM="EOF_$(uuidgen | tr -d '-')"
          {
            echo "IOS_RELEASE_NOTES<<$DELIM"
            echo "$NOTES"
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      # Auto-submit the freshly-uploaded build for App Store review, mirroring
      # the storefront pipeline. `fastlane ios submit` runs deliver with
      # submit_for_review + automatic_release, so once Apple approves it releases
      # automatically. The submit lane waits for App Store Connect processing,
      # so deliver can attach the build without relying on altool wait flags.
      - name: Submit to App Store for review
        # !cancelled() drops the implicit success() so a transient failure of the
        # preceding artifact-upload step can't skip submission once the build is
        # already on TestFlight; gate purely on the fastlane release outcome and
        # the release-trigger eligibility guard.
        if: ${{ !cancelled() && steps.fastlane_release.outcome == 'success' && steps.submit_guard.outputs.allow_submit == 'true' }}
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ env.ASC_API_KEY_PATH }}
          SUBMIT_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SUBMIT_APP_VERSION: ${{ env.IOS_APP_VERSION }}
          APP_STORE_PROCESSING_WAIT_TIMEOUT_SECONDS: '2400'
        run: |
          if [ -z "${IOS_RELEASE_NOTES:-}" ]; then
            echo "::error::IOS_RELEASE_NOTES was not resolved before App Store submission"
            exit 1
          fi
          bundle exec fastlane ios submit

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
          rm -f ~/.ssh/match_deploy_key
          security delete-keychain fastlane_match_keychain 2>/dev/null || true
          if ! git -C "$GITHUB_WORKSPACE" ls-files --error-unmatch "$WORKING_DIR/GoogleService-Info.plist" >/dev/null 2>&1; then
            rm -f "$GITHUB_WORKSPACE/$WORKING_DIR/GoogleService-Info.plist"
          fi
