name: iOS RuntimeScheduler PR Gate

# PR-time Xcode 26 check for the expo-modules-jsi SWIFT_RETURNS_RETAINED patch.
# Full storefront release still re-runs this on macos-26; this gate catches
# patch regressions before merge without waiting for the post-main release job.

on:
  pull_request:
    paths:
      - 'patches/expo-modules-jsi@*'
      - '.github/scripts/ios-runtime-scheduler.test.mjs'
      - '.github/workflows/ios-runtime-scheduler-pr.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: ios-runtime-scheduler-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  XCODE_VERSION: '26.2'

jobs:
  runtime-scheduler:
    name: Swift RuntimeScheduler compatibility
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer"

      - name: Install JS deps
        uses: ./.github/actions/pnpm-install-cached

      - name: Verify Swift RuntimeScheduler compatibility
        run: pnpm exec node --test .github/scripts/ios-runtime-scheduler.test.mjs
