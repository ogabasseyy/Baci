name: iOS Storefront Production Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile-storefront/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      # pnpm patches ship native code (e.g. expo-modules-jsi); a patch or
      # lockfile-only change must still trigger a release build.
      - 'patches/**'
      - 'pnpm-lock.yaml'
    tags:
      - 'v*-storefront-ios'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'iOS build number override (leave empty for auto)'
        required: false
        type: string

concurrency:
  group: ios-storefront-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACI_MOBILE_BUILD_PLATFORM: ios
  NODE_VERSION: '24'
  RUBY_VERSION: '3.4'
  XCODE_VERSION: '26.2'
  WORKING_DIR: apps/mobile-storefront
  BUILD_NUMBER_BASE: '30'
  # Major.minor for App Store version. Patch auto-appends build number.
  APP_VERSION_MAJOR_MINOR: '2.1'

jobs:
  build-and-submit:
    name: Build Storefront IPA & Submit to App Store Connect
    runs-on: macos-26
    timeout-minutes: 90
    # App Store Connect has a single editable version slot, and the submit lane
    # can withdraw an in-progress review to claim it. Share one job-level group
    # with ios-storefront-submit.yml so the two submission paths can never race
    # to cancel the same review or rename the same version. This is job-level on
    # purpose: the workflow-level group above keeps cancelling superseded
    # release builds, which this must not undo.
    concurrency:
      group: ios-storefront-app-store-submission
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ${{ env.WORKING_DIR }}

      - name: Disable Node type stripping
        run: echo "NODE_OPTIONS=--no-experimental-strip-types" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_CHROME_SKIP_DOWNLOAD: 'true'
          PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      - name: Expose PostHog CLI to Xcode
        working-directory: ${{ env.WORKING_DIR }}
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" expose-posthog-cli

      - name: Resolve build number
        id: version
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NUMBER_BASE: ${{ env.BUILD_NUMBER_BASE }}
          APP_VERSION_MAJOR_MINOR: ${{ env.APP_VERSION_MAJOR_MINOR }}
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" resolve-build

      - name: Materialize iOS Firebase config
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GOOGLE_SERVICES_PLIST_BASE64: ${{ secrets.IOS_STOREFRONT_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" materialize-firebase

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" materialize-asc-key

      - name: Configure match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" configure-match-ssh

      - name: Generate iOS project via Expo prebuild
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: '1'
          IOS_BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
          IOS_APP_VERSION: ${{ env.IOS_APP_VERSION }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_QUIZ_ADS_ENABLED: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID != '' && 'true' || 'false' }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID }}
          STOREFRONT_ADMOB_ANDROID_APP_ID: ${{ secrets.STOREFRONT_ADMOB_ANDROID_APP_ID }}
          STOREFRONT_ADMOB_IOS_APP_ID: ${{ secrets.STOREFRONT_ADMOB_IOS_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          STOREFRONT_TIKTOK_APP_SECRET: ${{ secrets.STOREFRONT_TIKTOK_APP_SECRET }}
          STOREFRONT_FACEBOOK_APP_ID: ${{ secrets.STOREFRONT_FACEBOOK_APP_ID }}
          STOREFRONT_FACEBOOK_CLIENT_TOKEN: ${{ secrets.STOREFRONT_FACEBOOK_CLIENT_TOKEN }}
        run: pnpm exec expo prebuild --platform ios --clean

      - name: Fix prebuild signing style for archive
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          PBXPROJ="ios/Ogabassey.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/"Apple Distribution"/"Apple Development"/g' "$PBXPROJ" || true
          fi

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache only CocoaPods downloads, never the generated Pods tree.
          # The latter contains local podspec snapshots and becomes invalid
          # whenever React Native or Expo changes, which caused the release
          # job to reject React-Core-prebuilt after prebuild.
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-storefront-cocoapods-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile-storefront/ios/Podfile') }}

      - name: Install CocoaPods
        working-directory: ${{ env.WORKING_DIR }}/ios
        env:
          LANG: en_US.UTF-8
        run: bundle exec pod install --repo-update

      - name: Fastlane release
        id: fastlane_release
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST != '' && secrets.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_QUIZ_ADS_ENABLED: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID != '' && 'true' || 'false' }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID }}
          STOREFRONT_ADMOB_ANDROID_APP_ID: ${{ secrets.STOREFRONT_ADMOB_ANDROID_APP_ID }}
          STOREFRONT_ADMOB_IOS_APP_ID: ${{ secrets.STOREFRONT_ADMOB_IOS_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ env.ASC_API_KEY_PATH }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          STOREFRONT_FACEBOOK_APP_ID: ${{ secrets.STOREFRONT_FACEBOOK_APP_ID }}
          STOREFRONT_FACEBOOK_CLIENT_TOKEN: ${{ secrets.STOREFRONT_FACEBOOK_CLIENT_TOKEN }}
        run: bundle exec fastlane ios release

      - name: Upload IPA artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-storefront-release-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIR }}/build/*.ipa
            ${{ env.WORKING_DIR }}/build/*.app.dSYM.zip
          retention-days: 30
          if-no-files-found: warn

      # Auto-submit the freshly-uploaded build for App Store review, mirroring
      # the Android workflow's straight-to-production publish. `fastlane ios
      # submit` runs `deliver(submit_for_review: true, automatic_release: true)`,
      # so once Apple approves it releases automatically. The build is already
      # processed (the release lane waited), so deliver can attach it.
      #
      # The in-app update gate is intentionally NOT bumped here: a build only
      # becomes downloadable after Apple's review, which can take hours and may
      # be rejected. Prompting users on TestFlight upload was the old bug. The
      # gate is now driven by the App Store's actual live state via the
      # `ios-live-build-sync` cron reconciler (App Store Connect API).
      - name: Submit to App Store for review
        # !cancelled() drops the implicit success() so a transient failure of the
        # preceding artifact-upload step can't skip submission once the build is
        # already on TestFlight; gate purely on the fastlane release outcome.
        if: ${{ !cancelled() && steps.fastlane_release.outcome == 'success' }}
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ env.ASC_API_KEY_PATH }}
          SUBMIT_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SUBMIT_APP_VERSION: ${{ env.IOS_APP_VERSION }}
          IOS_RELEASE_NOTES: ${{ vars.IOS_STOREFRONT_RELEASE_NOTES }}
          IOS_REVIEW_NOTES: ${{ vars.IOS_STOREFRONT_REVIEW_NOTES }}
          # IOS_STOREFRONT_CANCEL_REVIEW_FOR_RESUBMIT is deliberately NOT set
          # here. This run is cancellable: the workflow-level group above
          # cancels the whole run when a newer commit lands on main, and no
          # job-level setting can prevent that. Withdrawing a review here could
          # therefore be interrupted between cancel_submission and deliver,
          # leaving the app with nothing under review. When the slot is taken
          # this lane skips and the build waits on TestFlight; withdraw-and-
          # replace lives in ios-storefront-submit.yml, whose run is never
          # cancelled by a competing one.
        run: bundle exec fastlane ios submit

      - name: Clean up secrets
        if: always()
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" cleanup
