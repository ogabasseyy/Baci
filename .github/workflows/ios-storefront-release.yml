name: iOS Storefront Production Release

on:
  # Storefront release gate: while .github/storefront-release-gate.json exists,
  # a store release starts only from an owner tag or a manual dispatch, never
  # from a push to main. docs/runbooks/storefront-release-gate.md records the
  # push trigger to restore when the gate ends.
  push:
    tags:
      - 'v*-storefront-ios'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'iOS build number override (leave empty for auto)'
        required: false
        type: string
      testflight_only:
        description: 'Upload to TestFlight without submitting for App Review'
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-storefront-release-${{ github.ref }}${{ (github.event_name == 'workflow_dispatch' && inputs.testflight_only) && '-testflight' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
  BACI_MOBILE_BUILD_PLATFORM: ios
  # Compile Expo consumers against the same resolved JSI headers and library.
  EXPO_USE_PRECOMPILED_MODULES: '0'
  NODE_VERSION: '24'
  RUBY_VERSION: '3.4'
  XCODE_VERSION: '26.2'
  WORKING_DIR: apps/mobile-storefront
  BUILD_NUMBER_BASE: '30'
  # Major.minor for App Store version. Patch auto-appends build number.
  APP_VERSION_MAJOR_MINOR: '2.1'

jobs:
  build-and-submit:
    name: Build Storefront IPA & Submit to App Store Connect
    runs-on: macos-26
    timeout-minutes: 90
    # App Store Connect has a single editable version slot, and the submit lane
    # can withdraw an in-progress review to claim it. Share one job-level group
    # with ios-storefront-submit.yml so the two submission paths can never race
    # to cancel the same review or rename the same version. This is job-level on
    # purpose: the workflow-level group above keeps cancelling superseded
    # release builds, which this must not undo. TestFlight-only uploads use
    # their own queue so they cannot replace a pending production submission.
    concurrency:
      group: ${{ (github.event_name == 'workflow_dispatch' && inputs.testflight_only) && 'ios-storefront-testflight-upload' || 'ios-storefront-app-store-submission' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the next step can confirm the commit is on main.
          fetch-depth: 0
          persist-credentials: false

      # Storefront release gate: a store release ships only a commit that is
      # already on main, so it passed review and the gate's CI check. This
      # runs before anything else; docs/runbooks/storefront-release-gate.md.
      - name: Refuse release sources that are not on main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo '::error::This release commit is not on main. Store releases ship only reviewed commits from main; see docs/runbooks/storefront-release-gate.md.' >&2
            exit 1
          fi

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ${{ env.WORKING_DIR }}

      - name: Disable Node type stripping
        run: echo "NODE_OPTIONS=--no-experimental-strip-types" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_CHROME_SKIP_DOWNLOAD: 'true'
          PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      # This regression targets the pinned Xcode 26.x ownership diagnostics.
      # Reevaluate the compatibility patch before upgrading to Xcode 27.
      - name: Verify Swift RuntimeScheduler compatibility
        run: node --test .github/scripts/ios-runtime-scheduler.test.mjs

      - name: Verify native gradient composition
        run: bash apps/mobile-storefront/scripts/native-regressions/check-gradient-layer.sh

      - name: Verify native clipping geometry and traversal work
        run: bash apps/mobile-storefront/scripts/native-regressions/check-clipping-views.sh

      - name: Verify native Sentry breadcrumb policy and MetricKit integration
        run: |
          node --test apps/mobile-storefront/config/sentry-native-diagnostics.test.mjs
          bash apps/mobile-storefront/scripts/native-regressions/check-sentry-diagnostics.sh

      - name: Verify scene presentation Swift and legacy window fallback
        run: node --test .github/scripts/ios-scene-presentation.test.mjs apps/mobile-storefront/config/ios-scene-presentation.test.mjs

      - name: Verify Expo JSI symbol regression fixtures
        run: node --test .github/scripts/verify-ios-expo-jsi-symbols.test.mjs

      - name: Verify Podfile precompiled-modules precedence
        run: node --test apps/mobile-storefront/ios/podfile-precompiled-modules-precedence.test.mjs

      - name: Expose PostHog CLI to Xcode
        working-directory: ${{ env.WORKING_DIR }}
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" expose-posthog-cli

      - name: Resolve build number
        id: version
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NUMBER_BASE: ${{ env.BUILD_NUMBER_BASE }}
          APP_VERSION_MAJOR_MINOR: ${{ env.APP_VERSION_MAJOR_MINOR }}
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" resolve-build

      - name: Materialize iOS Firebase config
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GOOGLE_SERVICES_PLIST_BASE64: ${{ secrets.IOS_STOREFRONT_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" materialize-firebase

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" materialize-asc-key

      - name: Configure match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" configure-match-ssh

      - name: Generate iOS project via Expo prebuild
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: '1'
          IOS_BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
          IOS_APP_VERSION: ${{ env.IOS_APP_VERSION }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_QUIZ_ADS_ENABLED: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID != '' && 'true' || 'false' }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID }}
          EXPO_PUBLIC_MOBILE_ADS_ENABLED: ${{ secrets.EXPO_PUBLIC_MOBILE_ADS_ENABLED }}
          EXPO_PUBLIC_ADMOB_ANDROID_QUIZ_START_INTERSTITIAL_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_QUIZ_START_INTERSTITIAL_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_QUIZ_START_INTERSTITIAL_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_QUIZ_START_INTERSTITIAL_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_HOME_STRIP_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_HOME_STRIP_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_HOME_STRIP_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_HOME_STRIP_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_PRODUCT_GRID_IN_FEED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_PRODUCT_GRID_IN_FEED_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_PRODUCT_GRID_IN_FEED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_PRODUCT_GRID_IN_FEED_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_PRODUCT_GRID_MPU_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_PRODUCT_GRID_MPU_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_PRODUCT_GRID_MPU_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_PRODUCT_GRID_MPU_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_CART_MPU_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_CART_MPU_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_CART_MPU_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_CART_MPU_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_ORDER_SUCCESS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_ORDER_SUCCESS_BANNER_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_ORDER_SUCCESS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_ORDER_SUCCESS_BANNER_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_FOOTER_ANCHOR_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_FOOTER_ANCHOR_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_FOOTER_ANCHOR_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_FOOTER_ANCHOR_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_POST_ORDER_INTERSTITIAL_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_POST_ORDER_INTERSTITIAL_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_POST_ORDER_INTERSTITIAL_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_POST_ORDER_INTERSTITIAL_UNIT_ID }}
          STOREFRONT_ADMOB_ANDROID_APP_ID: ${{ secrets.STOREFRONT_ADMOB_ANDROID_APP_ID }}
          STOREFRONT_ADMOB_IOS_APP_ID: ${{ secrets.STOREFRONT_ADMOB_IOS_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          STOREFRONT_TIKTOK_APP_SECRET: ${{ secrets.STOREFRONT_TIKTOK_APP_SECRET }}
          STOREFRONT_FACEBOOK_APP_ID: ${{ secrets.STOREFRONT_FACEBOOK_APP_ID }}
          STOREFRONT_FACEBOOK_CLIENT_TOKEN: ${{ secrets.STOREFRONT_FACEBOOK_CLIENT_TOKEN }}
        run: |
          pnpm exec expo config --type public --json | node ../../.github/scripts/sentry-storefront-provenance.mjs ios
          pnpm exec expo prebuild --platform ios --clean

      - name: Fix prebuild signing style for archive
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          PBXPROJ="ios/Ogabassey.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/"Apple Distribution"/"Apple Development"/g' "$PBXPROJ" || true
          fi

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile-storefront/ios/Pods
          key: ${{ runner.os }}-storefront-pods-${{ hashFiles('apps/mobile-storefront/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-storefront-pods-

      - name: Install CocoaPods
        working-directory: ${{ env.WORKING_DIR }}/ios
        env:
          LANG: en_US.UTF-8
        run: bundle exec pod install --repo-update

      - name: Fastlane release
        id: fastlane_release
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WEB_API_URL: https://usebaci.com
          EXPO_PUBLIC_API_URL: https://usebaci.com
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST != '' && secrets.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_QUIZ_ADS_ENABLED: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID != '' && 'true' || 'false' }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_BANNER_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_ANDROID_REWARDED_UNIT_ID }}
          EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_QUIZ_ADMOB_IOS_REWARDED_UNIT_ID }}
          EXPO_PUBLIC_MOBILE_ADS_ENABLED: ${{ secrets.EXPO_PUBLIC_MOBILE_ADS_ENABLED }}
          EXPO_PUBLIC_ADMOB_ANDROID_QUIZ_START_INTERSTITIAL_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_QUIZ_START_INTERSTITIAL_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_QUIZ_START_INTERSTITIAL_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_QUIZ_START_INTERSTITIAL_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_HOME_STRIP_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_HOME_STRIP_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_HOME_STRIP_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_HOME_STRIP_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_PRODUCT_GRID_IN_FEED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_PRODUCT_GRID_IN_FEED_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_PRODUCT_GRID_IN_FEED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_PRODUCT_GRID_IN_FEED_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_PRODUCT_GRID_MPU_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_PRODUCT_GRID_MPU_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_PRODUCT_GRID_MPU_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_PRODUCT_GRID_MPU_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_CART_MPU_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_CART_MPU_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_CART_MPU_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_CART_MPU_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_ORDER_SUCCESS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_ORDER_SUCCESS_BANNER_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_ORDER_SUCCESS_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_ORDER_SUCCESS_BANNER_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_FOOTER_ANCHOR_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_FOOTER_ANCHOR_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_FOOTER_ANCHOR_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_FOOTER_ANCHOR_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_ANDROID_POST_ORDER_INTERSTITIAL_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_POST_ORDER_INTERSTITIAL_UNIT_ID }}
          EXPO_PUBLIC_ADMOB_IOS_POST_ORDER_INTERSTITIAL_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_IOS_POST_ORDER_INTERSTITIAL_UNIT_ID }}
          STOREFRONT_ADMOB_ANDROID_APP_ID: ${{ secrets.STOREFRONT_ADMOB_ANDROID_APP_ID }}
          STOREFRONT_ADMOB_IOS_APP_ID: ${{ secrets.STOREFRONT_ADMOB_IOS_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ env.ASC_API_KEY_PATH }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          STOREFRONT_FACEBOOK_APP_ID: ${{ secrets.STOREFRONT_FACEBOOK_APP_ID }}
          STOREFRONT_FACEBOOK_CLIENT_TOKEN: ${{ secrets.STOREFRONT_FACEBOOK_CLIENT_TOKEN }}
        run: bundle exec fastlane ios release

      - name: Upload IPA artifact
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-storefront-release-${{ github.sha }}
          path: |
            ${{ env.WORKING_DIR }}/build/*.ipa
            ${{ env.WORKING_DIR }}/build/*.app.dSYM.zip
          retention-days: 30
          if-no-files-found: warn

      # Auto-submit the freshly-uploaded build for App Store review, mirroring
      # the Android workflow's straight-to-production publish. `fastlane ios
      # submit` runs `deliver(submit_for_review: true, automatic_release: true)`,
      # so once Apple approves it releases automatically. The build is already
      # processed (the release lane waited), so deliver can attach it.
      #
      # The in-app update gate is intentionally NOT bumped here: a build only
      # becomes downloadable after Apple's review, which can take hours and may
      # be rejected. Prompting users on TestFlight upload was the old bug. The
      # gate is now driven by the App Store's actual live state via the
      # `ios-live-build-sync` cron reconciler (App Store Connect API).
      - name: Submit to App Store for review
        id: submit
        # !cancelled() drops the implicit success() so a transient failure of the
        # preceding artifact-upload step can't skip submission once the build is
        # already on TestFlight; gate purely on the fastlane release outcome.
        if: ${{ !cancelled() && steps.fastlane_release.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.testflight_only) }}
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ env.ASC_API_KEY_PATH }}
          SUBMIT_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SUBMIT_APP_VERSION: ${{ env.IOS_APP_VERSION }}
          IOS_RELEASE_NOTES: ${{ vars.IOS_STOREFRONT_RELEASE_NOTES }}
          IOS_REVIEW_NOTES: ${{ vars.IOS_STOREFRONT_REVIEW_NOTES }}
          # IOS_STOREFRONT_CANCEL_REVIEW_FOR_RESUBMIT is deliberately NOT set
          # here. This run is cancellable: the workflow-level group above
          # cancels the whole run when a newer commit lands on main, and no
          # job-level setting can prevent that. Withdrawing a review here could
          # therefore be interrupted between cancel_submission and deliver,
          # leaving the app with nothing under review. When the slot is taken
          # this lane skips and the build waits on TestFlight; withdraw-and-
          # replace lives in ios-storefront-submit.yml, whose run is never
          # cancelled by a competing one.
        run: bundle exec fastlane ios submit

      - name: Record release mode
        if: ${{ always() && steps.fastlane_release.outcome == 'success' }}
        env:
          TESTFLIGHT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight_only }}
          SUBMISSION_RESULT: ${{ steps.submit.outputs.app_store_submission }}
        run: |
          if [ "$TESTFLIGHT_ONLY" = "true" ]; then
            echo 'This run uploaded a TestFlight build only. App Store submission was intentionally skipped.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SUBMISSION_RESULT" = "submitted" ]; then
            echo 'This run uploaded the iOS build and submitted it for App Store review.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SUBMISSION_RESULT" = "skipped" ]; then
            echo 'This run uploaded a TestFlight build, but App Store submission was skipped because the App Store version slot is occupied.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Fastlane completed without recording an App Store submission result; inspect the Fastlane logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up secrets
        if: always()
        run: bash "${{ github.workspace }}/.github/scripts/ios-storefront-release.sh" cleanup
