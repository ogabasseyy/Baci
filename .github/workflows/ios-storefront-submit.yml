name: iOS Storefront Submit for Review

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'TestFlight build number to submit (leave empty for latest)'
        required: false
        type: string
      app_version:
        description: 'App Store version (leave empty for latest editable)'
        required: false
        type: string
      release_notes:
        description: 'What''s New in This Version (leave empty for default)'
        required: false
        type: string
      cancel_review_for_resubmit:
        description: 'Withdraw the in-progress App Review submission so this build can replace it'
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-storefront-submit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUBY_VERSION: '3.4'
  WORKING_DIR: apps/mobile-storefront

jobs:
  submit:
    name: Submit Storefront to App Store Review
    runs-on: macos-26
    # Withdrawal waits up to 10 minutes for Apple to free the editable version
    # before set_changelog and deliver even start, so this needs headroom: a
    # timeout between cancel_submission and deliver strands the app with
    # nothing under review.
    timeout-minutes: 45
    # Shared with ios-storefront-release.yml's build-and-submit job so a manual
    # submit can never race the automatic one over the single editable version
    # slot. This workflow is the only one that may withdraw a live review, and
    # its runs are never cancelled by a competing run (cancel-in-progress is
    # false on both its groups), so the withdraw-to-submit critical section
    # cannot be interrupted by CI.
    concurrency:
      group: ios-storefront-app-store-submission
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ${{ env.WORKING_DIR }}

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          if [ -z "$ASC_API_KEY_P8_BASE64" ] || [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ]; then
            echo "::error::ASC_API_KEY_P8_BASE64, ASC_API_KEY_ID, and ASC_API_ISSUER_ID secrets must be set"
            exit 1
          fi
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          umask 077
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve release notes
        shell: bash
        env:
          WORKFLOW_NOTES: ${{ inputs.release_notes }}
        run: |
          NOTES="${WORKFLOW_NOTES:-Bug fixes and performance improvements.}"
          NOTES="${NOTES:0:4000}"
          DELIM="EOF_$(uuidgen | tr -d '-')"
          {
            echo "IOS_RELEASE_NOTES<<$DELIM"
            echo "$NOTES"
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Fastlane submit
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CI: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_PATH: ${{ env.ASC_API_KEY_PATH }}
          IOS_RELEASE_NOTES: ${{ env.IOS_RELEASE_NOTES }}
          SUBMIT_BUILD_NUMBER: ${{ inputs.build_number }}
          SUBMIT_APP_VERSION: ${{ inputs.app_version }}
          # Opt-in, per run: without it the lane skips submission instead of
          # withdrawing a build Apple may be actively reviewing.
          IOS_STOREFRONT_CANCEL_REVIEW_FOR_RESUBMIT: ${{ inputs.cancel_review_for_resubmit }}
        run: bundle exec fastlane ios submit

      - name: Clean up secrets
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
