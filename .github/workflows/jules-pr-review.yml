name: Jules PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: >-
    jules-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{
      github.event_name == 'pull_request' && 'fast' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == '/jules deep review' ||
      startsWith(toJSON(github.event.comment.body), '"/jules deep review\n') ||
      startsWith(toJSON(github.event.comment.body), '"/jules deep review\r\n')) &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR') &&
      'deep') ||
      format('comment-{0}', github.event.comment.id)
    }}
  cancel-in-progress: true

jobs:
  review:
    name: Jules review
    # Keep automatic fast reviews same-repo only: forked pull_request runs do not receive
    # JULES_API_KEY, so running them would only post noisy fallback reviews instead of useful output.
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.body == '/jules deep review' ||
      startsWith(toJSON(github.event.comment.body), '"/jules deep review\n') ||
      startsWith(toJSON(github.event.comment.body), '"/jules deep review\r\n')) &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Run Jules review
        continue-on-error: true
        env:
          COMMENT_AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_MODE: ${{ github.event_name == 'issue_comment' && 'deep' || 'fast' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          body_file="$RUNNER_TEMP/jules-review.md"
          meta_file="$RUNNER_TEMP/jules-review-meta.env"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

          if [[ "${EVENT_NAME}" == "pull_request" ]] && echo "${PR_LABELS:-[]}" | jq -e '.[] | select(.name == "bypass-ai-gate")' >/dev/null 2>&1; then
            reviewed_sha="${HEAD_SHA:-}"
            if [[ -n "${reviewed_sha}" ]]; then
              printf 'REVIEWED_SHA=%s\n' "${reviewed_sha}" > "${meta_file}"
            fi

            review_marker="<!-- jules-pr-review mode:${REVIEW_MODE} sha:${reviewed_sha} -->"
            cat > "${body_file}" <<EOF
          ${review_marker}
          ## Jules PR review

          Mode: \`${REVIEW_MODE}\`

          Jules skipped this run because the pull request has the \`bypass-ai-gate\` label after human verification.
          EOF
            exit 0
          fi

          if [[ "${REVIEW_MODE}" == "fast" ]]; then
            poll_deadline_epoch=$(( $(date +%s) + 7200 ))
          else
            # Stop polling shortly before the 6-hour job timeout so fallback review posting still runs.
            poll_deadline_epoch=$(( $(date +%s) + 21000 ))
          fi

          if [[ "${REVIEW_MODE}" == "deep" ]]; then
            normalized_comment_body="$(printf '%s' "${COMMENT_BODY:-}" | tr -d '\r')"

            if [[ "${normalized_comment_body}" != "/jules deep review" && "${normalized_comment_body}" != "/jules deep review"$'\n'* ]]; then
              review_marker="<!-- jules-pr-review mode:${REVIEW_MODE} command:ignored -->"
              cat > "$body_file" <<EOF
          ${review_marker}
          ## Jules PR review

          Mode: \`${REVIEW_MODE}\`

          Jules skipped this run because the comment did not start with \`/jules deep review\`.
          EOF
              exit 0
            fi
          fi

          uri_encode() {
            jq -rn --arg value "$1" '$value | @uri'
          }

          curl_common_args=(
            --fail
            --silent
            --show-error
            --location
            --connect-timeout 10
            --max-time 60
          )

          curl_retry_args=(
            --retry 3
            --retry-delay 2
            --retry-all-errors
          )

          github_api_get() {
            local url="$1"

            curl "${curl_common_args[@]}" "${curl_retry_args[@]}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${url}"
          }

          github_api_get_raw() {
            local url="$1"

            curl "${curl_common_args[@]}" "${curl_retry_args[@]}" \
              -H "Accept: application/vnd.github.raw" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${url}"
          }

          jules_api_get() {
            local url="$1"

            curl "${curl_common_args[@]}" "${curl_retry_args[@]}" \
              -H "x-goog-api-key: ${JULES_API_KEY}" \
              "${url}"
          }

          jules_api_post_json() {
            local url="$1"
            local payload="$2"

            # Large PRs produce multi-MB session payloads (the prompt embeds
            # every file's diff excerpt). Passing that via `curl -d "$string"`
            # puts the entire body in argv and hits ARG_MAX. Route through a
            # temp file with --data-binary @file instead.
            local payload_file
            payload_file="$(mktemp "${RUNNER_TEMP:-/tmp}/jules-payload-XXXXXX.json")"
            printf '%s' "${payload}" > "${payload_file}"

            local exit_code=0
            curl "${curl_common_args[@]}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${JULES_API_KEY}" \
              --data-binary "@${payload_file}" \
              "${url}" || exit_code=$?

            rm -f "${payload_file}"
            return "${exit_code}"
          }

          # Write PR metadata to a temp file and parse via `jq --slurpfile` /
          # explicit file input to avoid passing large JSON through `<<<` here-strings,
          # which can exceed ARG_MAX / bash here-string buffering on large PRs.
          pr_file="$RUNNER_TEMP/jules-pr.json"
          github_api_get \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > "${pr_file}"

          base_ref="$(jq -r '.base.ref' "${pr_file}")"
          head_ref="$(jq -r '.head.ref' "${pr_file}")"
          head_sha="$(jq -r '.head.sha' "${pr_file}")"
          pr_state="$(jq -r '.state' "${pr_file}")"
          pr_title="$(jq -r '.title' "${pr_file}")"
          pr_body="$(jq -r '.body // ""' "${pr_file}")"
          head_repo_full_name="$(jq -r '.head.repo.full_name // ""' "${pr_file}")"
          repo_owner="$(jq -r '.base.repo.owner.login' "${pr_file}")"
          repo_name="$(jq -r '.base.repo.name' "${pr_file}")"
          review_marker="<!-- jules-pr-review mode:${REVIEW_MODE} sha:${head_sha} -->"
          session_id=""
          state="NOT_STARTED"

          printf 'REVIEWED_SHA=%s\n' "${head_sha}" > "${meta_file}"

          if [[ -z "${JULES_API_KEY:-}" ]]; then
            cat > "$body_file" <<EOF
          ${review_marker}
          ## Jules PR review

          Mode: \`${REVIEW_MODE}\`

          Jules did not run because the \`JULES_API_KEY\` secret is not configured for this repository.
          EOF
            exit 0
          fi

          if [[ "${pr_state}" != "open" ]]; then
            cat > "$body_file" <<EOF
          ${review_marker}
          ## Jules PR review

          Mode: \`${REVIEW_MODE}\`

          Jules skipped this run because pull request #${PR_NUMBER} is no longer open.
          EOF
            exit 0
          fi

          if [[ "${REVIEW_MODE}" == "deep" && "${head_repo_full_name}" != "${GITHUB_REPOSITORY}" ]]; then
            cat > "$body_file" <<EOF
          ${review_marker}
          ## Jules PR review

          Mode: \`${REVIEW_MODE}\`

          Deep Jules reviews require a same-repository branch so the connected source can be checked out safely.
          EOF
            exit 0
          fi

          prompt_file="$RUNNER_TEMP/jules-prompt.md"

          if [[ "${REVIEW_MODE}" == "fast" ]]; then
            # Persist the combined /pulls/:n/files response to a temp file so
            # downstream jq invocations can read via file arg instead of `<<<`.
            # On PRs with hundreds of files the combined JSON can reach multiple MB,
            # which causes `/usr/bin/jq: Argument list too long` (E2BIG) when
            # passed as a bash here-string.
            all_files_file="$RUNNER_TEMP/jules-all-files.json"
            files_page_file="$RUNNER_TEMP/jules-files-page.json"
            printf '[]' > "${all_files_file}"
            files_page=1

            while :; do
              github_api_get \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${files_page}" \
                > "${files_page_file}"

              jq -c -s '.[0] + .[1]' "${all_files_file}" "${files_page_file}" \
                > "${all_files_file}.tmp"
              mv "${all_files_file}.tmp" "${all_files_file}"

              if [[ "$(jq 'length' "${files_page_file}")" -lt 100 ]]; then
                break
              fi

              files_page=$((files_page + 1))
            done

            # shellcheck disable=SC2016
            files_summary="$(
              jq -r \
                '
                  .[]
                  | "- \(.filename) [\(.status)] +\(.additions) / -\(.deletions)"
                ' \
                "${all_files_file}"
            )"

            if [[ -z "${files_summary}" ]]; then
              files_summary="- No file-level diff metadata was returned by the GitHub API."
            fi

            guidance_file="$RUNNER_TEMP/jules-guidance.md"
            guidance_ref="${base_ref:-$(jq -r '.base.repo.default_branch // empty' "${pr_file}")}"
            guidance_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/AGENTS.md?ref=$(uri_encode "${guidance_ref}")"

            if [[ -n "${guidance_ref}" ]] && github_api_get_raw "${guidance_url}" > "${guidance_file}"; then
              :
            else
              printf '%s\n' "AGENTS.md was not available at ref ${guidance_ref:-unknown}." > "${guidance_file}"
            fi

            patch_sections_file="$RUNNER_TEMP/jules-patch-context.md"
            omitted_files_file="$RUNNER_TEMP/jules-omitted-files.md"
            : > "${patch_sections_file}"
            : > "${omitted_files_file}"

            per_file_patch_limit=12000
            total_patch_budget=120000
            included_patch_files=0
            truncated_patch_files=0
            omitted_patch_files=0

            while IFS= read -r encoded_file; do
              file_json="$(printf '%s' "${encoded_file}" | base64 --decode)"
              filename="$(jq -r '.filename' <<<"${file_json}")"
              status="$(jq -r '.status' <<<"${file_json}")"
              additions="$(jq -r '.additions' <<<"${file_json}")"
              deletions="$(jq -r '.deletions' <<<"${file_json}")"
              patch="$(jq -r '.patch // empty' <<<"${file_json}")"

              if [[ -z "${patch}" ]]; then
                omitted_patch_files=$((omitted_patch_files + 1))
                printf '%s\n' "- ${filename}: GitHub did not provide a textual patch excerpt." >> "${omitted_files_file}"
                continue
              fi

              patch="${patch//$'\r'/}"
              original_patch_length=${#patch}
              rendered_patch="${patch}"

              if (( original_patch_length > per_file_patch_limit )); then
                rendered_patch="${patch:0:per_file_patch_limit}"$'\n'"[... truncated per file ...]"
                truncated_patch_files=$((truncated_patch_files + 1))
              fi

              rendered_patch_length=${#rendered_patch}

              if (( total_patch_budget <= 0 )); then
                omitted_patch_files=$((omitted_patch_files + 1))
                printf '%s\n' "- ${filename}: omitted because the total diff prompt budget was exhausted." >> "${omitted_files_file}"
                continue
              fi

              if (( rendered_patch_length > total_patch_budget )); then
                rendered_patch="${rendered_patch:0:total_patch_budget}"$'\n'"[... truncated because the total diff prompt budget was exhausted ...]"
                rendered_patch_length=${#rendered_patch}
                truncated_patch_files=$((truncated_patch_files + 1))
              fi

              total_patch_budget=$((total_patch_budget - rendered_patch_length))
              included_patch_files=$((included_patch_files + 1))

              {
                printf '### %s\n' "${filename}"
                printf -- '- status: %s\n' "${status}"
                printf -- '- additions: %s\n' "${additions}"
                printf -- '- deletions: %s\n' "${deletions}"
                # shellcheck disable=SC2016
                printf '```diff\n%s\n```\n\n' "${rendered_patch}"
              } >> "${patch_sections_file}"
            done < <(jq -r '.[] | tojson | @base64' "${all_files_file}")

            cat > "${prompt_file}" <<EOF
          Review GitHub pull request #${PR_NUMBER} in repoless fast-review mode.
          Repository: ${GITHUB_REPOSITORY}
          Base branch: ${base_ref}
          Head branch: ${head_ref}
          Head SHA: ${head_sha}
          Title: ${pr_title}

          PR description:
          $(if [[ -n "${pr_body}" ]]; then printf '%s' "${pr_body}"; else printf '(empty)'; fi)

          You only have the repository guidance, changed-file metadata, and diff excerpts included in this prompt.
          Do not assume access to the full repository, unchanged files, dependency graph, tests, or runtime behavior.
          Only report issues you can justify from the provided context or verify against current official documentation.
          You may use web search to confirm framework, library, API, model, or version facts (for example default GitHub Actions token scopes, Next.js 16 / React 19 behavior, or valid model IDs) against current authoritative docs before reporting them; never report a claim you cannot verify, and reserve high/critical severities for verified issues.
          If the provided diff context is truncated or omitted, do not speculate about the unshown code.
          Do not modify code, do not create commits, and do not open a pull request.
          Do not ask follow-up questions.
          Review contract:
          - Prioritize correctness, security, data safety, auth/tenant isolation, payment safety, regressions, and missing tests.
          - Enforce Baci rules: pnpm/Turborepo only, Biome not ESLint, React Compiler means no routine React.memo/useMemo/useCallback, Zod at API boundaries, auth first in protected routes, no select('*'), and append-only migrations.
          - For Next.js 16 and React 19, prefer Server Components, avoid client-side data waterfalls, keep uncached data behind Suspense where required, use next/image and next/font, and preserve storefront Core Web Vitals.
          - For Supabase changes, check RLS, scoped queries, explicit column selection, service-role isolation, and race conditions around read-modify-write flows.
          - For public storefront changes, check semantic HTML, metadata, JSON-LD, accessible labels, keyboard behavior, focus states, and themed CSS variables instead of hardcoded storefront colors.
          - Do not produce broad style commentary when there is no concrete risk.
          Return only concise Markdown with exactly these sections:
          ## Verdict
          ## Findings
          ## Suggested next steps
          In Findings, use flat bullets. For each issue include severity (high, medium, or low) and file paths when possible.
          If you find no meaningful issues, say so explicitly.

          ## Repository guidance
          $(cat "${guidance_file}")

          ## Changed files
          ${files_summary}

          ## Diff excerpt coverage
          - included patch excerpts: ${included_patch_files}
          - truncated patch excerpts: ${truncated_patch_files}
          - omitted patch excerpts: ${omitted_patch_files}

          $(if [[ -s "${omitted_files_file}" ]]; then printf '## Omitted or limited files\n%s\n' "$(cat "${omitted_files_file}")"; fi)

          ## Diff excerpts
          $(cat "${patch_sections_file}")
          EOF

            session_payload="$(
              jq -n \
                --rawfile prompt "${prompt_file}" \
                --arg session_title "Fast PR Review #${PR_NUMBER}" \
                '{
                  prompt: $prompt,
                  title: $session_title,
                  requirePlanApproval: false
                }'
            )"
          else
            matched_source=""
            next_sources_page=""

            while :; do
              sources_url="https://jules.googleapis.com/v1alpha/sources?pageSize=100"

              if [[ -n "${next_sources_page}" ]]; then
                sources_url="${sources_url}&pageToken=$(uri_encode "${next_sources_page}")"
              fi

              sources_response="$(jules_api_get "${sources_url}")"

              matched_source="$(
                jq -c \
                  --arg owner "${repo_owner}" \
                  --arg repo "${repo_name}" \
                  '
                    .sources
                    | map(select(.githubRepo.owner == $owner and .githubRepo.repo == $repo))
                    | first // empty
                  ' \
                  <<<"${sources_response}"
              )"

              if [[ -n "${matched_source}" ]]; then
                break
              fi

              next_sources_page="$(jq -r '.nextPageToken // empty' <<<"${sources_response}")"

              if [[ -z "${next_sources_page}" ]]; then
                break
              fi
            done

            source_name=""

            if [[ -n "${matched_source}" ]]; then
              source_name="$(jq -r '.name // empty' <<<"${matched_source}")"
            fi

            if [[ -z "${source_name}" ]]; then
              cat > "$body_file" <<EOF
          ${review_marker}
          ## Jules PR review

          Mode: \`${REVIEW_MODE}\`

          Jules could not find a connected source for \`${GITHUB_REPOSITORY}\`.

          Install the Jules GitHub app for this repository in the Jules web UI, then rerun this workflow.
          EOF
              exit 0
            fi

            branch_visible="$(
              jq -r \
                --arg branch "${head_ref}" \
                '
                  .
                  | [(.githubRepo.branches[]?.displayName)]
                  | index($branch) != null
                ' \
                <<<"${matched_source}"
            )"

            if [[ "${branch_visible}" != "true" ]]; then
              cat > "$body_file" <<EOF
          ${review_marker}
          ## Jules PR review

          Mode: \`${REVIEW_MODE}\`

          Jules can only review branches that are visible on the connected repository source.

          The branch \`${head_ref}\` was not returned by the Jules Sources API for \`${GITHUB_REPOSITORY}\`, so this run was skipped.
          EOF
              exit 0
            fi

            cat > "${prompt_file}" <<EOF
          Review GitHub pull request #${PR_NUMBER} with full repository context.
          Repository: ${GITHUB_REPOSITORY}
          Base branch: ${base_ref}
          Head branch: ${head_ref}
          Head SHA: ${head_sha}
          Title: ${pr_title}

          PR description:
          $(if [[ -n "${pr_body}" ]]; then printf '%s' "${pr_body}"; else printf '(empty)'; fi)

          Compare the head branch against the base branch and perform a deep code review.
          Do not modify code, do not create commits, and do not open a pull request.
          Do not ask follow-up questions.
          Review contract:
          - Prioritize correctness, security, data safety, auth/tenant isolation, payment safety, regressions, and missing tests.
          - Enforce Baci rules: pnpm/Turborepo only, Biome not ESLint, React Compiler means no routine React.memo/useMemo/useCallback, Zod at API boundaries, auth first in protected routes, no select('*'), and append-only migrations.
          - For Next.js 16 and React 19, prefer Server Components, avoid client-side data waterfalls, keep uncached data behind Suspense where required, use next/image and next/font, and preserve storefront Core Web Vitals.
          - For Supabase changes, check RLS, scoped queries, explicit column selection, service-role isolation, and race conditions around read-modify-write flows.
          - For public storefront changes, check semantic HTML, metadata, JSON-LD, accessible labels, keyboard behavior, focus states, and themed CSS variables instead of hardcoded storefront colors.
          - You may use web search to verify framework, library, API, model, or version facts against current official documentation; do not speculate beyond repository evidence and verified docs, and do not produce broad style commentary when there is no concrete risk.
          Return only concise Markdown with exactly these sections:
          ## Verdict
          ## Findings
          ## Suggested next steps
          In Findings, use flat bullets. For each issue include severity (high, medium, or low) and file paths when possible.
          If you find no meaningful issues, say so explicitly.
          EOF

            session_payload="$(
              jq -n \
                --rawfile prompt "${prompt_file}" \
                --arg session_title "Deep PR Review #${PR_NUMBER}" \
                --arg source_name "${source_name}" \
                --arg head_ref "${head_ref}" \
                '{
                  prompt: $prompt,
                  title: $session_title,
                  requirePlanApproval: false,
                  sourceContext: {
                    source: $source_name,
                    githubRepoContext: {
                      startingBranch: $head_ref
                    }
                  }
                }'
            )"
          fi

          session_response="$(jules_api_post_json "https://jules.googleapis.com/v1alpha/sessions" "${session_payload}")"

          session_id="$(jq -r '.id // empty' <<<"${session_response}")"

          if [[ -z "${session_id}" ]]; then
            cat > "$body_file" <<EOF
          ${review_marker}
          ## Jules PR review

          Mode: \`${REVIEW_MODE}\`

          Jules did not return a session ID, so the review could not be started.

          Workflow run: ${run_url}
          EOF
            exit 0
          fi

          while :; do
            if (( $(date +%s) >= poll_deadline_epoch )); then
              break
            fi

            session_status="$(jules_api_get "https://jules.googleapis.com/v1alpha/sessions/${session_id}")"
            state="$(jq -r '.state // "STATE_UNSPECIFIED"' <<<"${session_status}")"

            case "${state}" in
              COMPLETED|FAILED|AWAITING_USER_FEEDBACK|AWAITING_PLAN_APPROVAL|PAUSED)
                break
                ;;
            esac

            sleep 20
          done

          all_activities='[]'
          next_activities_page=""

          while :; do
            activities_url="https://jules.googleapis.com/v1alpha/sessions/${session_id}/activities?pageSize=100"

            if [[ -n "${next_activities_page}" ]]; then
              activities_url="${activities_url}&pageToken=$(uri_encode "${next_activities_page}")"
            fi

            activities_response="$(jules_api_get "${activities_url}")"

            all_activities="$(
              jq -c \
                --argjson existing "${all_activities}" \
                '$existing + (.activities // [])' \
                <<<"${activities_response}"
            )"

            next_activities_page="$(jq -r '.nextPageToken // empty' <<<"${activities_response}")"

            if [[ -z "${next_activities_page}" ]]; then
              break
            fi
          done

          review_markdown="$(
            jq -r \
              --argjson activities "${all_activities}" \
              '
                [
                  ($activities | sort_by(.createTime)[])
                  | select(.agentMessaged.agentMessage != null)
                  | .agentMessaged.agentMessage
                ]
                | map(select(length > 0))
                | last // empty
              ' \
              <<<"{}"
          )"

          failure_reason="$(
            jq -r \
              --argjson activities "${all_activities}" \
              '
                [
                  ($activities | sort_by(.createTime)[])
                  | select(.sessionFailed.reason != null)
                  | .sessionFailed.reason
                ]
                | map(select(length > 0))
                | last // empty
              ' \
              <<<"{}"
          )"

          case "${state}" in
            COMPLETED)
              if [[ -z "${review_markdown}" ]]; then
                review_markdown="$(
                  cat <<'EOF'
          ## Verdict

          Jules completed the session but did not return a final review message.

          ## Findings

          - low: No actionable review content was returned.

          ## Suggested next steps

          Re-run the workflow or inspect the Jules session manually.
          EOF
                )"
              fi
              ;;
            FAILED)
              review_markdown="$(
                cat <<EOF
          ## Verdict

          Jules failed before completing the review.

          ## Findings

          - medium: ${failure_reason:-No failure reason was returned by the Activities API.}

          ## Suggested next steps

          Re-run the workflow after checking the Jules integration and repository source setup.
          EOF
              )"
              ;;
            AWAITING_USER_FEEDBACK|AWAITING_PLAN_APPROVAL|PAUSED)
              review_markdown="$(
                cat <<EOF
          ## Verdict

          Jules stopped in \`${state}\` instead of producing a final review.

          ## Findings

          - medium: The session requires manual intervention before it can finish.

          ## Suggested next steps

          Open the Jules session and complete the requested action, or adjust the prompt to avoid follow-up questions.
          EOF
              )"
              ;;
            *)
              review_markdown="$(
                cat <<EOF
          ## Verdict

          Jules did not finish within the workflow polling window.

          ## Findings

          - low: Final session state was \`${state}\`.

          ## Suggested next steps

          Re-run the workflow later if the branch is still under review.
          EOF
              )"
              ;;
          esac

          cat > "$body_file" <<EOF
          ${review_marker}
          ## Jules PR review

          Mode: \`${REVIEW_MODE}\`
          Session: \`${session_id}\`
          State: \`${state}\`
          Workflow: ${run_url}

          ${review_markdown}
          EOF

      - name: Submit Jules review
        if: ${{ always() && !cancelled() }}
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_MODE: ${{ github.event_name == 'issue_comment' && 'deep' || 'fast' }}
        run: |
          set -euo pipefail

          body_file="$RUNNER_TEMP/jules-review.md"
          meta_file="$RUNNER_TEMP/jules-review-meta.env"
          reviewed_sha=""

          curl_common_args=(
            --fail
            --silent
            --show-error
            --location
            --connect-timeout 10
            --max-time 60
          )

          curl_retry_args=(
            --retry 3
            --retry-delay 2
            --retry-all-errors
          )

          github_api_get() {
            local url="$1"

            curl "${curl_common_args[@]}" "${curl_retry_args[@]}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${url}"
          }

          github_api_post_json() {
            local url="$1"
            local payload="$2"

            # Route the POST body through a temp file so `curl` reads via
            # --data-binary @file instead of argv. Keeps us safe from ARG_MAX
            # if the review body grows (e.g. deep-review output with many
            # findings).
            local payload_file
            payload_file="$(mktemp "${RUNNER_TEMP:-/tmp}/gh-payload-XXXXXX.json")"
            printf '%s' "${payload}" > "${payload_file}"

            local exit_code=0
            curl "${curl_common_args[@]}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              --data-binary "@${payload_file}" \
              "${url}" || exit_code=$?

            rm -f "${payload_file}"
            return "${exit_code}"
          }

          if [[ -f "${meta_file}" ]]; then
            reviewed_sha="$(sed -n 's/^REVIEWED_SHA=//p' "${meta_file}" | tail -n 1)"
          fi

          if [[ -z "${reviewed_sha}" ]]; then
            submit_pr_file="$RUNNER_TEMP/jules-submit-pr.json"
            github_api_get \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              > "${submit_pr_file}"
            reviewed_sha="$(jq -r '.head.sha' "${submit_pr_file}")"
          fi

          marker="<!-- jules-pr-review mode:${REVIEW_MODE} sha:${reviewed_sha} -->"

          if [[ ! -f "${body_file}" ]]; then
            cat > "${body_file}" <<EOF
          ${marker}
          ## Jules PR review

          Mode: \`${REVIEW_MODE}\`

          The workflow did not produce a review body. Check the workflow logs for the failure point.
          EOF
          fi

          existing_review_id=""
          reviews_page=1

          while :; do
            reviews_response="$(github_api_get "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100&page=${reviews_page}")"

            existing_review_id="$(
              jq -r \
                --arg marker "${marker}" \
                '
                  [
                    .[]
                    | select(.user.login == "github-actions[bot]")
                    | select((.body // "") | contains($marker))
                  ]
                  | last
                  | .id // empty
                ' \
                <<<"${reviews_response}"
            )"

            if [[ -n "${existing_review_id}" ]]; then
              break
            fi

            if [[ "$(jq 'length' <<<"${reviews_response}")" -lt 100 ]]; then
              break
            fi

            reviews_page=$((reviews_page + 1))
          done

          if [[ -n "${existing_review_id}" ]]; then
            exit 0
          fi

          review_payload="$(
            jq -n \
              --arg commit_id "${reviewed_sha}" \
              --rawfile body "${body_file}" \
              '{
                body: $body,
                event: "COMMENT",
                commit_id: $commit_id
              }'
          )"

          github_api_post_json "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" "${review_payload}" >/dev/null

      # Gate merge on HIGH / CRITICAL findings.
      # The Run step above has `continue-on-error: true` so flaky Jules-API
      # runs don't block merges. This step (no continue-on-error) reads the
      # review body Jules wrote and FAILS the job if HIGH/CRITICAL findings
      # were emitted. That turns the `Jules review` status check into a real
      # gating signal once it's added to required status checks.
      #
      # Policy:
      #   - HIGH / CRITICAL / Major  → exit 1 (block merge)
      #   - Medium                   → warn, don't block
      #   - Low / Minor              → pass (advisory)
      #   - Empty body / workflow noise → pass (matches prior behaviour;
      #     Jules's fast mode emits empty bodies on infra hiccups)
      - name: Gate on Jules findings
        if: github.event_name == 'pull_request'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/jules-review.md"

          # 1. Escape Hatch: Allow manual bypass via PR label (2026 Best Practice)
          if echo "${PR_LABELS}" | jq -e '.[] | select(.name == "bypass-ai-gate")' >/dev/null 2>&1; then
            echo "::notice::AI gate bypassed via 'bypass-ai-gate' label."
            exit 0
          fi

          if [[ ! -f "${body_file}" ]]; then
            echo "No review body produced by Jules. Treating as advisory pass."
            exit 0
          fi

          # 2. Strict Severity Regex: Only match true structured bullet findings (2026 Best Practice)
          # Matches bullet items starting with the severity name, avoiding false-positive triggers from code diffs or conversation text.
          any_severity_re='(^|\n)[[:space:]]*[-*][[:space:]]+(high|critical|major|medium|low|minor)\b[[:space:]]*:'
          any_severity_bold='(^|\n)[[:space:]]*[-*][[:space:]]+\*\*(Severity[: ]*)?(High|Critical|Major|Medium|Low|Minor)([: ]|\s+severity)?\*\*[[:space:]:]*'

          if grep -qiE "${any_severity_re}" "${body_file}" || \
             grep -qiE "${any_severity_bold}" "${body_file}"; then
            echo "::error::Jules flagged findings on this PR. All findings must be addressed before merge, or add the 'bypass-ai-gate' label."
            echo "------- Flagged Findings -------"
            grep -iE -B1 -A4 "${any_severity_re}|${any_severity_bold}" "${body_file}" | head -80 || true
            exit 1
          fi

          echo "Jules review passed: no findings emitted."
