name: MCP Production Smoke

on:
  push:
    branches: [main]
    paths:
      - "apps/web/mcp-server/**"
      - ".github/scripts/check-live-mcp-tools.mjs"
      - ".github/scripts/check-live-mcp-tools.test.mjs"
      - ".github/workflows/mcp-production-smoke.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-production-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64, baci-deploy]
    timeout-minutes: 5
    env:
      MCP_HEALTH_URL: ${{ vars.MCP_HEALTH_URL || 'https://mcp.ogabassey.com/health' }}
      MCP_SMOKE_URL: ${{ vars.MCP_SMOKE_URL || 'https://mcp.ogabassey.com/mcp' }}
      MCP_REQUIRED_TOOLS: ${{ vars.MCP_REQUIRED_TOOLS || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Test smoke script contracts
        run: node --test .github/scripts/check-live-mcp-tools.test.mjs
      - name: Check live MCP tools
        run: node .github/scripts/check-live-mcp-tools.mjs
