# Money PR Assurance: posts the `money-pr-assurance` commit status on every
# pull request's head commit.
#
# A PR that touches a money path in .github/money-path-paths.json passes only
# when, on its CURRENT head SHA: Codex (asked to use the money-rules prompt)
# and Claude, two model families, gave adversarial money-rules verdicts, every
# review thread is resolved, the database replay and SQL suites are green, the
# PR adds sandbox evidence or says what keeps it dark, and its owner-readable
# summary follows the template. PRs that need owner sign-off, including every
# change to the assurance rules, also need the owner's "summary-approved
# <sha7>".
# Every other PR gets an immediate success status.
#
# The check is ADVISORY until the owner explicitly adds `money-pr-assurance`
# to main's required status checks (see docs/runbooks/money-pr-assurance.md).
#
# Trust model: the evaluator never checks out or runs pull-request code. It
# runs only on events GitHub takes from the default branch, checks out the
# default branch's script and configuration, and reads the PR through the
# API only, so a PR cannot change the evaluator that judges it. Review
# events, which GitHub would run from the PR's own copy, arrive through the
# permission-less relay workflow instead. The status itself is posted with
# the shared Actions token, which any same-repository pull-request workflow
# also holds, so it must stay advisory until it is posted under an identity
# pull-request workflows cannot use (see the runbook).
name: Money PR Assurance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  # Reviewer verdicts and the owner's sign-off arrive as comments. GitHub runs
  # issue_comment workflows from the default branch.
  issue_comment:
    types: [created, edited, deleted]
  # GitHub Actions has no trigger for resolving a review thread. After the
  # last thread is resolved, re-run with workflow_dispatch (see the runbook).
  # Re-evaluate when CI finishes on a PR head, or when a review is submitted,
  # edited or dismissed (relayed by money-pr-assurance-review-relay.yml).
  workflow_run:
    workflows: [CI Quality Gate, Money PR Assurance Review Relay]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: string
  # Self-test of the assurance code itself, run only when it changes.
  pull_request:
    branches: [main]
    paths:
      - '.github/money-path-paths.json'
      - '.github/prompts/money-rules-adversarial-review.md'
      - '.github/scripts/money-pr-assurance*.mjs'
      - '.github/workflows/money-pr-assurance*.yml'
      - 'docs/piggyvest-change-summaries/**'
      - 'docs/runbooks/money-pr-assurance.md'
      # Read by the contract tests: CI job names and the CI change filter.
      - '.github/workflows/ci.yml'
      - '.github/filters/ci.yml'

permissions: {}

jobs:
  evaluate:
    name: Evaluate money-path assurance
    # Comments only matter from the reviewer bots and the owner (logins must
    # match .github/money-path-paths.json; a contract test enforces this).
    # workflow_run carries no PR number for forks, so CI and review relays
    # only evaluate same-repo PRs; fork PRs are evaluated on the other events
    # or a manual re-run.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_review') &&
      github.event.workflow_run.pull_requests[0].number) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(fromJSON('["chatgpt-codex-connector[bot]","claude[bot]","ogabasseyy"]'), github.event.comment.user.login))
    # Only an event that passes the `if` above joins the per-PR group (the
    # condition is repeated verbatim; a contract test keeps them equal). Any
    # other event gets a group of its own, so a comment from another bot can
    # never cancel or displace a real evaluation. Runs are never cancelled:
    # each reads live PR state, and a queued newer run starts only after the
    # running one has posted, so the newest state always posts last.
    concurrency:
      group: >-
        ${{ (
          github.event_name == 'pull_request_target' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
          (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_review') &&
          github.event.workflow_run.pull_requests[0].number) ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          contains(fromJSON('["chatgpt-codex-connector[bot]","claude[bot]","ogabasseyy"]'), github.event.comment.user.login))
        ) && (github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number) && format('money-pr-assurance-{0}', (github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number)) || format('money-pr-assurance-run-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    steps:
      - name: Check out the trusted assurance code from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/money-path-paths.json
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Evaluate and post the money-pr-assurance status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || '' }}
          # Only a status target if the PR cannot be read; never checked out.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/money-pr-assurance.mjs

  self-test:
    name: Money PR assurance self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the assurance unit and contract tests
        run: node --test .github/scripts/money-pr-assurance*.test.mjs
