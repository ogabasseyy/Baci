name: Muse CLI pin update

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Serialize scheduled and manual runs so two overlapping executions cannot
# both pass the existing-PR check and open duplicate pin-update PRs.
concurrency:
  group: muse-code-pin-update
  cancel-in-progress: false

jobs:
  update-pin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest public stable pin
        id: pin
        run: python3 .github/scripts/muse-pin-update.py

      - name: Run Muse review and SARIF regression suites
        if: steps.pin.outcome == 'success'
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/muse-pin-update.py .github/scripts/muse-pin-update.test.py
          python3 .github/scripts/muse-pin-update.test.py
          python3 -m py_compile .github/scripts/semgrep-sarif-filter.py .github/scripts/semgrep_sarif_*.py .github/scripts/muse-pin-update.py
          bash .github/scripts/muse-review/test.sh
          bash .github/scripts/semgrep-sarif-filter.test.sh
          for shard in 1 2 3 4; do
            bash .github/scripts/semgrep-sarif-hardening-shard.test.sh "$shard"
          done
          for script in .github/scripts/muse-review/*.sh; do bash -n "$script"; done

      - name: Smoke-test the pinned installer against the real binary
        if: steps.pin.outcome == 'success'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Muse pin unchanged; skipping installer smoke test."
            exit 0
          fi
          # The offline suites only prove install.sh and the SARIF pins
          # agree with each other; both are rewritten from the same
          # manifest. Run the installer so a wrong manifest checksum
          # fails closed here instead of at Muse review runtime.
          export HOME="${RUNNER_TEMP}/muse-smoke-home"
          mkdir -p "$HOME"
          export GITHUB_PATH="${RUNNER_TEMP}/muse-smoke-path"
          bash .github/scripts/muse-review/install.sh
          # install.sh only verifies the runner's own architecture;
          # verify the ARM64 checksum against the real artifact too.
          version="$(grep -oP '^MUSE_VERSION="\K[^"]+' .github/scripts/muse-review/install.sh)"
          want_arm="$(grep -oP '^SHA_AARCH64_LINUX="\K[^"]+' .github/scripts/muse-review/install.sh)"
          arm_bin="$(mktemp)"
          curl --disable --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 600 -fsSL -o "$arm_bin" \
            "https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version=${version}&file=muse-aarch64-linux"
          got_arm="$(sha256sum "$arm_bin" | awk '{print $1}')"
          rm -f "$arm_bin"
          if [[ "$got_arm" != "$want_arm" ]]; then
            echo "::error::Muse ARM64 checksum mismatch for ${version}; refusing to open a pin update." >&2
            exit 1
          fi

      - name: Create pin update pull request
        env:
          # Prefer a dedicated automation token when configured: pushes and
          # PRs created with GITHUB_TOKEN do not trigger pull_request
          # workflows, so generated PRs would never get required checks.
          GH_TOKEN: ${{ secrets.BACI_PIN_UPDATE_TOKEN || github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Muse pin already matches stable $VERSION."
            exit 0
          fi
          existing="$(gh pr list --state open --limit 200 --json headRefName,url,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false) | select(.headRefName | startswith("automation/muse-code-pin-'"$VERSION"'-")) | .headRefName' | head -n1)"
          if [[ -n "$existing" ]]; then
            echo "An open Muse pin update already exists on $existing; re-dispatching its checks."
            # A prior run may have created the PR but failed before
            # dispatching checks; re-dispatch so it cannot stay checkless.
            gh workflow run ci.yml --ref "$existing"
            gh workflow run security.yml --ref "$existing" -f trusted_changed=true
            gh workflow run muse-review-selftest.yml --ref "$existing"
            exit 0
          fi
          branch="automation/muse-code-pin-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .github/scripts/muse-review/install.sh .github/scripts/semgrep_sarif_pins.py
          git commit -m "chore: update Muse review CLI pin to $VERSION"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "chore: update Muse review CLI pin to $VERSION" \
              --body "Automated weekly update from Meta's public Muse stable channel. The updater verified the channel manifest, HTTPS host, version, and Linux SHA256 checksums, then passed the Muse review and SARIF regression suites before opening this PR. Please review the binary pin and trust-anchor change before merging."
            # When the PR was created with GITHUB_TOKEN, GitHub suppresses
            # the pull_request workflows that produce the required checks.
            # Dispatch them explicitly against the new branch so the checks
            # exist on the PR head commit.
            gh workflow run ci.yml --ref "$branch"
            gh workflow run security.yml --ref "$branch" -f trusted_changed=true
            gh workflow run muse-review-selftest.yml --ref "$branch"
          fi
