# Manual Muse Code PR reviewer triggered by an `@muse review` comment.
# Works on both draft and ready-for-review same-repo PRs (unlike
# muse-code-review.yml, which is automatic on draft PRs only).
# The comment must start with `@muse review` at byte 0 (case-insensitive).
# Advisory only, never blocks merges.
name: Muse Comment Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  # GitHub evaluates concurrency before job `if:` and treats `''` as falsy in
  # `cond && a || b`, so non-triggering comments take the truthy `-ignored`
  # branch while legitimate triggers fall through to `''`. `startsWith` keeps
  # mid-comment mentions from cancelling an active run (only trailing text
  # on line 1, e.g. `@muse review please`, remains a residual no-op cancellation).
  group: >-
    muse-comment-review-${{ github.event.issue.number }}-attempt-${{ github.run_attempt }}${{ !(github.event.issue.pull_request != null && startsWith(github.event.comment.body, '@muse review') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) && '-ignored' || '' }}
  cancel-in-progress: ${{ github.run_attempt == 1 && github.event.issue.pull_request != null && startsWith(github.event.comment.body, '@muse review') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR') }}

jobs:
  muse-comment-review:
    name: Muse comment review
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '@muse review') &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MUSE_MODEL_RESOLVED: ${{ vars.MUSE_MODEL != '' && vars.MUSE_MODEL || '' }}
      MUSE_EFFORT_RESOLVED: ${{ vars.MUSE_REASONING_EFFORT != '' && vars.MUSE_REASONING_EFFORT || 'medium' }}

    steps:
      - name: Parse review command and resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # Job `if:` enforces `startsWith(..., '@muse review')` at byte 0 (case-insensitive),
          # because GitHub expressions lack trim/regex. Match line 1 case-insensitively after
          # normalizing CR and trailing whitespace so case variants never cancel and no-op.
          first_line="$(printf '%s\n' "${COMMENT_BODY}" | tr -d '\r' | sed -n '1p' | sed 's/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
          if [[ "${first_line}" != '@muse review' ]]; then
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping Muse review because line 1 is not '@muse review'."
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          pr_state="$(printf '%s' "${pr_json}" | jq -r '.state')"
          head_repo="$(printf '%s' "${pr_json}" | jq -r '.head.repo.full_name // ""')"
          head_sha="$(printf '%s' "${pr_json}" | jq -r '.head.sha')"
          base_sha="$(printf '%s' "${pr_json}" | jq -r '.base.sha')"

          if [[ "${pr_state}" != "open" ]]; then
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::PR #${PR_NUMBER} is not open; skipping Muse review."
            exit 0
          fi
          if [[ "${head_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping Muse review for fork PR #${PR_NUMBER}."
            exit 0
          fi

          # Best-effort 👀 acknowledgement so the requester sees Muse picked up the comment.
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes >/dev/null 2>&1 || true

          {
            echo "should_run=true"
            echo "head_sha=${head_sha}"
            echo "base_sha=${base_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check prerequisites
        id: prereq
        if: steps.pr.outputs.should_run == 'true'
        env:
          HAS_KEY: ${{ secrets.META_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "${HAS_KEY}" != "true" ]]; then
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping Muse review: META_API_KEY secret is not set."
            exit 0
          fi
          echo "should_run=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        if: steps.prereq.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 1

      - name: Clear trusted-scripts collision
        id: collision
        if: steps.prereq.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          if git -C "${GITHUB_WORKSPACE}" cat-file -e "HEAD:trusted-scripts" 2>/dev/null; then
            rm -rf "${GITHUB_WORKSPACE}/trusted-scripts"
            echo "::warning::PR tracks trusted-scripts/; workspace copy removed before trusted checkout."
          fi

      - name: Checkout trusted review scripts
        if: steps.prereq.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-scripts
          fetch-depth: 1
          sparse-checkout: .github/scripts/muse-review

      - name: Resolve script directory
        id: scriptdir
        if: steps.prereq.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          if [[ -f "${GITHUB_WORKSPACE}/trusted-scripts/.github/scripts/muse-review/lib.sh" ]]; then
            echo "dir=${GITHUB_WORKSPACE}/trusted-scripts/.github/scripts/muse-review" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Trusted review scripts missing from default branch; refusing to run head copy."
            exit 1
          fi

      - name: Collect PR diff and build prompt
        id: diff
        if: steps.prereq.outputs.should_run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA_EVENT: ${{ steps.pr.outputs.head_sha }}
          SCRIPT_DIR: ${{ steps.scriptdir.outputs.dir }}
        run: |
          set -euo pipefail
          timeout 5m bash "${SCRIPT_DIR}/collect.sh" \
            && timeout 1m bash "${SCRIPT_DIR}/diff.sh" \
            && timeout 2m bash "${SCRIPT_DIR}/guidance.sh" \
            && timeout 2m bash "${SCRIPT_DIR}/prompt.sh"

      - name: Verify head fresh
        id: guard
        if: >-
          steps.prereq.outputs.should_run == 'true' &&
          steps.diff.outputs.should_review == 'true' &&
          steps.diff.outputs.diff_failed != 'true' &&
          steps.diff.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
          BASE_SHA: ${{ steps.diff.outputs.base_sha }}
          SCRIPT_DIR: ${{ steps.scriptdir.outputs.dir }}
        run: |
          set -euo pipefail
          bash "${SCRIPT_DIR}/guard.sh"

      - name: Install Muse Code
        id: install
        if: >-
          steps.prereq.outputs.should_run == 'true' &&
          steps.diff.outputs.should_review == 'true' &&
          steps.diff.outputs.diff_failed != 'true' &&
          steps.diff.outputs.duplicate != 'true' &&
          steps.guard.outputs.fresh == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          SCRIPT_DIR: ${{ steps.scriptdir.outputs.dir }}
        run: |
          set -euo pipefail
          bash "${SCRIPT_DIR}/install.sh"

      - name: Run Muse review
        id: muse
        if: >-
          steps.prereq.outputs.should_run == 'true' &&
          steps.diff.outputs.should_review == 'true' &&
          steps.diff.outputs.diff_failed != 'true' &&
          steps.diff.outputs.duplicate != 'true' &&
          steps.guard.outputs.fresh == 'true' &&
          steps.install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          PROMPT_FILE: ${{ steps.diff.outputs.prompt_file }}
          MUSE_MODEL: ${{ env.MUSE_MODEL_RESOLVED }}
          MUSE_EFFORT: ${{ env.MUSE_EFFORT_RESOLVED }}
          SCRIPT_DIR: ${{ steps.scriptdir.outputs.dir }}
        run: |
          set -euo pipefail
          bash "${SCRIPT_DIR}/run.sh"

      - name: Post Muse review
        continue-on-error: true
        if: >-
          steps.prereq.outputs.should_run == 'true' &&
          steps.diff.outputs.duplicate != 'true' &&
          steps.guard.outputs.fresh != 'false' &&
          (steps.diff.outputs.should_review == 'true' || steps.diff.outcome != 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
          BASE_SHA: ${{ steps.diff.outputs.base_sha }}
          HEAD_SHA_EVENT: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA_EVENT: ${{ steps.pr.outputs.base_sha }}
          MUSE_OUTCOME: ${{ steps.muse.outcome }}
          DIFF_FAILED: ${{ steps.diff.outputs.diff_failed }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          REVIEW_FILE: ${{ steps.muse.outputs.review_file }}
          SCRIPT_DIR: ${{ steps.scriptdir.outputs.dir }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          timeout 5m bash "${SCRIPT_DIR}/post.sh"
