# Self-test for the Muse review workflow's scripts.
#
# Runs the regression suites plus static checks whenever the review scripts,
# the SARIF drift auditor, or the related workflow files change. Sharded
# across parallel matrix jobs: each suite case re-audits the whole tree,
# so wall time tracks the slowest shard (~200 cases), not the 741-case
# total. No secrets, no network — except the scheduled pin-freshness
# job, which queries the stable channel manifest.
name: Muse Review Selftest

on:
  push:
    branches: [main]
    paths:
      - '.github/dependabot.yml'
      - '.github/scripts/muse-dependabot-policy.test.mjs'
      - '.github/scripts/muse-review/**'
      - '.github/scripts/semgrep-sarif-filter*'
      - '.github/scripts/semgrep_sarif_*.py'
      - '.github/scripts/semgrep-sarif-test-lib.sh'
      - '.github/scripts/semgrep-sarif-hardening.test.sh'
      - '.github/scripts/semgrep-sarif-hardening-part*.test.sh'
      - '.github/scripts/semgrep-sarif-hardening-shard.test.sh'
      - '.github/workflows/muse-code-review.yml'
      - '.github/workflows/muse-review-selftest.yml'
      - '.github/workflows/security.yml'
      - '.github/workflows/dependency-review.yml'
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '.github/scripts/muse-dependabot-policy.test.mjs'
      - '.github/scripts/muse-review/**'
      - '.github/scripts/semgrep-sarif-filter*'
      - '.github/scripts/semgrep_sarif_*.py'
      - '.github/scripts/semgrep-sarif-test-lib.sh'
      - '.github/scripts/semgrep-sarif-hardening.test.sh'
      - '.github/scripts/semgrep-sarif-hardening-part*.test.sh'
      - '.github/scripts/semgrep-sarif-hardening-shard.test.sh'
      - '.github/workflows/muse-code-review.yml'
      - '.github/workflows/muse-review-selftest.yml'
      - '.github/workflows/security.yml'
      - '.github/workflows/dependency-review.yml'
  schedule:
    # Weekly bump signal so the pinned CLI cannot go silently stale.
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  selftest:
    name: Selftest (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [muse-review, filter, hard-1, hard-2, hard-3, hard-4, static]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "${SHARD}" in
            muse-review)
              bash .github/scripts/muse-review/test.sh
              ;;
            filter)
              python3 -m py_compile .github/scripts/semgrep-sarif-filter.py .github/scripts/semgrep_sarif_*.py
              bash .github/scripts/semgrep-sarif-filter.test.sh
              ;;
            hard-1|hard-2|hard-3|hard-4)
              python3 -m py_compile .github/scripts/semgrep-sarif-filter.py .github/scripts/semgrep_sarif_*.py
              bash .github/scripts/semgrep-sarif-hardening-shard.test.sh "${SHARD#hard-}"
              ;;
            static)
              node --test .github/scripts/muse-dependabot-policy.test.mjs
              for f in .github/scripts/muse-review/*.sh; do
                bash -n "${f}"
              done
              perl -c .github/scripts/muse-review/ranges.pl
              # schema.json is data (validate it); the .jq files are programs, and
              # `jq empty` would misparse them as JSON input — they are executed
              # against fixtures by test.sh instead, so a syntax error there fails
              # the muse-review shard above.
              jq empty .github/scripts/muse-review/schema.json
              # Pinned actionlint binary, SHA256-verified like the Muse install.
              # Scoped to the reviewed workflows so unrelated ones can't red this gate.
              # A download/outage failure warns and skips (never reds): only a
              # checksum mismatch or a real lint error fails, so a CDN flake
              # cannot block an otherwise valid PR.
              want_sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
              tmpdir="$(mktemp -d)"
              trap 'rm -rf "${tmpdir}"' EXIT
              if ! curl --proto '=https' --tlsv1.2 --retry 3 --connect-timeout 15 \
                --max-time 120 -fsSL -o "${tmpdir}/actionlint.tar.gz" \
                "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"; then
                echo "::warning::actionlint download failed; skipping workflow lint."
                exit 0
              fi
              got_sha="$(sha256sum "${tmpdir}/actionlint.tar.gz" | awk '{print $1}')"
              if [[ "${got_sha}" != "${want_sha}" ]]; then
                echo "::error::actionlint checksum mismatch; refusing to run." >&2
                exit 1
              fi
              tar -xzf "${tmpdir}/actionlint.tar.gz" -C "${tmpdir}"
              "${tmpdir}/actionlint" .github/workflows/muse-code-review.yml .github/workflows/muse-review-selftest.yml .github/workflows/security.yml .github/workflows/dependency-review.yml
              ;;
          esac

  pin-freshness:
    name: Muse pin freshness
    # Scheduled runs only: push/PR selftest stays offline and flake-free.
    if: github.event_name == 'schedule'
    # Advisory: a channel outage or a deliberate lag must never red the gate.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pin to stable channel
        run: |
          set -euo pipefail
          pinned="$(grep -oE '^MUSE_VERSION="[^"]+"' .github/scripts/muse-review/install.sh | cut -d'"' -f2 || true)"
          if [[ -z "${pinned}" ]]; then
            echo "::warning::Pin-freshness check: MUSE_VERSION not found in install.sh; skipping."
            exit 0
          fi
          channel="$(curl --proto '=https' --tlsv1.2 --retry 3 --connect-timeout 15 \
            --max-time 60 -fsSL 'https://api.meta.ai/muse-code/channels/muse-stable' || true)"
          latest="$(printf '%s' "${channel}" | jq -r '.version // empty' 2>/dev/null || true)"
          if [[ -z "${latest}" ]]; then
            echo "::warning::Pin-freshness check: channel manifest unreadable; skipping."
            exit 0
          fi
          if [[ "${pinned}" != "${latest}" ]]; then
            echo "::warning::Muse pin ${pinned} lags stable ${latest}; bump MUSE_VERSION + checksums (see install.sh)."
          else
            echo "Muse pin ${pinned} matches stable."
          fi
