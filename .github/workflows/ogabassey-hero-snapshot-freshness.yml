name: OgaBassey hero snapshot freshness

# The same-origin hero snapshots are checked-in bytes keyed by exact CDN
# source URL. CDN paths are mutable (in-place merchandising overwrites keep
# the URL), so this check re-fetches every kept source and fails loudly on
# hash drift or on entries older than the 30-day re-bake cadence. On
# failure, re-bake locally and commit the refreshed manifest + assets:
#   node scripts/generate-ogabassey-hero-snapshots.mjs --slug ogabassey <sourceUrl> [...]
# --check runs on bare node (stdlib + global fetch); no install step needed.

on:
  schedule:
    - cron: "23 4 * * *" # daily at 04:23 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/generate-ogabassey-hero-snapshots.mjs"
      - "scripts/lib/ogabassey-hero-snapshot-*.mjs"
      - "apps/web/src/config/ogabassey-home-hero-snapshot-manifest.ts"
      - "apps/web/src/lib/ogabassey-home-hero-snapshot.ts"
      - ".github/workflows/ogabassey-hero-snapshot-freshness.yml"

jobs:
  freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Check hero snapshot freshness
        run: node scripts/generate-ogabassey-hero-snapshots.mjs --slug ogabassey --check
