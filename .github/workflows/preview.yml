name: Preview (branch prebuilt)

on:
  # Dispatch the STABLE file from the default branch and select the target
  # as an input, so unreviewed branch edits to this workflow can never run
  # with deployment secrets:
  #   gh workflow run preview.yml -f ref=<branch>
  # PREVIEW ONLY. This workflow must never gain --prod, the production
  # environment, migrations, postdeploy steps, or cache purges.
  workflow_dispatch:
    inputs:
      ref:
        description: Same-repo branch, tag, or SHA to build and preview
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-${{ inputs.ref }}
  cancel-in-progress: true

# Trust boundary: the target ref is build SOURCE only. Untrusted branch code
# executes solely in `build`, which holds no deployment token; `prepare` and
# `deploy` run trusted default-branch helpers with the token on fresh
# runners, exchanging only inert files via short-lived artifacts. The build
# sees the Preview backend env (identical to a native Vercel preview build)
# and the Turbo cache token (already exposed to branch code by PR CI).

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    env:
      VERCEL_CLI_VERSION: "57.0.0"
      # Fix OOM error on runner (mirrors deploy-production).
      NODE_OPTIONS: "--max_old_space_size=8192"
    steps:
      - name: Require default-branch workflow file
        run: |
          if [ "${{ github.ref }}" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo 'Refusing: dispatch the stable file from the default branch: gh workflow run preview.yml -f ref=<branch>' >&2
            exit 1
          fi
      # Full default-branch checkout: this job's root is trusted code, and the
      # injector imports @next/env, which needs installed dependencies.
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: ./.github/actions/pnpm-install-cached
      - name: Pull Preview environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: .github/scripts/run-pinned-vercel.sh pull --yes --environment=preview
      - name: Verify quiz RPC secret is marked sensitive in Preview
        # Sensitive Vercel values pull as blank assignments. This proves the
        # marking exists; the injector below additionally refuses any
        # non-blank value before the stand-in replaces it.
        run: node .github/scripts/assert-vercel-pulled-sensitive-env.mjs QUIZ_RPC_SERVER_SECRET .vercel/.env.preview.local
      - name: Ensure build-time presence of runtime-only quiz RPC secret
        # No real secret passthrough: the stand-in satisfies build validation
        # and Vercel remains the runtime source, so dispatchable branches
        # never observe the server secret.
        run: node .github/scripts/inject-prebuilt-env-secret.mjs QUIZ_RPC_SERVER_SECRET .vercel/.env.preview.local 'build-time-presence-stand-in-not-used-at-runtime-000000000000'
      - name: Ensure build-time presence of runtime-only scoped Supabase JWT key
        # Vercel pulls sensitive runtime values as empty strings. Generate a
        # fresh build-only JWK inside the injector to satisfy build validation;
        # Vercel remains the runtime source of the sensitive Preview value.
        run: node .github/scripts/inject-prebuilt-env-secret.mjs SUPABASE_AGENTIC_JWT_PRIVATE_JWK .vercel/.env.preview.local --generate-es256-jwk-standin
      # The pulled env file holds Preview values Vercel does not mark
      # sensitive (sensitive ones pull as blank); NEXT_PUBLIC_* are baked
      # into the public preview bundles regardless. Minimum retention bounds
      # the artifact audience window. Keep Preview secrets marked sensitive.
      - name: Upload Preview Vercel dir
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-vercel-dir
          path: .vercel/
          include-hidden-files: true
          retention-days: 1
      - name: Clean up Vercel secrets
        if: always()
        run: |
          rm -rf .vercel

  build:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VERCEL_CLI_VERSION: "57.0.0"
      BACI_NEXT_DEPLOYMENT_ID_SOURCE: ${{ github.run_id }}_${{ github.run_attempt }}_${{ inputs.ref }}
      # Fix OOM error on runner (mirrors deploy-production).
      NODE_OPTIONS: "--max_old_space_size=8192"
    steps:
      # Source checkout FIRST: a root checkout wipes nested content, so the
      # trusted-ops checkout below must come second (single checkout per path).
      - name: Checkout preview source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Checkout trusted ops files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
          path: trusted-ops
          persist-credentials: false
      - name: Download Preview Vercel dir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # full-SHA pin of an untagged main commit (matches cwv-runner-attestation.yml)
        with:
          name: preview-vercel-dir
          path: .vercel
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Composite `run` steps execute at the workspace root, so the default
      # install command would resolve to the UNTRUSTED target ref script.
      # Point it at the trusted copy explicitly.
      - uses: ./trusted-ops/.github/actions/pnpm-install-cached
        with:
          install-command: ./trusted-ops/.github/scripts/pnpm-install-with-retry.sh --frozen-lockfile --prefer-offline
      - name: Build for Vercel
        # No deployment token here: `vercel build` runs offline from the
        # pulled env (verified: it proceeds with an invalid token), so the
        # untrusted target-ref build scripts cannot observe or use it.
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: trusted-ops/.github/scripts/run-pinned-vercel.sh build --yes
      - name: Upload prebuilt output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-prebuilt-output
          path: .vercel/output/
          # Serverless function dirs require their hidden .vc-config.json.
          include-hidden-files: true
          retention-days: 1
      - name: Clean up Vercel secrets
        if: always()
        run: |
          rm -rf .vercel

  deploy:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: preview
    env:
      VERCEL_CLI_VERSION: "57.0.0"
      # Fix OOM error on runner (mirrors deploy-production).
      NODE_OPTIONS: "--max_old_space_size=8192"
    steps:
      - name: Checkout trusted ops files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
          path: trusted-ops
          persist-credentials: false
      - name: Pull Preview environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: trusted-ops/.github/scripts/run-pinned-vercel.sh pull --yes --environment=preview
      - name: Download prebuilt output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # full-SHA pin of an untagged main commit (matches cwv-runner-attestation.yml)
        with:
          name: preview-prebuilt-output
          path: .vercel/output
      # IMPORTANT: --archive=tgz is required to prevent Vercel upload rate limiting.
      - name: Deploy preview to Vercel
        id: deploy
        timeout-minutes: 55
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          trusted-ops/.github/scripts/run-pinned-vercel.sh deploy --yes --prebuilt --archive=tgz | tee preview-deploy.log
          preview_url="$(grep -oiE 'preview:[[:space:]]*https://[^ )]+' preview-deploy.log | grep -oE 'https://[^ ]+\.vercel\.app' | tail -n 1)"
          if [ -z "$preview_url" ]; then
            echo 'Could not find the Preview URL in the deploy log; inspect preview-deploy.log.' >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "## Preview ready: $preview_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up Vercel secrets
        if: always()
        run: |
          rm -rf .vercel
