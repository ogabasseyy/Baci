name: Review-first CI nudge

# Review-first CI (docs/runbooks/review-first-ci.md): a pull request's CI run does only the
# quick checks until Codex reports no major findings for the exact head commit. This workflow
# notices when that changes (a Codex comment, the ci-now label or /ci-now comment, a finished
# quick run, or the half-hourly sweep for the no-verdict timeout) and RE-RUNS the pull
# request's own CI run. The re-run's `changes` job reads the verdict again and decides by
# itself, so a wrong or early nudge cannot start the heavy suite.
#
# Base-owned: every trigger below runs the copy of this file on the default branch, and it
# checks out the default branch only (scripts, no pull-request code). Event text (comment
# bodies, titles) is read by the script from the event file, never interpolated into a shell.
# Dormant unless BACI_REVIEW_FIRST_CI is `on` or `pilot`.

on:
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: ['CI Quality Gate', 'Checkout browser regression']
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number (empty = sweep the recent quick runs)'
        required: false
        type: string

permissions: {}

concurrency:
  group: review-first-ci-nudge-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  nudge:
    name: Re-run CI when review allows it
    if: >-
      (vars.BACI_REVIEW_FIRST_CI == 'on' || vars.BACI_REVIEW_FIRST_CI == 'pilot') && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'pull_request_target' && (github.event.label.name == 'ci-now' || github.event.label.name == 'review-first-ci')) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && (
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
          (startsWith(github.event.comment.body, '/ci-now') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
        ))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # re-run the pull request's CI run
      contents: read
      issues: write # the ci-now label for /ci-now
      pull-requests: read
      statuses: write # the "Review-first CI" commit status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default branch only, scripts only. Never the pull-request head.
          sparse-checkout: .github/scripts/review-first-ci
          persist-credentials: false
      - name: Re-run the pull request run when it is time
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BACI_REVIEW_FIRST_CI: ${{ vars.BACI_REVIEW_FIRST_CI }}
          BACI_CODEX_WAIT_TIMEOUT_MINUTES: ${{ vars.BACI_CODEX_WAIT_TIMEOUT_MINUTES }}
        run: node .github/scripts/review-first-ci/nudge-cli.mjs
