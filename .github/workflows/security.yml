# Security Scanning Workflow
# Runs Semgrep and dependency vulnerability scanning

name: "Security"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      pg_diagnostics:
        description: 'Run optional synthetic PostgreSQL rule diagnostics; required scans remain unchanged'
        type: boolean
        default: false

concurrency:
  group: security-${{ github.ref }}
  # Only cancel in-progress for PRs, allow scheduled/push scans to complete
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Semgrep scope
    runs-on: ubuntu-latest
    outputs:
      semgrep_relevant: ${{ steps.scope.outputs.semgrep_relevant }}
      trusted_changed: ${{ steps.scope.outputs.trusted_changed }}
    steps:
      - if: github.event_name == 'pull_request'
        name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - if: github.event_name == 'pull_request'
        name: Detect security-relevant file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          # Next config controls headers, redirects, and rendering behavior, so
          # root changes must stay in the security-relevant PR scope.
          filters: |
            semgrep_relevant:
              - '.semgrepignore'
              - 'apps/web/src/app/api/**'
              - 'apps/web/src/lib/**'
              - 'apps/web/src/schemas/**'
              - 'apps/mobile-admin/app/**'
              - 'apps/mobile-admin/hooks/**'
              - 'apps/mobile-admin/lib/**'
              - 'apps/mobile-storefront/app/**'
              - 'apps/mobile-storefront/hooks/**'
              - 'apps/mobile-storefront/lib/**'
              - 'apps/mobile-storefront/services/**'
              - 'apps/mobile-storefront/stores/**'
              - 'packages/shared/**'
              - 'supabase/migrations/**'
              - 'next.config.ts'
              - '.github/workflows/**'
              # The SARIF filter audits the review runner's containment
              # flags, so runner-only changes must trigger the Semgrep
              # job instead of skipping the fail-closed audit.
              # Intentional SAST gap: the targeted/push scans below do not
              # scan .sh (runner scripts are structurally constrained by
              # the drift audit instead); scheduled full `semgrep ci`
              # (daily 03:00 UTC) remains the only rule-based coverage of
              # that tree, so a runner-script change gets semantic SAST
              # at most ~24h after merge. Keep that schedule enabled.
              - '.github/scripts/muse-review/**'
              # The drift auditor itself (both spellings: the filter
              # is hyphenated, its modules underscored): auditor
              # changes must run the job that executes the audit.
              - '.github/scripts/semgrep-sarif*'
              - '.github/scripts/semgrep_sarif_*'
              - '.github/CODEOWNERS'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            # Any change under the trusted set summons human review:
            # directly hostile helper code is indistinguishable
            # from legitimate token use, so no content rule can
            # auto-pass it. Split design: the required Semgrep SAST
            # job below treats a trusted-only change as advisory
            # (warning, still filtered) and fails only on real
            # findings or hardening drift; the separate
            # semgrep-tripwire.yml workflow (never required) turns
            # red when it runs — but a deletion/rename removes the
            # run itself, so absence proves nothing (see notes).
            # Threat model: paths signal, tripwire, and advisory env
            # are PR-controlled; backstop is CODEOWNERS review on
            # .github/** (itself in this set). Only the audit LOGIC
            # is base-pinned (see .github/sarif-filter-notes.md).
            # Invariant: every trusted_changed path also matches semgrep_relevant
            # above — otherwise the SAST job is skipped, audit never runs.
            trusted_changed:
              - '.github/scripts/muse-review/**'
              - '.github/scripts/semgrep-sarif*'
              - '.github/scripts/semgrep_sarif_*'
              - '.github/workflows/security.yml'
              - '.github/workflows/semgrep-tripwire.yml'
              - '.github/workflows/muse-code-review.yml'
              - '.github/workflows/muse-review-selftest.yml'
              - '.github/CODEOWNERS'

      - name: Resolve Semgrep scope output
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_SEMGREP_RELEVANT: ${{ steps.filter.outputs.semgrep_relevant }}
          FILTER_TRUSTED_CHANGED: ${{ steps.filter.outputs.trusted_changed }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "semgrep_relevant=$FILTER_SEMGREP_RELEVANT" >> "$GITHUB_OUTPUT"
            echo "trusted_changed=$FILTER_TRUSTED_CHANGED" >> "$GITHUB_OUTPUT"
          else
            echo "semgrep_relevant=true" >> "$GITHUB_OUTPUT"
            # Push/schedule/dispatch carry no PR diff; content
            # rules still apply, only the change signal rests.
            echo "trusted_changed=false" >> "$GITHUB_OUTPUT"
          fi

  semgrep:
    name: Semgrep SAST
    needs: [changes]
    runs-on: ubuntu-latest
    # Skip for forked PRs where SEMGREP_APP_TOKEN is not available
    # Forked PRs don't have access to secrets, which would cause Semgrep CI to fail
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.changes.outputs.semgrep_relevant == 'true'
      )
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    container:
      # Pin to specific version for reproducibility
      image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Required to diff against the PR base branch for targeted scans.
          fetch-depth: 0

      - name: Fetch PR base ref for targeted Semgrep
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fetch_askpass="$(mktemp)"
          trap 'rm -f "$fetch_askpass"' EXIT
          cat > "$fetch_askpass" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) printf '\n' ;;
          esac
          EOF
          chmod 700 "$fetch_askpass"
          GIT_ASKPASS="$fetch_askpass" GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= fetch --no-tags origin \
            "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Select targeted Semgrep PR files
        if: github.event_name == 'pull_request'
        id: semgrep_pr_targets
        shell: bash
        run: |
          diagnostics_helper=.github/scripts/semgrep-sarif-analysis-diagnostics.py
          if git cat-file -e "origin/${PR_BASE_REF}:${diagnostics_helper}" 2>/dev/null; then
            base_helper_dir="$(mktemp -d)"
            trap 'rm -rf "$base_helper_dir"' EXIT
            git show "origin/${PR_BASE_REF}:${diagnostics_helper}" > "${base_helper_dir}/semgrep-sarif-analysis-diagnostics.py"
            diagnostics_helper="${base_helper_dir}/semgrep-sarif-analysis-diagnostics.py"
          else
            # Bootstrap fallback before the helper lands on the base branch:
            # exercises the PR-head helper rather than providing independent
            # base-pinned attestation; CODEOWNERS review + tripwire govern trust.
            echo "::warning::Base branch ${PR_BASE_REF} lacks ${diagnostics_helper}; using PR-head bootstrap copy (requires CODEOWNERS human review, not independent CI attestation)."
          fi
          python3 "$diagnostics_helper" pr-targets "$PR_BASE_REF"
          # Ignore policy changes affect unchanged files as well as the diff.
          # Apply that policy to the entire protected push scope, using the
          # trusted base helper and retaining strict manifest completeness.
          ignore_policy_changed="$(git diff --name-only "origin/${PR_BASE_REF}...HEAD" -- .semgrepignore)"
          if [ -n "$ignore_policy_changed" ]; then
            base_pr_targets="$(mktemp)"
            trap 'rm -f "$base_pr_targets"; if [ -n "${base_helper_dir:-}" ]; then rm -rf "$base_helper_dir"; fi' EXIT
            cp semgrep.requested-targets "$base_pr_targets"
            scan_targets=(
              apps/web/src/app/api
              apps/web/src/lib
              apps/web/src/schemas
              apps/mobile-admin/app
              apps/mobile-admin/hooks
              apps/mobile-admin/lib
              apps/mobile-storefront/app
              apps/mobile-storefront/hooks
              apps/mobile-storefront/lib
              apps/mobile-storefront/services
              apps/mobile-storefront/stores
              packages/shared
              supabase/migrations
              next.config.ts
              .github/workflows
              .github/scripts/semgrep-sarif-analysis-diagnostics.py
              .github/scripts/semgrep-sarif-pg-diagnostic.py
              .github/scripts/semgrep-sarif-pg-diagnostic.test.py
            )
            python3 "$diagnostics_helper" push-targets "${scan_targets[@]}"
            # Keep all base-selected paths, including paths outside these roots.
            cat "$base_pr_targets" >> semgrep.requested-targets
            # Older base helpers do not yet recognize these exact Python files.
            git ls-files -z -- \
              .github/scripts/semgrep-sarif-pg-diagnostic.py \
              .github/scripts/semgrep-sarif-pg-diagnostic.test.py >> semgrep.requested-targets
          fi
          # Add exact new token-bearing diagnostics even when the trusted base
          # selector predates them. Preserve every base-selected target.
          git diff --name-only -z --diff-filter=d "origin/${PR_BASE_REF}...HEAD" -- \
            .github/scripts/semgrep-sarif-pg-diagnostic.py \
            .github/scripts/semgrep-sarif-pg-diagnostic.test.py >> semgrep.requested-targets
          # Preserve filename bytes and NUL framing while removing duplicate targets.
          LC_ALL=C sort -zu -o semgrep.requested-targets semgrep.requested-targets
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Run targeted Semgrep for security-relevant PR changes
        if: github.event_name == 'pull_request'
        id: semgrep_pr
        shell: bash
        run: |
          mapfile -d '' -t changed_files < semgrep.requested-targets

          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "scanned=false" >> "$GITHUB_OUTPUT"
            echo "No security-relevant changed files. Skipping Semgrep."
            exit 0
          fi

          echo "scanned=true" >> "$GITHUB_OUTPUT"
          # Match the existing full CI engine; use only the existing entitlement.
          semgrep install-semgrep-pro
          # --strict also fails on warning-level analysis errors.
          semgrep scan --error --strict --pro-intrafile --config auto --timeout 15 --sarif --output=semgrep.sarif --json-output=semgrep.raw.json "${changed_files[@]}"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Run scoped Semgrep on protected branch pushes
        if: github.event_name == 'push'
        id: semgrep_push
        shell: bash
        run: |
          scan_targets=(
            apps/web/src/app/api
            apps/web/src/lib
            apps/web/src/schemas
            apps/mobile-admin/app
            apps/mobile-admin/hooks
            apps/mobile-admin/lib
            apps/mobile-storefront/app
            apps/mobile-storefront/hooks
            apps/mobile-storefront/lib
            apps/mobile-storefront/services
            apps/mobile-storefront/stores
            packages/shared
            supabase/migrations
            next.config.ts
            .github/workflows
            .github/scripts/semgrep-sarif-analysis-diagnostics.py
            .github/scripts/semgrep-sarif-pg-diagnostic.py
            .github/scripts/semgrep-sarif-pg-diagnostic.test.py
          )
          python3 .github/scripts/semgrep-sarif-analysis-diagnostics.py push-targets "${scan_targets[@]}"
          semgrep install-semgrep-pro
          semgrep scan --error --strict --pro-intrafile --config auto --timeout 15 --sarif --output=semgrep.sarif --json-output=semgrep.raw.json "${scan_targets[@]}"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Diagnose PostgreSQL rule with synthetic fixtures
        if: github.event_name == 'workflow_dispatch' && inputs.pg_diagnostics == true
        id: pg_diagnostic
        shell: bash
        run: |
          semgrep install-semgrep-pro
          python3 .github/scripts/semgrep-sarif-pg-diagnostic.py "${RUNNER_TEMP}/pg-diagnostic-summary.json"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        # Optional diagnostics never replace or exempt the required full scan.
        continue-on-error: true

      - name: Upload synthetic PostgreSQL diagnostic
        id: pg_diagnostic_upload
        if: always() && github.event_name == 'workflow_dispatch' && inputs.pg_diagnostics == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-pg-synthetic-diagnostic
          path: ${{ runner.temp }}/pg-diagnostic-summary.json
          if-no-files-found: error
          retention-days: 3
        continue-on-error: true

      - name: Warn if optional PostgreSQL diagnostics failed
        if: always() && github.event_name == 'workflow_dispatch' && inputs.pg_diagnostics == true && (steps.pg_diagnostic.outcome == 'failure' || steps.pg_diagnostic_upload.outcome == 'failure')
        run: echo "::warning::Optional PostgreSQL diagnostics failed; inspect the synthetic summary and step status. The required full Semgrep scan remains enforced."

      - name: Run full Semgrep on scheduled and manual scans
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        id: semgrep_full
        run: semgrep ci --no-suppress-errors --timeout 15 --sarif --output=semgrep.sarif --json-output=semgrep.raw.json
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      # The filter invocation below is trust-sensitive; its rationale
      # lives in .github/sarif-filter-notes.md (300-line ceiling).
      - name: Clear base-filter collision
        if: github.event_name == 'pull_request'
        run: rm -rf "${GITHUB_WORKSPACE}/base-filter"

      - name: Checkout base filter implementation
        if: github.event_name == 'pull_request'
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}
          path: base-filter
          fetch-depth: 1
          sparse-checkout: .github/scripts

      - name: Verify complete Semgrep analysis and preserve raw SARIF
        if: always()
        env:
          SCAN_EVENT_NAME: ${{ github.event_name }}
          EMPTY_PR_SCOPE: ${{ github.event_name == 'pull_request' && steps.semgrep_pr.outputs.scanned == 'false' }}
        run: |
          diagnostics_helper=.github/scripts/semgrep-sarif-analysis-diagnostics.py
          if [ "$SCAN_EVENT_NAME" = "pull_request" ]; then
            if [ -f "${GITHUB_WORKSPACE}/base-filter/${diagnostics_helper}" ]; then
              diagnostics_helper="${GITHUB_WORKSPACE}/base-filter/${diagnostics_helper}"
            else
              echo "::warning::base-filter lacks ${diagnostics_helper}; using PR-head bootstrap copy (requires CODEOWNERS human review, not independent CI attestation)."
            fi
          fi
          python3 "$diagnostics_helper" validate
          if [ "$EMPTY_PR_SCOPE" != "true" ]; then
            python3 -c 'import json, pathlib, sys; sys.exit(0 if isinstance(json.loads(pathlib.Path("semgrep.raw.json").read_text()).get("results"), list) else 1)'
          fi

      - name: Preserve unfiltered Semgrep diagnostics
        if: always() && (github.event_name != 'pull_request' || steps.semgrep_pr.outputs.scanned != 'false')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-raw-diagnostics
          path: |
            semgrep.raw.json
            semgrep.raw.sarif
            semgrep.analysis-status.json
            semgrep.requested-targets
          if-no-files-found: error
          retention-days: 7

      - name: Drop audited checkout finding from SARIF
        if: always()
        run: |
          set -euo pipefail
          filter_dir=.github/scripts
          if [ "$EVENT_NAME" = "pull_request" ]; then
            filter_dir="${GITHUB_WORKSPACE}/base-filter/.github/scripts"
            for f in semgrep-sarif-filter.py semgrep_sarif_agent.py semgrep_sarif_agentenv.py semgrep_sarif_alias.py semgrep_sarif_archive.py semgrep_sarif_audit.py semgrep_sarif_awk.py semgrep_sarif_bashfunc.py semgrep_sarif_cmdfile.py semgrep_sarif_binutils.py semgrep_sarif_consts.py semgrep_sarif_consumer.py semgrep_sarif_container.py semgrep_sarif_copy.py semgrep_sarif_defer.py semgrep_sarif_embeds.py semgrep_sarif_findout.py semgrep_sarif_gh.py semgrep_sarif_git.py semgrep_sarif_helpers.py semgrep_sarif_helpertree.py semgrep_sarif_heredoc.py semgrep_sarif_install.py semgrep_sarif_interp.py semgrep_sarif_jq.py semgrep_sarif_nameref.py semgrep_sarif_order.py semgrep_sarif_peel.py semgrep_sarif_perl.py semgrep_sarif_pins.py semgrep_sarif_refs.py semgrep_sarif_poison.py semgrep_sarif_programs.py semgrep_sarif_redirect.py semgrep_sarif_runner.py semgrep_sarif_scan.py semgrep_sarif_secretbind.py semgrep_sarif_sed.py semgrep_sarif_segments.py semgrep_sarif_shell.py semgrep_sarif_steps.py semgrep_sarif_subscript.py semgrep_sarif_tar.py semgrep_sarif_varcollect.py semgrep_sarif_varmap.py semgrep_sarif_words.py semgrep_sarif_xargs.py semgrep_sarif_zone.py; do
              [ -f "${filter_dir}/${f}" ] || { echo "::error::base filter copy missing ${f}; failing closed."; exit 1; }
            done
          fi
          python3 "${filter_dir}/semgrep-sarif-filter.py"
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRUSTED_CHANGED: ${{ needs.changes.outputs.trusted_changed }}
          # Advisory mode: trusted-only drift warns instead of failing
          # this required job (hardening drift still fails; tripwire
          # workflow carries the loud signal). Inert on old base
          # filters, so enabling here fails closed as before.
          TRUSTED_CHANGE_ADVISORY: 'true'

      - name: Verify SARIF exists
        id: verify-sarif
        if: always()
        run: |
          if [ -s semgrep.sarif ]; then
            echo "sarif_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF file
        # Pin to full SHA for supply chain security
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && steps.verify-sarif.outputs.sarif_exists == 'true'
        with:
          sarif_file: semgrep.sarif

      # Fail-closed on scanner errors too (a crash with no SARIF must not
      # report green); the zero-changed-files exit counts as success.
      - name: Fail on Semgrep findings or scanner errors
        if: steps.semgrep_pr.outcome == 'failure' || steps.semgrep_push.outcome == 'failure' || steps.semgrep_full.outcome == 'failure'
        run: exit 1

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: TruffleHog OSS
        # Pin to full SHA for supply-chain security
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --only-verified --exclude-paths=.trufflehogignore
