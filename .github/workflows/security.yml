# Security Scanning Workflow
# Runs Semgrep and dependency vulnerability scanning

name: "Security"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  # Only cancel in-progress for PRs, allow scheduled/push scans to complete
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Semgrep scope
    runs-on: ubuntu-latest
    outputs:
      semgrep_relevant: ${{ steps.scope.outputs.semgrep_relevant }}
      trusted_changed: ${{ steps.scope.outputs.trusted_changed }}
    steps:
      - if: github.event_name == 'pull_request'
        name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - if: github.event_name == 'pull_request'
        name: Detect security-relevant file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          # Next config controls headers, redirects, and rendering behavior, so
          # root changes must stay in the security-relevant PR scope.
          filters: |
            semgrep_relevant:
              - 'apps/web/src/app/api/**'
              - 'apps/web/src/lib/**'
              - 'apps/web/src/schemas/**'
              - 'apps/mobile-admin/app/**'
              - 'apps/mobile-admin/hooks/**'
              - 'apps/mobile-admin/lib/**'
              - 'apps/mobile-storefront/app/**'
              - 'apps/mobile-storefront/hooks/**'
              - 'apps/mobile-storefront/lib/**'
              - 'apps/mobile-storefront/services/**'
              - 'apps/mobile-storefront/stores/**'
              - 'packages/shared/**'
              - 'supabase/migrations/**'
              - 'next.config.ts'
              - '.github/workflows/**'
              # The SARIF filter audits the review runner's containment
              # flags, so runner-only changes must trigger the Semgrep
              # job instead of skipping the fail-closed audit.
              # Intentional SAST gap: the targeted/push scans below do not
              # scan .sh (runner scripts are structurally constrained by
              # the drift audit instead); scheduled full `semgrep ci`
              # (daily 03:00 UTC) remains the only rule-based coverage of
              # that tree, so a runner-script change gets semantic SAST
              # at most ~24h after merge. Keep that schedule enabled.
              - '.github/scripts/muse-review/**'
              # The drift auditor itself (both spellings: the filter
              # is hyphenated, its modules underscored): auditor
              # changes must run the job that executes the audit.
              - '.github/scripts/semgrep-sarif*'
              - '.github/scripts/semgrep_sarif_*'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            # Any change under the trusted set fails the SARIF
            # filter loudly for human review: directly hostile
            # helper code is indistinguishable from legitimate
            # token use, so no content rule can auto-pass it.
            # Advisory, not blocking (Security is not required):
            # the red X draws merger eyes, the human decides.
            # Invariant: every trusted_changed path also matches
            # semgrep_relevant above — otherwise the job that reads
            # the signal is skipped and the red X never appears.
            trusted_changed:
              - '.github/scripts/muse-review/**'
              - '.github/scripts/semgrep-sarif*'
              - '.github/scripts/semgrep_sarif_*'
              - '.github/workflows/security.yml'
              - '.github/workflows/muse-code-review.yml'
              - '.github/workflows/muse-review-selftest.yml'

      - name: Resolve Semgrep scope output
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "semgrep_relevant=${{ steps.filter.outputs.semgrep_relevant }}" >> "$GITHUB_OUTPUT"
            echo "trusted_changed=${{ steps.filter.outputs.trusted_changed }}" >> "$GITHUB_OUTPUT"
          else
            echo "semgrep_relevant=true" >> "$GITHUB_OUTPUT"
            # Push/schedule/dispatch carry no PR diff; content
            # rules still apply, only the change signal rests.
            echo "trusted_changed=false" >> "$GITHUB_OUTPUT"
          fi

  semgrep:
    name: Semgrep SAST
    needs: [changes]
    runs-on: ubuntu-latest
    # Skip for forked PRs where SEMGREP_APP_TOKEN is not available
    # Forked PRs don't have access to secrets, which would cause Semgrep CI to fail
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.changes.outputs.semgrep_relevant == 'true'
      )
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    container:
      # Pin to specific version for reproducibility
      image: semgrep/semgrep:1.104.0

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Required to diff against the PR base branch for targeted scans.
          fetch-depth: 0

      - name: Run targeted Semgrep for security-relevant PR changes
        if: github.event_name == 'pull_request'
        id: semgrep_pr
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fetch_askpass="$(mktemp)"
          trap 'rm -f "$fetch_askpass"' EXIT
          cat > "$fetch_askpass" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) printf '\n' ;;
          esac
          EOF
          chmod 700 "$fetch_askpass"
          GIT_ASKPASS="$fetch_askpass" GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= fetch --no-tags --prune origin \
            "${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=d "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.sql' '*.yml' '*.yaml' |
            grep -E '^(next\.config\.ts$|apps/web/src/app/api/|apps/web/src/lib/|apps/web/src/schemas/|apps/mobile-admin/(app|hooks|lib)/|apps/mobile-storefront/(app|hooks|lib|services|stores)/|packages/shared/|supabase/migrations/|\.github/workflows/)' ||
            true
          )

          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "No security-relevant changed files. Skipping Semgrep."
            exit 0
          fi

          semgrep scan --config auto --sarif --output=semgrep.sarif "${changed_files[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Run scoped Semgrep on protected branch pushes
        if: github.event_name == 'push'
        id: semgrep_push
        run: |
          semgrep scan --config auto --sarif --output=semgrep.sarif \
            apps/web/src/app/api \
            apps/web/src/lib \
            apps/web/src/schemas \
            apps/mobile-admin/app \
            apps/mobile-admin/hooks \
            apps/mobile-admin/lib \
            apps/mobile-storefront/app \
            apps/mobile-storefront/hooks \
            apps/mobile-storefront/lib \
            apps/mobile-storefront/services \
            apps/mobile-storefront/stores \
            packages/shared \
            supabase/migrations \
            next.config.ts \
            .github/workflows
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Run full Semgrep on scheduled and manual scans
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        id: semgrep_full
        run: semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      # The filter below repairs the nosemgrep/SARIF transport gap for
      # exactly one audited finding after a fail-closed drift audit; any
      # drift keeps the SARIF unfiltered and fails the job, even with no
      # SARIF (empty scans must not skip the audit). TRUSTED_CHANGED
      # carries the scope job's trusted-set diff signal (same-repo PRs
      # only; forks skip this job). Auditor logic lives in
      # .github/scripts/semgrep-sarif-filter.py (+ semgrep_sarif_*
      # modules), pinned by semgrep-sarif-filter.test.sh (selftest).
      # PRs execute the BASE revision of that auditor (checked out
      # below): the job workspace holds submitter-controlled head
      # code, so running the head copy would let a PR neuter its own
      # audit. Push/schedule runs use the workspace copy, which
      # already is a trusted branch. No fallback: a base without the
      # auditor fails closed (bootstrap PRs stay red by design).
      # Fork-PR gap (post-merge follow-up, not more pull_request
      # YAML): forks skip this job, so they need a base-side audit.
      - name: Clear base-filter collision
        if: github.event_name == 'pull_request'
        run: rm -rf "${GITHUB_WORKSPACE}/base-filter"

      - name: Checkout base filter implementation
        if: github.event_name == 'pull_request'
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}
          path: base-filter
          fetch-depth: 1
          sparse-checkout: .github/scripts

      - name: Drop audited checkout finding from SARIF
        if: always()
        run: |
          set -euo pipefail
          filter_dir=.github/scripts
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            filter_dir="${GITHUB_WORKSPACE}/base-filter/.github/scripts"
            for f in semgrep-sarif-filter.py semgrep_sarif_agent.py semgrep_sarif_audit.py semgrep_sarif_consumer.py semgrep_sarif_copy.py semgrep_sarif_defer.py semgrep_sarif_embeds.py semgrep_sarif_helpers.py semgrep_sarif_heredoc.py semgrep_sarif_install.py semgrep_sarif_interp.py semgrep_sarif_pins.py semgrep_sarif_poison.py semgrep_sarif_programs.py semgrep_sarif_runner.py semgrep_sarif_scan.py semgrep_sarif_shell.py semgrep_sarif_steps.py; do
              [ -f "${filter_dir}/${f}" ] || { echo "::error::base filter copy missing ${f}; failing closed."; exit 1; }
            done
          fi
          python3 "${filter_dir}/semgrep-sarif-filter.py"
        env:
          TRUSTED_CHANGED: ${{ needs.changes.outputs.trusted_changed }}

      - name: Verify SARIF exists
        id: verify-sarif
        if: always()
        run: |
          if [ -s semgrep.sarif ]; then
            echo "sarif_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF file
        # Pin to full SHA for supply chain security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && steps.verify-sarif.outputs.sarif_exists == 'true'
        with:
          sarif_file: semgrep.sarif

      - name: Fail if Semgrep reported findings
        if: steps.verify-sarif.outputs.sarif_exists == 'true' && (steps.semgrep_pr.outcome == 'failure' || steps.semgrep_push.outcome == 'failure' || steps.semgrep_full.outcome == 'failure')
        run: exit 1

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: TruffleHog OSS
        # Pin to full SHA for supply-chain security
        uses: trufflesecurity/trufflehog@a5f3de55cc2065ae4dde8fee24076f137fd62fcf # v3.97.8
        with:
          extra_args: --only-verified --exclude-paths=.trufflehogignore
