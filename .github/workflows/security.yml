# Security Scanning Workflow
# Runs Semgrep and dependency vulnerability scanning

name: "Security"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  # Only cancel in-progress for PRs, allow scheduled/push scans to complete
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Semgrep scope
    runs-on: ubuntu-latest
    outputs:
      semgrep_relevant: ${{ steps.scope.outputs.semgrep_relevant }}
    steps:
      - if: github.event_name == 'pull_request'
        name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - if: github.event_name == 'pull_request'
        name: Detect security-relevant file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          # Next config controls headers, redirects, and rendering behavior, so
          # root changes must stay in the security-relevant PR scope.
          filters: |
            semgrep_relevant:
              - 'apps/web/src/app/api/**'
              - 'apps/web/src/lib/**'
              - 'apps/web/src/schemas/**'
              - 'apps/mobile-admin/app/**'
              - 'apps/mobile-admin/hooks/**'
              - 'apps/mobile-admin/lib/**'
              - 'apps/mobile-storefront/app/**'
              - 'apps/mobile-storefront/hooks/**'
              - 'apps/mobile-storefront/lib/**'
              - 'apps/mobile-storefront/services/**'
              - 'apps/mobile-storefront/stores/**'
              - 'packages/shared/**'
              - 'supabase/migrations/**'
              - 'next.config.ts'
              - '.github/workflows/**'
              # The SARIF filter audits the review runner's containment
              # flags, so runner-only changes must trigger the Semgrep
              # job instead of skipping the fail-closed audit.
              # Intentional SAST gap: the targeted/push scans below do not
              # scan .sh (runner scripts are structurally constrained by
              # the drift audit instead); scheduled full `semgrep ci`
              # scans remain the only rule-based coverage of that tree.
              - '.github/scripts/muse-review/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

      - name: Resolve Semgrep scope output
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "semgrep_relevant=${{ steps.filter.outputs.semgrep_relevant }}" >> "$GITHUB_OUTPUT"
          else
            echo "semgrep_relevant=true" >> "$GITHUB_OUTPUT"
          fi

  semgrep:
    name: Semgrep SAST
    needs: [changes]
    runs-on: ubuntu-latest
    # Skip for forked PRs where SEMGREP_APP_TOKEN is not available
    # Forked PRs don't have access to secrets, which would cause Semgrep CI to fail
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.changes.outputs.semgrep_relevant == 'true'
      )
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    container:
      # Pin to specific version for reproducibility
      image: semgrep/semgrep:1.104.0

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Required to diff against the PR base branch for targeted scans.
          fetch-depth: 0

      - name: Run targeted Semgrep for security-relevant PR changes
        if: github.event_name == 'pull_request'
        id: semgrep_pr
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fetch_askpass="$(mktemp)"
          trap 'rm -f "$fetch_askpass"' EXIT
          cat > "$fetch_askpass" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *) printf '\n' ;;
          esac
          EOF
          chmod 700 "$fetch_askpass"
          GIT_ASKPASS="$fetch_askpass" GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= fetch --no-tags --prune origin \
            "${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=d "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.sql' '*.yml' '*.yaml' |
            grep -E '^(next\.config\.ts$|apps/web/src/app/api/|apps/web/src/lib/|apps/web/src/schemas/|apps/mobile-admin/(app|hooks|lib)/|apps/mobile-storefront/(app|hooks|lib|services|stores)/|packages/shared/|supabase/migrations/|\.github/workflows/)' ||
            true
          )

          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "No security-relevant changed files. Skipping Semgrep."
            exit 0
          fi

          semgrep scan --config auto --sarif --output=semgrep.sarif "${changed_files[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Run scoped Semgrep on protected branch pushes
        if: github.event_name == 'push'
        id: semgrep_push
        run: |
          semgrep scan --config auto --sarif --output=semgrep.sarif \
            apps/web/src/app/api \
            apps/web/src/lib \
            apps/web/src/schemas \
            apps/mobile-admin/app \
            apps/mobile-admin/hooks \
            apps/mobile-admin/lib \
            apps/mobile-storefront/app \
            apps/mobile-storefront/hooks \
            apps/mobile-storefront/lib \
            apps/mobile-storefront/services \
            apps/mobile-storefront/stores \
            packages/shared \
            supabase/migrations \
            next.config.ts \
            .github/workflows
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Run full Semgrep on scheduled and manual scans
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        id: semgrep_full
        run: semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      # Semgrep honors nosemgrep for its exit code but still emits suppressed
      # findings into --sarif output with suppressions:[{kind:inSource}], and
      # GitHub code scanning ignores that flag — the finding stays open as a
      # phantom alert. Repair the transport for exactly one audited finding:
      # the reviewed pull_request_target checkout in muse-code-review.yml
      # (read-only agent, no PR code execution; see the nosemgrep comment
      # there). Anything else suppressed, anywhere else, keeps uploading, so
      # a future nosemgrep can never silently hide a new finding. Before
      # filtering, the step re-asserts the hardening the audit relies on and
      # fails closed (SARIF untouched, alert re-opens) if it drifted.
      # Matching is key-positional on comment-stripped lines (stdlib only:
      # the scan container has no jq and no PyYAML): the guard must be a
      # positive top-level && conjunct of the audited job's own job-level
      # if: (negations, || fallbacks, lookalikes, and other-job/step/run:
      # copies all fail closed), persist-credentials/ref:/path: must be
      # mapping keys; folded ref scalars are joined and unnamed steps
      # delimit spans. Every dir= value assigned to GITHUB_OUTPUT must
      # equal the trusted path exactly, and the trusted agent runner must
      # keep its execution-disabling flags and token isolation (single
      # muse invocation). Suppression matching is validated against the
      # pinned semgrep 1.104.0 SARIF shape (suppressions:[{kind:inSource}]);
      # a surviving rule+path result emits a warning annotation instead
      # of failing silently. The trusted checkout's action and repo are
      # pinned, and every consumer of the review scripts must route via
      # the validated resolver output (no hardcoded scripts paths, no
      # rebound SCRIPT_DIR, no unbound interpreter invocations). The
      # audited checkout's action is pinned too; every resolver write
      # to GITHUB_OUTPUT must be the known-safe echo; muse flags are
      # scoped to its own argv, not the whole shell line. The audit runs
      # even with no SARIF (empty scans must not skip it); the agent
      # step and job env must not receive token expressions under any
      # key; install.sh version, exact checksums, verify-before-install
      # order, and every URL literal (pinned host + versioned path) are
      # pinned. Every command in every run: block allowlists by argv0
      # (secret steps strictest); interpreter operands parse flags and
      # must route via the resolver output; substitution, env/path
      # propagation, function definitions, shell: overrides, and
      # unpinned actions all drift.
      - name: Drop audited checkout finding from SARIF
        if: always()
        run: |
          # The drift audit below always runs, even when the scan wrote no
          # SARIF (empty scans must not skip it); only the filtering step
          # is conditional on a SARIF file existing.
          python3 - <<'EOF'
          import json
          import os
          import posixpath
          import re
          import sys
          AUDITED_RULE_ID = (
              "yaml.github-actions.security.pull-request-target-code-checkout"
              ".pull-request-target-code-checkout"
          )
          AUDITED_PATH = ".github/workflows/muse-code-review.yml"
          PINNED_CHECKOUT_USES = (
              "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"
          )
          MUSE_PINNED_VERSION = "1.4.1-R4503.1"
          MUSE_PINNED_HOST = "https://lookaside.facebook.com/"
          MUSE_PINNED_SHA_X86 = (
              "8b53c9cdbc025bc2d9068bc7016e2c1e51c3a0c608821da1"
              "7528ad23be900a12"
          )
          MUSE_PINNED_SHA_AARCH64 = (
              "a6d46239975adac282aa829d2a5bd1cd3119334c18ecfa7"
              "76d4377daebddb595"
          )

          def strip_comments(line):
              buf = []
              quote = None
              for ch in line:
                  if quote:
                      buf.append(ch)
                      if ch == quote:
                          quote = None
                  elif ch in ("'", '"'):
                      quote = ch
                      buf.append(ch)
                  elif ch == "#":
                      break
                  else:
                      buf.append(ch)
              return "".join(buf)

          try:
              with open(AUDITED_PATH) as fh:
                  raw_lines = fh.read().splitlines()
          except OSError:
              # Gone from this tree: pr_refs below is empty, so the audit
              # takes the removed-checkout exit (nothing executes the
              # orphaned scripts until a restore PR, which re-audits).
              raw_lines = []
          # Match on code, never comments: a weakened guard that survives
          # only inside a comment must not satisfy the checks below.
          # Block-scalar ref values (ref: >- on its own line) are joined so
          # a folded PR-controlled ref cannot evade the checkout count.
          code_lines = [strip_comments(line) for line in raw_lines]
          # joined[i] carries the raw 0-based index of its first line so SARIF
          # line numbers (raw file numbering) stay comparable after folding.
          workflow_lines = []
          workflow_raw = []
          i = 0
          while i < len(code_lines):
              line = code_lines[i]
              if re.match(r"^\s*ref:\s*[>|][-+]?\s*$", line):
                  base = len(line) - len(line.lstrip())
                  parts = [line]
                  j = i + 1
                  while j < len(code_lines) and code_lines[j].strip() \
                          and len(code_lines[j]) - len(code_lines[j].lstrip()) > base:
                      parts.append(code_lines[j].strip())
                      j += 1
                  workflow_lines.append(" ".join(parts))
                  workflow_raw.append(i)
                  i = j
              else:
                  workflow_lines.append(line)
                  workflow_raw.append(i)
                  i += 1

          def is_step_boundary(line):
              # Named (- name:) and unnamed (- uses:/- run:/...) steps both
              # delimit spans, so an unnamed step cannot widen a span.
              return re.match(r"^\s*-\s+\w[\w-]*:", line) is not None

          def step_start(lines, ref_index):
              for i in range(ref_index, -1, -1):
                  if is_step_boundary(lines[i]):
                      return i
              return 0

          def step_end(lines, start_index):
              for i in range(start_index + 1, len(lines)):
                  if is_step_boundary(lines[i]):
                      return i
              return len(lines)

          def job_if_bodies(ref_raw_index):
              # Conditions of the audited step's own job only: a matching
              # guard string in another job, a step, or a run: block must
              # not satisfy the check. Returns None when unlocatable.
              jobs_at = next(
                  (i for i, line in enumerate(code_lines)
                   if re.match(r"^jobs:\s*$", line.strip())), None)
              if jobs_at is None or ref_raw_index <= jobs_at:
                  return None
              job_at = next(
                  (i for i in range(ref_raw_index, jobs_at, -1)
                   if re.match(r"^  \S+:\s*$", code_lines[i])), None)
              if job_at is None:
                  return None
              steps_at = next(
                  (i for i in range(job_at + 1, len(code_lines))
                   if re.match(r"^    steps:\s*$", code_lines[i])
                   or re.match(r"^  \S+:\s*$", code_lines[i])),
                  len(code_lines))
              bodies = []
              i = job_at + 1
              while i < steps_at:
                  line = code_lines[i]
                  if not re.match(r"^    if:", line):
                      i += 1
                      continue
                  block = re.match(r"^    if:\s*[>|][-+]?\s*$", line)
                  single = re.match(r"^    if:\s+(\S.*)$", line)
                  if block:
                      j = i + 1
                      while j < steps_at and code_lines[j].strip() \
                              and len(code_lines[j]) - len(code_lines[j].lstrip()) > 4:
                          bodies.append(code_lines[j].strip())
                          j += 1
                      i = j
                  elif single:
                      bodies.append(single.group(1))
                      i += 1
                  else:
                      i += 1
              return bodies

          def is_pr_ref(line):
              # Key-positional: the mapping key must be ref:, so a run: echo
              # of a ref-looking string cannot count as a checkout input.
              return (re.match(r"^ref:\s", line.lstrip()) is not None
                      and "github.event.pull_request" in line)

          drift = []
          pr_refs = [i for i, line in enumerate(workflow_lines)
                     if is_pr_ref(line)]
          if not pr_refs:
              # No PR-controlled checkout left to exempt (e.g. removed in
              # favor of API-fetched diffs): nothing to filter, and failing
              # here would punish the safest possible change.
              print("::notice::No PR-controlled checkout in " + AUDITED_PATH
                    + "; exemption inactive.")
              sys.exit(0)
          if len(pr_refs) != 1:
              drift.append(f"pr-controlled-checkout-count={len(pr_refs)}")
          guard_bodies = (job_if_bodies(workflow_raw[pr_refs[0]])
                          if len(pr_refs) == 1 else None)
          # The guard must be a positive top-level && conjunct of the job
          # condition: mere presence would also accept !(guard),
          # guard || true, or a lookalike comparison. Redundant outer
          # parens are tolerated; anything else fails closed.
          guard_expr = ("github.event.pull_request.head.repo.full_name"
                        " == github.repository")

          def is_guarded(condition):
              parts, depth, buf = [], 0, ""
              quote, i = None, 0
              while i < len(condition):
                  ch = condition[i]
                  if quote:
                      buf += ch
                      if ch == quote:
                          quote = None
                      i += 1
                  elif ch in ("'", '"'):
                      quote, buf, i = ch, buf + ch, i + 1
                  elif ch == "(":
                      depth, buf, i = depth + 1, buf + ch, i + 1
                  elif ch == ")":
                      depth, buf, i = max(0, depth - 1), buf + ch, i + 1
                  elif ch == "&" and condition[i:i + 2] == "&&" \
                          and depth == 0:
                      parts.append(buf)
                      buf, i = "", i + 2
                  else:
                      buf, i = buf + ch, i + 1
              parts.append(buf)
              for part in parts:
                  piece = " ".join(part.split())
                  while len(piece) >= 2 and piece.startswith("(") \
                          and piece.endswith(")"):
                      level, matched = 0, True
                      for pos, c in enumerate(piece):
                          if c == "(":
                              level += 1
                          elif c == ")":
                              level -= 1
                              if level == 0 and pos != len(piece) - 1:
                                  matched = False
                                  break
                      if not matched or level != 0:
                          break
                      piece = piece[1:-1].strip()
                  if piece == guard_expr:
                      return True
              return False

          if len(pr_refs) == 1 and not (
                  guard_bodies and is_guarded(" ".join(guard_bodies))):
              drift.append("same-repo-job-guard")
          # 1-based inclusive raw line span of the audited checkout step, used
          # to pin the SARIF exemption to this exact finding (see below).
          # (Count drift is recorded above; a non-unique ref leaves the span
          # empty so the predicate below cannot match anything.)
          audited_start = audited_end = 0
          if len(pr_refs) == 1:
              start = step_start(workflow_lines, pr_refs[0])
              raw_start = workflow_raw[start]
              raw_end = step_end(code_lines, workflow_raw[pr_refs[0]])
              # Trim trailing blank separator lines so the span ends at
              # the step's last content line (not the next step's own).
              while raw_end - 1 > raw_start \
                      and not code_lines[raw_end - 1].strip():
                  raw_end -= 1
              audited_start, audited_end = raw_start + 1, raw_end
              # Key-positional: a run: echo of the string must not satisfy it.
              if not any(re.match(r"^persist-credentials:\s*false\s*$", line.strip())
                         for line in workflow_lines[start:pr_refs[0]]):
                  drift.append("head-checkout-credentials")
              # The step runs with the job's PR write token before the
              # secret-bearing steps: pin its exact action, not just the
              # ref it checks out. A mutable action ref could persist
              # code into the later steps while the ref still audits.
              audited_span = workflow_lines[
                  start:step_end(workflow_lines, start)]
              audited_uses = [
                  line.strip()[len("uses:"):].strip()
                  for line in audited_span
                  if re.match(r"^uses:", line.strip())]
              if not audited_uses or not all(
                      value == PINNED_CHECKOUT_USES
                      for value in audited_uses):
                  drift.append("head-checkout-action")
          trusted = [i for i, line in enumerate(workflow_lines)
                     if re.match(r"^path:\s*trusted-scripts\s*$",
                                 line.strip())]
          if not trusted:
              drift.append("trusted-scripts-checkout-missing")
          else:
              start = step_start(workflow_lines, trusted[0])
              span = workflow_lines[start:step_end(workflow_lines, start)]
              # The trusted checkout's own ref: inputs must equal the
              # audited default-branch expression exactly (whitespace
              # aside): a contains-check would accept PR-controlled
              # lookalikes such as default_branch && github.head_ref.
              # Credentials must stay disabled: a persisted token in the
              # nested repo's git config is file content the workspace-
              # reading agent could exfiltrate under prompt injection.
              expected_ref = "${{github.event.repository.default_branch}}"

              def norm_ref_value(stripped_line):
                  rest = stripped_line[len("ref:"):].strip()
                  rest = re.sub(r"^[>|][-+]?\s*", "", rest)
                  if len(rest) >= 2 and rest[0] == rest[-1] \
                          and rest[0] in "\"'":
                      rest = rest[1:-1]
                  return re.sub(r"\s+", "", rest)

              ref_values = [
                  norm_ref_value(line.strip())
                  for line in span
                  if re.match(r"^ref:", line.strip())]
              if not ref_values or not all(
                      value == expected_ref for value in ref_values):
                  drift.append("trusted-scripts-default-branch")
              if not any(re.match(r"^persist-credentials:\s*false\s*$",
                                  line.strip()) for line in span):
                  drift.append("trusted-scripts-credentials")
              if any(is_pr_ref(line) for line in span):
                  drift.append("trusted-scripts-pr-ref")
              # The step is located by path: alone, so pin the action and
              # forbid repository:: either would otherwise silently
              # re-source the executable tree the token-bearing steps run.
              uses_values = [
                  line.strip()[len("uses:"):].strip()
                  for line in span
                  if re.match(r"^uses:", line.strip())]
              if not uses_values or not all(
                      value == PINNED_CHECKOUT_USES
                      for value in uses_values):
                  drift.append("trusted-scripts-action")
              if any(re.match(r"^repository:", line.strip())
                     for line in span):
                  drift.append("trusted-scripts-repository")
          resolve = [i for i, line in enumerate(workflow_lines)
                     if re.match(r"^- name:\s*Resolve script directory\s*$",
                                 line.strip())]
          if not resolve:
              drift.append("script-resolution-step-missing")
          else:
              start = resolve[0]
              span = workflow_lines[start:step_end(workflow_lines, start)]
              # The exemption is only valid if executed scripts resolve to
              # the trusted checkout: parse every dir= assignment written to
              # GITHUB_OUTPUT (not mere mentions) and require each value to
              # sit under the trusted tree with no parent traversal.
              # Every assigned value must equal the known trusted path
              # exactly: a contains-check would accept lookalikes such as
              # untrusted-scripts/, and also rules out traversal (..).
              expected = ("${GITHUB_WORKSPACE}/trusted-scripts"
                          "/.github/scripts/muse-review")
              # Every mention of GITHUB_OUTPUT in the resolver must be the
              # known-safe echo of the exact trusted path: the effective
              # dir is the LAST write, so a printf/tee/exec line the old
              # single-spelling collector ignored would silently win. An
              # aliasing line (OUT=$GITHUB_OUTPUT) trips here too, at the
              # alias. Residual: a var name split across expansions.
              safe_echo = re.compile(
                  r"""echo\s+["']dir=([^"']+)["']\s*>>\s*"""
                  r"""["']?\$?\{?GITHUB_OUTPUT\}?["']?""")
              writes = [line for line in span if "GITHUB_OUTPUT" in line]
              if not writes:
                  drift.append("script-resolution-no-output")
              else:
                  for line in writes:
                      found = safe_echo.search(line)
                      if not found or found.group(1).strip() != expected:
                          drift.append("script-resolution-unverified-output")
                          break
          # Shared shell parsing for the consumer checks below.
          # Residual: -c payloads (drift, needs human review), URLs/paths
          # assembled from variables, read/getopts/printf -v rebindings.
          SHELL_KEYWORDS = {"if", "then", "else", "elif", "fi", "for",
                            "while", "until", "do", "done", "case", "in",
                            "esac", "select", "function", "time", "!",
                            "[[", "]]", "{", "}"}
          # Peeled (transparent) leading words; `for/select/case` pieces
          # are skipped outright (word lists, not commands).
          STRIP_WORDS = {"if", "while", "until", "time", "!", "then",
                         "do", "else", "elif", "{", "}"}
          INTERP_ALLOW = {"bash", "sh", "source", "."}
          STRICT_ALLOW = INTERP_ALLOW | {
              "set", "echo", "exit", "export", "readonly", "local",
              "declare", "typeset", "true", "false", ":", "test"}
          # Vars whose assignment redirects execution or the environment
          # of later commands in the same step (PATH hijack, preloaded
          # libraries, startup files, parser behavior).
          ENV_POISON = ("PATH", "LD_PRELOAD", "LD_LIBRARY_PATH",
                        "BASH_ENV", "ENV", "ZDOTDIR", "PYTHONPATH",
                        "PYTHONHOME", "RUBYLIB", "RUBYOPT", "PERL5LIB",
                        "PERL5OPT", "NODE_PATH", "NODE_OPTIONS",
                        "DYLD_LIBRARY_PATH", "DYLD_INSERT_LIBRARIES",
                        "IFS")

          def split_commands2(text):
              # Quote-aware operator split. Yields (piece,
              # started_after_open, ended_at_close) so `a)` case patterns
              # (not after `(`) are distinguishable from `(cmd)` bodies.
              parts = []
              buf, quote = "", None
              started_after_open = False
              for ch in text:
                  if quote:
                      buf += ch
                      if ch == quote:
                          quote = None
                  elif ch in ("'", '"'):
                      quote, buf = ch, buf + ch
                  elif ch in ";|&()":
                      parts.append((buf, started_after_open, ch == ")"))
                      buf = ""
                      started_after_open = (ch == "(")
                  else:
                      buf += ch
              parts.append((buf, started_after_open, False))
              return parts

          def tokenize(text):
              return re.findall(r"\"[^\"\n]*\"|'[^'\n]*'|\S+", text)

          def unquote(token):
              if len(token) >= 2 and token[0] == token[-1] \
                      and token[0] in ("'", '"'):
                  return token[1:-1]
              return token

          def peel_prefix(words):
              # Strip VAR= assigns, timeout + duration, transparent
              # builtins and control keywords; returns (argv0, rest).
              i = 0
              timeout_args = {"-s", "--signal", "-k", "--kill-after"}
              while i < len(words):
                  word = words[i]
                  if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*=\S*",
                                  word):
                      i += 1
                  elif word == "timeout":
                      i += 1
                      while i < len(words) \
                              and words[i].startswith("-"):
                          i += 2 if words[i] in timeout_args else 1
                      i += 1
                  elif word in ("command", "builtin", "exec",
                               "sudo", "doas"):
                      i += 1
                  elif word in STRIP_WORDS:
                      i += 1
                  else:
                      break
              if i >= len(words):
                  return "", []
              return words[i], words[i + 1:]

          def script_operand(rest):
              # Validate an interpreter's script operand. Returns True
              # when bound (or provably non-executing), False on drift.
              # --version/--help/-n exit or never execute: safe with any
              # operand. -c/--command drifts (arbitrary code, review it).
              # -s/stdin/no-operand drifts (uninspectable script).
              query = {"--version", "--help", "-n", "--noexec"}
              if any(t in query for t in rest):
                  return True
              redir = re.compile(r"^\d*(>>|>|<<|<<<|<|>&|<&)")
              i = 0
              while i < len(rest):
                  tok = rest[i]
                  m = redir.match(tok)
                  if m:
                      i += 1 if len(tok) > m.end() else 2
                  elif tok == "--":
                      i += 1
                      break
                  elif tok == "-" or tok in ("-c", "--command",
                                             "--init-file", "--rcfile"):
                      return False
                  elif re.fullmatch(r"[+-][a-zA-Z]+", tok):
                      if "c" in tok:
                          return False
                      if "s" in tok:
                          return False
                      if tok in ("-o", "+o") \
                              or re.fullmatch(r"[+-][a-zA-Z]*o", tok):
                          i += 2
                      else:
                          i += 1
                  elif tok.startswith("--"):
                      i += 1
                  else:
                      break
              if i >= len(rest):
                  return False
              op = rest[i]
              if re.match(r"^\$\{?SCRIPT_DIR\}?/", op):
                  return True
              # Concatenated so the raw text never holds an expression
              # opener, which actionlint would parse as this job's
              # expression (steps.scriptdir is undefined here).
              return re.sub(r"\s+", "", op).startswith(
                  "${" "{steps.scriptdir.outputs.dir}}")

          def run_segments(lines):
              bodies = []
              i = 0
              while i < len(lines):
                  m = re.match(r"^(\s*)run:\s*([|>])?\s*(.*)$",
                               lines[i])
                  if m and (m.group(2) or m.group(3)):
                      base = len(m.group(1))
                      if m.group(2):
                          j = i + 1
                          while j < len(lines) \
                                  and (not lines[j].strip()
                                       or len(lines[j])
                                       - len(lines[j].lstrip()) > base):
                              bodies.append(lines[j])
                              j += 1
                          i = j
                      else:
                          bodies.append(m.group(3))
                          i += 1
                  else:
                      i += 1
              joined = []
              buf = ""
              for raw in bodies:
                  stripped = raw.rstrip()
                  if stripped.endswith("\\"):
                      buf += stripped[:-1] + " "
                  else:
                      buf += stripped
                      joined.append(buf)
                      buf = ""
              return joined

          # Every executable reference to the review scripts must route
          # through the validated resolver output: a later edit could
          # otherwise hardcode the PR-head scripts path in a token step
          # while the resolver above still looks safe.
          # (a) Path literals live only in the three steps that own the
          # trusted tree (collision-clear, trusted checkout, resolver):
          # consumers name no path (they use ${SCRIPT_DIR}).
          tree_ok = set()
          clear = [i for i, line in enumerate(workflow_lines)
                   if re.match(r"^- name:\s*Clear trusted-scripts collision\s*$",
                               line.strip())]
          if trusted:
              s = step_start(workflow_lines, trusted[0])
              tree_ok.update(range(s, step_end(workflow_lines, s)))
          if resolve:
              tree_ok.update(range(resolve[0],
                                   step_end(workflow_lines, resolve[0])))
          if clear:
              tree_ok.update(range(clear[0],
                                   step_end(workflow_lines, clear[0])))
          for i, line in enumerate(workflow_lines):
              if i in tree_ok:
                  continue
              if ".github/scripts" in line or "trusted-scripts" in line:
                  drift.append("script-consumer-unbound-path")
                  break
          # (b) In run: blocks, every bash/sh/source operand naming a
          # script must route via ${SCRIPT_DIR} (bound in (c) to the
          # resolver output). Flags are parsed (combined shorts, -o
          # args, -- end, redirects); -c/-s/stdin/no-operand drifts.
          joined = run_segments(code_lines)
          for seg in joined:
              # Builtin-qualified (export/local/readonly/declare/typeset,
              # with optional flags) and prefix-assigned rebindings count
              # too: `export SCRIPT_DIR=...` evades a bare-assign match.
              # Residual: read/getopts/printf -v/nameref indirection.
              if re.search(r"(?:^|[;&|])\s*(?:[A-Za-z_][A-Za-z0-9_]*=\S+\s+)*"
                           r"(?:(?:export|local|readonly|declare|typeset)\s+"
                           r"(?:-\S+\s+)*)?"
                           r"(?:[A-Za-z_][A-Za-z0-9_]*=\S+\s+)*"
                           r"SCRIPT_DIR\s*=", seg) \
                      and "script-dir-rebound" not in drift:
                  drift.append("script-dir-rebound")
              nosub = re.sub(r"[A-Za-z_][A-Za-z0-9_]*\(\)\s*\{?", "",
                             seg)
              for piece, _, _ in split_commands2(nosub):
                  words = [unquote(t) for t in tokenize(piece)]
                  if not words:
                      continue
                  argv0, rest = peel_prefix(words)
                  if argv0 not in INTERP_ALLOW:
                      continue
                  if not script_operand(rest) \
                          and "script-consumer-unbound-invocation" \
                          not in drift:
                      drift.append("script-consumer-unbound-invocation")
          # (c) The variable itself: ${SCRIPT_DIR} is only the validated
          # directory if every binding routes via the resolver output.
          # A hardcoded SCRIPT_DIR would launder an untrusted path
          # through check (b).
          for line in workflow_lines:
              m = re.match(r"^SCRIPT_DIR:\s*(.+)$", line.strip())
              if m and re.sub(r"\s+", "", m.group(1)) != \
                      ("${" "{steps.scriptdir.outputs.dir}}") \
                      and "script-dir-rebound" not in drift:
                  drift.append("script-dir-rebound")
          # The whole analyzer assumes bash: a shell: override would
          # silently invalidate every rule below.
          if any(re.match(r"^\s*shell:", line) for line in workflow_lines):
              drift.append("shell-override")
          # Only the two pinned checkouts may run as actions: a third
          # uses: could smuggle execution past the run:-block rules.
          for line in workflow_lines:
              m = re.match(r"^uses:\s*(\S+)", line.strip())
              if m and m.group(1) != PINNED_CHECKOUT_USES \
                      and "reviewer-unpinned-action" not in drift:
                  drift.append("reviewer-unpinned-action")
          # Global run-body forbids: env/path propagation, process
          # substitution, and command substitution execute or persist
          # beyond the per-command rules (every step inherits runner
          # runtime tokens, so even secretless steps can exfiltrate).
          for seg in joined:
              nosq = re.sub(r"'[^']*'", "''", seg)
              if ("GITHUB_ENV" in nosq or "GITHUB_PATH" in nosq) \
                      and "run-body-env-escape" not in drift:
                  drift.append("run-body-env-escape")
              if re.search(r"<\(", nosq) \
                      and "run-body-process-sub" not in drift:
                  drift.append("run-body-process-sub")
              if ("`" in nosq or re.search(r"\$\((?!\()", nosq)) \
                      and "run-body-substitution" not in drift:
                  drift.append("run-body-substitution")
              # One-line `function f { evil; }` bodies evade operator
              # splitting (argv0 reads `function`), so definitions of
              # either spelling drift everywhere, not just secret steps.
              if re.search(r"function\s+[A-Za-z_][A-Za-z0-9_]*"
                           r"|[A-Za-z_][A-Za-z0-9_]*\(\)", nosq) \
                      and "run-body-function-def" not in drift:
                  drift.append("run-body-function-def")
          # (d) Per-step command allowlists. Secret-bearing steps
          # (derived: any secrets. reference in the span, so an aliased
          # token auto-escalates its step) plus the integrity-critical
          # installer step take STRICT_ALLOW; remaining steps take that
          # plus git/rm (the collision step's tools). Every step
          # inherits runner runtime tokens, so even secretless steps
          # cannot run exfil-capable commands. Unknown interpreters,
          # direct executables, eval/traps/aliases, and sudo in secret
          # steps all drift. PATH-family assignment would hijack later
          # argv0 resolution within the step, so it drifts in secret
          # steps too. Residual: rm operands (runner-local DoS only;
          # no secrets or consumed outputs in rm-bearing steps).
          secret_ref = re.compile(
              r"secrets\s*\.\s*[A-Za-z_]\w*|github\s*\.\s*token\b",
              re.IGNORECASE)
          LOOSE_ALLOW = STRICT_ALLOW | {"git", "rm"}
          GIT_SAFE_FLAGS = {"--no-pager", "-v", "--version", "-h",
                            "--help"}
          GIT_DANGER_FLAGS = {"-c", "--config", "--config-env",
                              "--exec-path", "-p", "--paginate",
                              "--git-dir", "--work-tree"}
          GIT_READ_SUBCOMMANDS = {"cat-file", "help", "version"}
          poison_alt = "(?:" + "|".join(ENV_POISON) + ")"
          assign_prefix = (r"(?:^|[;&|])\s*(?:[A-Za-z_][A-Za-z0-9_]*"
                           r"=\S+\s+)*")
          builtin_prefix = (r"(?:(?:export|local|readonly|declare|"
                            r"typeset)\s+(?:-\S+\s+)*)?"
                            r"(?:[A-Za-z_][A-Za-z0-9_]*=\S+\s+)*")
          bounds = [i for i, line in enumerate(workflow_lines)
                    if is_step_boundary(line)] + [len(workflow_lines)]
          for k in range(len(bounds) - 1):
              span = workflow_lines[bounds[k]:bounds[k + 1]]
              name_m = re.match(r"^\s*-\s*name:\s*(.+)$",
                                span[0].strip())
              step_name = name_m.group(1).strip() if name_m else ""
              strict = step_name == "Install Muse Code" or any(
                  secret_ref.search(line) for line in span)
              allowed = STRICT_ALLOW if strict else LOOSE_ALLOW
              for seg in run_segments(span):
                  code = re.sub(r"'[^']*'", "''", seg)
                  if strict and re.search(
                          assign_prefix + builtin_prefix
                          + poison_alt + r"\s*=", code) \
                          and "secret-step-path-hijack" not in drift:
                      drift.append("secret-step-path-hijack")
                  if strict and re.search(
                          assign_prefix + r"(?:sudo|doas)\b", code) \
                          and "secret-step-untrusted-command" not in drift:
                      drift.append("secret-step-untrusted-command")
                  masked = re.sub(r"\[\[.*?\]\]", "[[ ]]", code)
                  masked = re.sub(r"\(\(.*?\)\)", "(())", masked)
                  # The git -C check below compares this variable's value,
                  # so it survives masking (anything else would accept
                  # `-C "${EVIL}"` via the masked placeholder).
                  masked = re.sub(
                      r"\$\{[^{}]*\}",
                      lambda m: m.group(0)
                      if m.group(0) == "${GITHUB_WORKSPACE}" else "${}",
                      masked)
                  masked = re.sub(
                      r"[A-Za-z_][A-Za-z0-9_]*\(\)\s*\{?", "", masked)
                  for piece, after_open, at_close in \
                          split_commands2(masked):
                      if at_close and not after_open:
                          continue
                      words = [unquote(t) for t in tokenize(piece)]
                      if not words:
                          continue
                      argv0, rest = peel_prefix(words)
                      if not argv0 or argv0 in SHELL_KEYWORDS \
                              or argv0 in ("for", "select", "case"):
                          continue
                      if re.match(r"^[\*\?\[]", argv0) \
                              or re.match(r"^\d*[<>]", argv0):
                          continue
                      if argv0 not in allowed \
                              and "secret-step-untrusted-command" \
                              not in drift:
                          drift.append("secret-step-untrusted-command")
                      if argv0 == "git":
                          # git reads only, from the workspace: no config
                          # injection, no pager exec, no path redirect,
                          # no fetch/write subcommands, and no
                          # filter/textconv execution via subcommand args.
                          i = 0
                          sub = None
                          bad_git = False
                          while i < len(rest):
                              tok = rest[i]
                              if tok in GIT_DANGER_FLAGS:
                                  bad_git = True
                                  break
                              if tok in GIT_SAFE_FLAGS:
                                  i += 1
                              elif tok == "-C":
                                  nxt = rest[i + 1] if i + 1 < len(rest) \
                                      else ""
                                  nxt = nxt.rstrip("/")
                                  if nxt != "${GITHUB_WORKSPACE}" \
                                          and not nxt.startswith(
                                              "${GITHUB_WORKSPACE}/"
                                              "trusted-scripts"):
                                      bad_git = True
                                      break
                                  i += 2
                              elif tok.startswith("-"):
                                  bad_git = True
                                  break
                              else:
                                  sub = tok
                                  i += 1
                                  break
                          if not bad_git and sub is not None:
                              if sub not in GIT_READ_SUBCOMMANDS:
                                  bad_git = True
                              elif any(a in ("--filters", "--textconv")
                                       for a in rest[i:]):
                                  bad_git = True
                          if bad_git and "secret-step-untrusted-command" \
                                  not in drift:
                              drift.append("secret-step-untrusted-command")
          # The data-only premise rests on the agent invocation itself:
          # every muse call in the trusted runner must carry the exact
          # execution-disabling flags (comment mentions do not count) and
          # must shed the GitHub token. Backslash continuations joined.
          runner_path = ".github/scripts/muse-review/run.sh"
          try:
              with open(runner_path) as fh:
                  runner_raw = fh.read().splitlines()
          except OSError:
              runner_raw = []
          if not runner_raw:
              drift.append("agent-runner-missing")
          else:
              logical = []
              buf = ""
              for raw in runner_raw:
                  code = strip_comments(raw).rstrip()
                  if code.endswith("\\"):
                      buf += code[:-1] + " "
                  else:
                      buf += code
                      logical.append(buf)
                      buf = ""
              if buf.strip():
                  logical.append(buf)
              # Command-position match: quoted-path form (the real call) or a
              # bare muse following a command boundary/keyword. Prose
              # mentions (echo "muse ...") and identifiers (muse_rc,
              # muse-review) must not count as invocations.
              invocation = re.compile(
                  r"/muse(?=[\"'\s]|$)|(?:^|[;&|()!`]|"
                  r"\b(?:if|while|until|time|sudo|command|builtin|exec)\s+)"
                  r"\s*muse(?=\s|$)")
              calls = [line for line in logical if invocation.search(line)]
              if not calls:
                  drift.append("agent-invocation-missing")
              elif len(calls) != 1:
                  drift.append(f"agent-invocation-count={len(calls)}")
              else:
                  line = calls[0]
                  # Scope checks to the simple command containing muse:
                  # flags on a later chained command (muse ...; echo
                  # --disable-shell) must not satisfy them. Bounds are
                  # unquoted shell operators; redirects (>, <) stay
                  # inside the command. Disable flags are muse's own
                  # argv; -u may precede it (env prefix) so it is read
                  # from the whole scoped command.
                  ops = []
                  quote = None
                  for pos, ch in enumerate(line):
                      if quote:
                          if ch == quote:
                              quote = None
                      elif ch in ("'", '"'):
                          quote = ch
                      elif ch in ";|&()`":
                          ops.append(pos)
                  match = invocation.search(line)
                  seg_start = max([p + 1 for p in ops
                                   if p <= match.start()] + [0])
                  seg_end = min([p for p in ops
                                 if p >= match.end()] + [len(line)])
                  segment = line[seg_start:seg_end]
                  argv = line[match.end():seg_end]
                  if not re.search(r"(?:^|\s)--disable-shell(?:\s|$)", argv):
                      drift.append("agent-shell-boundary")
                  elif not re.search(r"(?:^|\s)--disable-write(?:\s|$)", argv):
                      drift.append("agent-write-boundary")
                  elif ("-u GITHUB_TOKEN" not in segment
                        or "-u GH_TOKEN" not in segment):
                      drift.append("agent-token-isolation")
          # The runner scrubs only the two conventional token variable
          # names: a token passed to the agent step under another key (or
          # via job-level env, which the step inherits) would survive into
          # the third-party process. Forbid token expressions in both.
          token_expr = re.compile(
              r"secrets\s*\.\s*github_token\b|github\s*\.\s*token\b",
              re.IGNORECASE)
          agent_step = [i for i, line in enumerate(workflow_lines)
                        if re.match(r"^- name:\s*Run Muse review\s*$",
                                    line.strip())]
          agent_span = []
          if agent_step:
              s = agent_step[0]
              agent_span = workflow_lines[s:step_end(workflow_lines, s)]
          else:
              drift.append("agent-step-missing")
          job_env = []
          in_env = False
          for line in code_lines:
              # Job-level env: is 4-space (jobs.<name>.env); step-level
              # is 8-space and must not start a job-env region.
              if re.match(r"^    env:\s*$", line):
                  in_env = True
              elif re.match(r"^  \S|^    \S", line):
                  in_env = False
              elif in_env:
                  job_env.append(line)
          for line in agent_span + job_env:
              if token_expr.search(line):
                  drift.append("agent-token-expression")
                  break
          # install.sh determines the executable that receives META_API_KEY:
          # pin its version and checksum shape, require verification before
          # install, forbid pipe-to-shell, and tie the artifact URL to the
          # pinned version on the pinned host.
          installer_path = ".github/scripts/muse-review/install.sh"
          try:
              with open(installer_path) as fh:
                  installer_raw = fh.read().splitlines()
          except OSError:
              installer_raw = []
          if not installer_raw:
              drift.append("muse-installer-missing")
          else:
              installer = [strip_comments(line) for line in installer_raw]
              version = [line.strip()[len("MUSE_VERSION="):]
                         for line in installer
                         if re.match(r"^MUSE_VERSION=", line.strip())]
              if not version or not all(
                      v.strip("\"'") == MUSE_PINNED_VERSION
                      for v in version):
                  drift.append("muse-installer-version")
              # Exact values, not just 64-hex shape: a re-pointed
              # download with freshly computed hashes must fail here.
              pinned_sha = {"SHA_X86_LINUX": MUSE_PINNED_SHA_X86,
                            "SHA_AARCH64_LINUX": MUSE_PINNED_SHA_AARCH64}
              for var, want in pinned_sha.items():
                  vals = [line.strip()[len(var) + 1:]
                          for line in installer
                          if re.match(r"^" + var + r"=", line.strip())]
                  if not vals or not all(
                          v.strip().strip("\"'") == want
                          for v in vals):
                      drift.append("muse-installer-checksum")
                      break
              def first_cmd(stripped_line):
                  rest = stripped_line.strip()
                  while True:
                      m = re.match(r"[A-Za-z_][A-Za-z0-9_]*=\S+\s*",
                                   rest)
                      if not m:
                          break
                      rest = rest[m.end():]
                  m = re.match(r"\S+", rest)
                  return m.group(0) if m else ""
              verify_at = [i for i, line in enumerate(installer)
                           if re.search(r"(?:^|[\s;&|()$`'\"])"
                                        r"sha256sum(?:\s|$)", line)
                           and first_cmd(line) not in ("echo", "printf")]
              cmp_at = [i for i, line in enumerate(installer)
                        if "got_sha" in line and "want_sha" in line
                        and "!=" in line
                        and first_cmd(line) not in ("echo", "printf")]
              install_at = [i for i, line in enumerate(installer)
                            if first_cmd(line) == "install"
                            and "tmp_bin" in line]
              if not verify_at:
                  drift.append("muse-installer-no-verify")
              if not cmp_at:
                  drift.append("muse-installer-no-compare")
              if not install_at:
                  drift.append("muse-installer-no-install")
              elif verify_at and cmp_at \
                      and min(install_at) < max(verify_at + cmp_at):
                  drift.append("muse-installer-unverified-install")
              if any(re.search(r"\|\s*(?:sudo\s+)?(?:bash|sh)\b", line)
                     for line in installer):
                  drift.append("muse-installer-pipe")
              # Every URL literal in the installer must be the pinned
              # versioned download: a substring check would pass an evil
              # host alongside a retained unused lookaside string.
              # Residual: URLs assembled from variables.
              for line in installer:
                  for url in re.findall(r"https?://[^\s\"'`]+", line):
                      if not url.startswith(MUSE_PINNED_HOST) \
                              or "version=${MUSE_VERSION}" not in url:
                          drift.append("muse-installer-url")
                          break
                  else:
                      continue
                  break
          if drift:
              print(f"::error::muse-code-review.yml hardening drifted "
                    f"({', '.join(drift)}); keeping SARIF unfiltered.")
              sys.exit(1)

          def is_audited_checkout(result):
              suppressions = result.get("suppressions") or []
              if not suppressions or not all(
                      s.get("kind") == "inSource" for s in suppressions):
                  return False
              if result.get("ruleId") != AUDITED_RULE_ID:
                  return False
              locations = result.get("locations", [])
              if not locations:
                  return False
              for loc in locations:
                  physical = loc.get("physicalLocation", {})
                  uri = (physical.get("artifactLocation", {}).get("uri", "")
                         or "").replace("\\", "/").strip()
                  # Exact normalized match: a suffix test would also accept
                  # a nested lookalike (e.g. archive/.github/workflows/...).
                  if posixpath.normpath(uri) != AUDITED_PATH:
                      return False
                  # Pin the exact audited finding by region, not just the
                  # file: a second suppressed checkout elsewhere in the
                  # workflow must stay visible. The span is computed from
                  # the workflow itself (no hardcoded lines, no snippet
                  # dependency); anything unlocatable fails closed.
                  start_line = physical.get("region", {}).get("startLine")
                  if not isinstance(start_line, int):
                      return False
                  if not audited_start or not (audited_start
                                               <= start_line <= audited_end):
                      return False
              return True

          if not (os.path.isfile("semgrep.sarif")
                  and os.path.getsize("semgrep.sarif") > 0):
              # Empty scan (e.g. a runner-only PR): the audit above still
              # ran and passed; there is just nothing to filter.
              print("::notice::Drift audit passed with no SARIF to filter "
                    "(empty scan); exemption inactive.")
              sys.exit(0)
          with open("semgrep.sarif") as fh:
              sarif = json.load(fh)
          for run in sarif.get("runs", []):
              kept = []
              for result in run.get("results", []):
                  if is_audited_checkout(result):
                      continue
                  kept.append(result)
                  # Shape/suppression drift is fail-closed (the alert
                  # re-opens) but otherwise silent: surface it so the
                  # cause (emitter shape change vs removed nosemgrep) is
                  # investigated instead of the filter being blamed.
                  for loc in result.get("locations", []):
                      physical = loc.get("physicalLocation", {})
                      uri = (physical.get("artifactLocation", {})
                             .get("uri", "") or "").replace("\\", "/").strip()
                      if result.get("ruleId") == AUDITED_RULE_ID \
                              and posixpath.normpath(uri) == AUDITED_PATH:
                          print("::warning::Audited checkout finding present "
                                "but not filtered (suppressions removed or "
                                "SARIF shape changed?); alert 1498 may "
                                "re-open. Audit: " + AUDITED_PATH + ".")
                          break
              run["results"] = kept
          with open("semgrep.sarif", "w") as fh:
              json.dump(sarif, fh)
          EOF

      - name: Verify SARIF exists
        id: verify-sarif
        if: always()
        run: |
          if [ -s semgrep.sarif ]; then
            echo "sarif_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF file
        # Pin to full SHA for supply chain security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && steps.verify-sarif.outputs.sarif_exists == 'true'
        with:
          sarif_file: semgrep.sarif

      - name: Fail if Semgrep reported findings
        if: steps.verify-sarif.outputs.sarif_exists == 'true' && (steps.semgrep_pr.outcome == 'failure' || steps.semgrep_push.outcome == 'failure' || steps.semgrep_full.outcome == 'failure')
        run: exit 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        # Pin to full SHA for supply chain security
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          # 2026 best practice: use allow-licenses (deny-licenses is deprecated)
          # Allow permissive licenses + AGPL for TruffleHog security tool
          # Added OFL-1.1 for Google Fonts (expo-google-fonts packages)
          # Added MIT-0 for @csstools packages (MIT-0 is more permissive than MIT)
          # Added Ruby for Fastlane transitive gems (highline, httpclient, json, concurrent-ruby)
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            Unlicense, CC0-1.0, WTFPL, Zlib, BlueOak-1.0.0,
            MPL-2.0, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            CC-BY-3.0, CC-BY-4.0, Python-2.0, PSF-2.0, Artistic-2.0,
            OFL-1.1, Ruby
          # Allow packages with compound/dual licenses or approved source-available tooling.
          # Sentry CLI uses FSL-1.1-MIT and is required by the official React Native SDK
          # for native symbol and source-map uploads; keep the exception package-scoped.
          # nkf (Ruby/BSD-2-Clause, fastlane dep) and rdoc (dual Ruby/GPL-2.0,
          # fastlane->irb dep, build tooling only) are flagged only because of
          # scancode compound-expression artifacts; Ruby terms apply to both.
          allow-dependencies-licenses: >-
            pkg:gem/nkf,
            pkg:gem/rdoc,
            pkg:npm/big-integer,
            pkg:npm/protobufjs,
            pkg:npm/unicode-match-property-value-ecmascript,
            pkg:npm/unicode-property-aliases-ecmascript,
            pkg:npm/katex,
            pkg:npm/robust-predicates,
            pkg:npm/@posthog/react-native-plugin,
            pkg:npm/@posthog/nextjs-config,
            pkg:npm/posthog-js,
            pkg:npm/posthog-node,
            pkg:npm/@sentry/cli,
            pkg:npm/@sentry/cli-darwin,
            pkg:npm/@sentry/cli-linux-arm,
            pkg:npm/@sentry/cli-linux-arm64,
            pkg:npm/@sentry/cli-linux-i686,
            pkg:npm/@sentry/cli-linux-x64,
            pkg:npm/@sentry/cli-win32-arm64,
            pkg:npm/@sentry/cli-win32-i686,
            pkg:npm/@sentry/cli-win32-x64

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        # Pin to full SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: TruffleHog OSS
        # Pin to full SHA for supply-chain security
        uses: trufflesecurity/trufflehog@a5f3de55cc2065ae4dde8fee24076f137fd62fcf # v3.97.8
        with:
          extra_args: --only-verified --exclude-paths=.trufflehogignore
