name: Storefront edge inventory refresh

# The repository snapshot test binds
# docs/superpowers/evidence/storefront-edge/task-1a-inventory.json (digest and
# row count) to every app route and ~240 routing inputs. When two route-touching
# PRs land together, each passes on its own but main ends up with a stale
# snapshot, and every later PR inherits the failure. This workflow regenerates
# the snapshot after each push to main and, only when its content drifted,
# opens a DRAFT refresh PR (never auto-merged). PRs that change routes keep
# failing loudly on their own diff; unrelated PRs stop inheriting a broken main.

on:
  push:
    branches: [main]
    # Must cover every inventory routing input; storefront-edge-inventory-refresh-workflow-paths.test.ts
    # in apps/web/tools/cost fails when an input falls outside these globs.
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'supabase/migrations/**'
      - 'docs/superpowers/evidence/storefront-edge/**'
      - '.github/workflows/storefront-edge-inventory-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel: a cancelled write job could leave a pushed branch
# without its PR. GitHub keeps only the newest pending run, so the latest main
# always wins.
concurrency:
  group: storefront-edge-inventory-refresh
  cancel-in-progress: false

env:
  BRANCH_PREFIX: automation/storefront-edge-inventory-
  INVENTORY_PATH: docs/superpowers/evidence/storefront-edge/task-1a-inventory.json
  TEST_PATH: apps/web/tools/cost/storefront-edge-inventory-snapshot.repository.test.ts

jobs:
  # A manual dispatch from another branch would otherwise skip both jobs
  # silently; fail it visibly instead.
  require-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Refuse to run off main
        run: |
          echo "::error::Run this workflow from main; it only refreshes main's snapshot." >&2
          exit 1

  # Install dependencies and run repository code here, with a read-only token
  # and no persisted credentials. Only the two regenerated files cross into the
  # write job, as an artifact. The write job installs nothing and runs exactly
  # one repository script, push-storefront-edge-refresh-branch.sh, from this
  # main commit: it only pushes automation/storefront-edge-inventory-* branch
  # heads and reuses a branch only when it carries exactly this refresh.
  regenerate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      digest: ${{ steps.refresh.outputs.digest }}
      row_count: ${{ steps.refresh.outputs.row_count }}
      previous_row_count: ${{ steps.refresh.outputs.previous_row_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-cached
      - name: Regenerate the inventory snapshot from this main commit
        id: refresh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          untracked_before="$(git ls-files --others --exclude-standard | sort)"
          result="$(pnpm --dir apps/web exec tsx tools/cost/refresh-storefront-edge-inventory-snapshot.ts \
            --repo-root "$GITHUB_WORKSPACE" --source-sha "$SOURCE_SHA")"
          echo "$result"
          {
            echo "changed=$(jq -r '.changed' <<<"$result")"
            echo "digest=$(jq -r '.contentDigest' <<<"$result")"
            echo "row_count=$(jq -r '.rowCount // ""' <<<"$result")"
            echo "previous_row_count=$(jq -r '.previousRowCount // ""' <<<"$result")"
          } >> "$GITHUB_OUTPUT"
          # The refresher may only modify the snapshot and its test, and may
          # create no files (untracked files from the install are excluded by
          # comparing against the listing taken before the refresh).
          unexpected="$(git diff HEAD --name-only | grep -vxF -e "$INVENTORY_PATH" -e "$TEST_PATH" || true)"
          created="$(comm -13 <(printf '%s\n' "$untracked_before") <(git ls-files --others --exclude-standard | sort) | grep -v '^$' || true)"
          unexpected="$(printf '%s\n%s\n' "$unexpected" "$created" | grep -v '^$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::refresh touched unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
      # Never open a draft that would still fail the binding it exists to fix.
      # Only the binding test runs: other assertions in that file guard route
      # decisions, and failing those is a human call on the route PR.
      - name: Check the refreshed snapshot passes its binding test
        if: steps.refresh.outputs.changed == 'true'
        env:
          RESULT_JSON: ${{ runner.temp }}/binding-test.json
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec vitest run \
            tools/cost/storefront-edge-inventory-snapshot.repository.test.ts \
            -t 'binds the checked-in inventory snapshot to current committed source content' \
            --reporter=default --reporter=json --outputFile.json="$RESULT_JSON"
          # A name filter that matches nothing exits 0: require exactly one
          # executed, passing test so a renamed title cannot pass vacuously.
          if ! jq -e '.numPassedTests == 1 and .numFailedTests == 0' "$RESULT_JSON" >/dev/null; then
            echo "::error::the snapshot binding test did not run exactly once and pass" >&2
            jq '{numTotalTests, numPassedTests, numFailedTests, numPendingTests}' "$RESULT_JSON" >&2
            exit 1
          fi
      - name: Stage the regenerated files
        if: steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p refreshed
          cp "$INVENTORY_PATH" refreshed/task-1a-inventory.json
          cp "$TEST_PATH" refreshed/storefront-edge-inventory-snapshot.repository.test.ts
      - name: Upload the regenerated files
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storefront-edge-inventory-refresh
          path: refreshed
          if-no-files-found: error
          retention-days: 3

  open-refresh-pr:
    needs: regenerate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the regenerated files
        if: needs.regenerate.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storefront-edge-inventory-refresh
          path: ${{ runner.temp }}/refreshed
      - name: Open a draft refresh PR or close superseded ones
        env:
          # PRs created with GITHUB_TOKEN do not trigger pull_request workflows.
          # Configure BACI_AUTOMATION_PR_TOKEN (contents + pull-requests write)
          # so the draft gets CI and reviewers without a manual close/reopen.
          GH_TOKEN: ${{ secrets.BACI_AUTOMATION_PR_TOKEN || github.token }}
          HAS_AUTOMATION_TOKEN: ${{ secrets.BACI_AUTOMATION_PR_TOKEN != '' }}
          CHANGED: ${{ needs.regenerate.outputs.changed }}
          DIGEST: ${{ needs.regenerate.outputs.digest }}
          ROW_COUNT: ${{ needs.regenerate.outputs.row_count }}
          PREVIOUS_ROW_COUNT: ${{ needs.regenerate.outputs.previous_row_count }}
          SOURCE_SHA: ${{ github.sha }}
          REFRESHED_DIR: ${{ runner.temp }}/refreshed
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          if [ "$HAS_AUTOMATION_TOKEN" != "true" ]; then
            echo "::warning::BACI_AUTOMATION_PR_TOKEN is not set: a refresh draft opened with GITHUB_TOKEN gets no pull_request CI until someone closes and reopens it."
            echo "BACI_AUTOMATION_PR_TOKEN is not set; refresh drafts need a close/reopen to start CI." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Paginated, so no open-PR count can hide an older refresh PR.
          open_heads="$(gh api --paginate "repos/${REPO}/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.REPO) | .head.ref' \
            | grep -Ex "${BRANCH_PREFIX}[a-f0-9]{12}-[a-f0-9]{12}" || true)"
          keep=""
          if [ "$CHANGED" = "true" ]; then
            if ! printf '%s\n' "$DIGEST" | grep -Eqx '[a-f0-9]{64}'; then
              echo "::error::invalid content digest" >&2
              exit 1
            fi
            prefix="${BRANCH_PREFIX}${DIGEST:0:12}-"
            keep="$(printf '%s\n' "$open_heads" | grep -F "$prefix" | head -n1 || true)"
            if [ -n "$keep" ]; then
              echo "An open refresh PR for this content already exists on $keep."
            else
              branch="${prefix}${SOURCE_SHA:0:12}"
              cp "$REFRESHED_DIR/task-1a-inventory.json" "$INVENTORY_PATH"
              cp "$REFRESHED_DIR/storefront-edge-inventory-snapshot.repository.test.ts" "$TEST_PATH"
              git config user.name "github-actions[bot]"
              git config user.email "$BOT_EMAIL"
              # Reuses the branch when a rerun finds this exact refresh already
              # pushed (the earlier attempt never reached `gh pr create`).
              GIT_PUSH_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
                bash apps/web/tools/cost/push-storefront-edge-refresh-branch.sh \
                "$branch" "$SOURCE_SHA" "$INVENTORY_PATH" "$TEST_PATH" \
                "Regenerated from main ${SOURCE_SHA} by ${RUN_URL}."
              body="$(printf '%s\n' \
                "Automated refresh: main's storefront edge inventory snapshot no longer matches the committed routes, so \`storefront-edge-inventory-snapshot.repository.test.ts\` fails on main and on every PR synced with it." \
                "" \
                "- Regenerated from main \`${SOURCE_SHA}\` with \`apps/web/tools/cost/refresh-storefront-edge-inventory-snapshot.ts\`" \
                "- Row count: ${PREVIOUS_ROW_COUNT:-?} → ${ROW_COUNT}" \
                "- Run: ${RUN_URL}" \
                "" \
                "Only the snapshot JSON and the expected digest/row count in the test change. Review the row diff before marking ready: a new route must land on the intended edge decision. Never auto-merged; a newer refresh closes this PR as superseded.")"
              keep="$branch"
              gh pr create --draft --base main --head "$branch" \
                --title "fix(ci): refresh storefront edge inventory snapshot" \
                --body "$body"
            fi
          else
            echo "Snapshot content matches main; nothing to refresh."
          fi
          # Close refresh PRs that main or a newer refresh made obsolete.
          new_url=""
          if [ -n "$keep" ]; then new_url="$(gh pr view "$keep" --json url --jq .url)"; fi
          printf '%s\n' "$open_heads" | while IFS= read -r head; do
            if [ -z "$head" ] || [ "$head" = "$keep" ]; then continue; fi
            # Only close a branch that still holds just the bot's one refresh
            # commit; a branch with human follow-ups stays open for a person.
            # Amending or replacing that commit changes its committer, so a
            # human-edited refresh is never closed or deleted here.
            compare="$(gh api "repos/${REPO}/compare/main...${head}" 2>/dev/null || true)"
            ahead="$(jq -r '.ahead_by // ""' <<<"${compare:-null}")"
            bot_authored="$(jq -r --arg bot "$BOT_EMAIL" \
              '[.commits[]? | .commit.author.email == $bot and .commit.committer.email == $bot] | (length == 1 and all)' \
              <<<"${compare:-null}")"
            foreign="$(jq -r '.files[]?.filename' <<<"${compare:-null}" | grep -vxF -e "$INVENTORY_PATH" -e "$TEST_PATH" || true)"
            if [ "$ahead" != "1" ] || [ "$bot_authored" != "true" ] || [ -n "$foreign" ]; then
              echo "::warning::Leaving $head open: it carries more than the bot's own refresh commit."
              continue
            fi
            reason="Main now matches the regenerated snapshot."
            if [ -n "$new_url" ]; then reason="Superseded by $new_url."; fi
            # Best effort: one failed close must not skip the rest.
            gh pr close "$head" --delete-branch --comment "$reason (closed by $RUN_URL)" \
              || echo "::warning::Could not close $head; leaving it for the next run."
          done
