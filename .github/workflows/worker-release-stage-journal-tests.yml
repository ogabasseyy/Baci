name: Worker release stage journal tests

on:
  pull_request:
    paths:
      - 'vps-workers/bin/worker_release_stage_journal.py'
      - 'vps-workers/bin/worker_release_stage_journal_io.py'
      - 'vps-workers/bin/worker_release_stage_journal_resources.py'
      - 'vps-workers/bin/worker_release_stage_journal_recovery.py'
      - 'vps-workers/bin/worker_release_stage_journal_resource_api.py'
      - 'vps-workers/bin/worker_release_stage_journal.test.py'
      - 'vps-workers/bin/worker_release_stage_journal_committed_recovery.test.py'
      - 'vps-workers/bin/worker_release_stage_journal_resources.test.py'
      - 'vps-workers/bin/worker_release_result_root.py'
      - 'vps-workers/bin/worker_release_systemd_extractor.py'
      - 'vps-workers/bin/worker_release_systemd_contract.py'
      - 'vps-workers/bin/worker_release_systemd_extractor.test.py'
      - 'vps-workers/bin/worker_release_extractor_control_dac.test.py'
      - 'vps-workers/bin/worker_release_systemd_test_support.py'
      - 'vps-workers/bin/worker_release_systemd_test_support.test.py'
      - 'vps-workers/bin/worker_release_archive_extract_child.py'
      - 'vps-workers/bin/provision-worker-source-extractor.py'
      - 'vps-workers/bin/worker_release_descriptor_cgroup.py'
      - 'vps-workers/bin/worker_release_descriptor_freeze.py'
      - 'vps-workers/bin/worker_release_descriptor_process.py'
      - 'vps-workers/bin/worker_release_source_snapshot.py'
      - 'vps-workers/systemd/baci-worker-source-extract@.service'
      - 'vps-workers/systemd/baci-worker-source-extract.tmpfiles'
      - '.github/workflows/worker-release-stage-journal-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-root-journal-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated journal regressions as root
        run: |
          sudo bash -s <<'BASH'
          set -euo pipefail
          fixture=/srv/baci-workers
          if [[ ! -d /srv || -L /srv || "$(stat -c '%u:%g' /srv)" != "0:0" ]]; then
            echo 'unsafe /srv parent for disposable worker-root fixture' >&2
            exit 1
          fi
          parent_mode="$(stat -c '%a' /srv)"
          if (( (8#$parent_mode & 022) != 0 )); then
            echo 'writable /srv parent for disposable worker-root fixture' >&2
            exit 1
          fi
          if [[ -e "$fixture" || -L "$fixture" ]]; then
            echo 'refusing pre-existing /srv/baci-workers fixture target' >&2
            exit 1
          fi
          install -d -o root -g root -m 0755 "$fixture"
          fixture_created=1
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$fixture_created" == 1 ]]; then
              if [[ -d "$fixture" && ! -L "$fixture" && -z "$(find "$fixture" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
                rmdir "$fixture"
              else
                echo 'disposable worker-root fixture changed unexpectedly' >&2
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          [[ "$(stat -c '%u:%g:%a' "$fixture")" == '0:0:755' ]]
          [[ -z "$(find "$fixture" -mindepth 1 -maxdepth 1 -print -quit)" ]]
          /usr/bin/python3 -B vps-workers/bin/provision-worker-source-extractor.py --apply
          /usr/bin/python3 -B vps-workers/bin/worker_release_stage_journal.test.py
          /usr/bin/python3 -B vps-workers/bin/worker_release_stage_journal_committed_recovery.test.py
          /usr/bin/python3 -B vps-workers/bin/worker_release_stage_journal_resources.test.py
          /usr/bin/python3 -B vps-workers/bin/worker_release_systemd_test_support.test.py
          WORKER_RELEASE_EXTRACT_REQUIRE_SYSTEMD=1 /usr/bin/python3 -B vps-workers/bin/worker_release_extractor_control_dac.test.py
          WORKER_RELEASE_EXTRACT_REQUIRE_SYSTEMD=1 /usr/bin/python3 -B vps-workers/bin/worker_release_systemd_extractor.test.py
          BASH
