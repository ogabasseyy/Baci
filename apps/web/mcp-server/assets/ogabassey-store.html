<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark light">
  <style>/* Ogabassey Premium Widget Styles */

:root {
  --primary: #dc2626;
  --primary-hover: #b91c1c;
  --success: #22c55e;
  --warning: #f59e0b;
  --background: #0a0a0a;
  --surface: #171717;
  --surface-hover: #262626;
  --border: rgba(255, 255, 255, 0.1);
  --text: #ffffff;
  --text-muted: #a3a3a3;
  --text-dim: #71717a;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
}

.coverage-notice {
  padding: 0 16px 16px;
  font-size: 14px;
  color: var(--text-muted);
}

.cart-error {
  color: var(--warning);
  padding: 0 1rem;
}

/* Light theme override */
html:has(.mode-fullscreen.theme-light),
body:has(.mode-fullscreen.theme-light),
.theme-light {
  --background: #fafafa;
  --surface: #ffffff;
  --surface-hover: #f4f4f5;
  --border: rgba(0, 0, 0, 0.1);
  --text: #18181b;
  --text-muted: #52525b;
  --text-dim: #a1a1aa;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: auto;
  min-height: 0;
  background: transparent;
}

body {
  padding: 20px 16px 16px;
  display: flex;
  justify-content: center;
}

#ogabassey-root {
  width: 100%;
  min-width: 0;
}

.ogabassey-widget {
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
    sans-serif;
  background: var(--background);
  color: var(--text);
  /* padding: 16px; -> Handled by body padding now */
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: none;
  overflow: clip;
}

.ogabassey-widget.mode-fullscreen {
  max-width: none;
  min-height: calc(100dvh - 36px);
}

html:has(.mode-fullscreen),
body:has(.mode-fullscreen) {
  min-height: 100dvh;
  background: var(--background);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.expand-button {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  padding: 9px 12px;
}

.expand-button:hover {
  border-color: var(--primary);
}

/* Header */
.widget-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 44px;
  height: 44px;
  background: white;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.brand-logo svg {
  width: 100%;
  height: 100%;
}

.brand-text h1 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 2px;
}

.brand-text p {
  font-size: 11px;
  color: var(--text-muted);
}

.cart-badge {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text);
}

.cart-badge:hover {
  background: var(--surface-hover);
  border-color: var(--primary);
}

.cart-badge-count {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--primary);
  color: white;
  font-size: 10px;
  font-weight: 700;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}


/* Products Grid */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.mode-fullscreen .products-grid {
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
}

.mode-fullscreen .products-grid--single {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
}

.products-grid--single .product-card {
  display: grid;
  grid-template-columns: minmax(96px, 32%) minmax(0, 1fr);
  grid-template-rows: 1fr auto;
}

.products-grid--single .product-image {
  grid-row: 1 / 3;
  aspect-ratio: 1;
}

.products-grid--single .product-actions {
  align-self: end;
}


/* Product Card */
.product-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--border);
  transition:
    transform 0.2s,
    box-shadow 0.2s,
    border-color 0.2s;
}

.product-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  border-color: var(--primary);
}

.product-image {
  aspect-ratio: 1;
  background: var(--surface-hover);
  position: relative;
  overflow: hidden;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
}

.product-card:hover .product-image img {
  transform: scale(1.05);
}

.no-image {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
}

.badge-discount {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--primary);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: var(--radius-full);
}

.badge-condition {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0, 0, 0, 0.7);
  color: var(--warning);
  font-size: 9px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--radius-full);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.product-info {
  padding: 12px;
}

.product-name {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-clamp: 2;
  overflow: hidden;
}

.product-price {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
}

.current-price {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
}

.original-price {
  font-size: 11px;
  color: var(--text-dim);
  text-decoration: line-through;
}

.stock-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 600;
  color: var(--success);
  background: rgba(34, 197, 94, 0.15);
  padding: 2px 8px;
  border-radius: var(--radius-full);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

/* Product Actions */
.product-actions {
  display: flex;
  gap: 8px;
  padding: 0 12px 12px;
}

.btn-add-cart,
.btn-buy-now {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 8px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
}

.btn-add-cart {
  background: transparent;
  border: 1px solid var(--primary);
  color: var(--primary);
}

.btn-add-cart:hover:not(:disabled) {
  background: rgba(220, 38, 38, 0.1);
}

.btn-add-cart.in-cart {
  background: rgba(34, 197, 94, 0.15);
  border-color: var(--success);
  color: var(--success);
}

.btn-add-cart:disabled {
  cursor: default;
}

.btn-buy-now {
  background: var(--primary);
  color: white;
}

.btn-buy-now:hover {
  background: var(--primary-hover);
}


/* Cart Summary */
.cart-summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 16px;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.cart-count {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
}

.cart-total {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
}

.cart-items {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.cart-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
}

.cart-item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cart-item-qty {
  color: var(--text-dim);
}

.cart-item-remove {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
  transition: color 0.2s;
}

.cart-item-remove:hover {
  color: var(--primary);
}

.btn-checkout {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-checkout:hover {
  background: var(--primary-hover);
}

.mobile-sticky-footer {
  position: sticky;
  bottom: 0;
  z-index: 10;
  display: none;
  grid-template-columns: 44px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  margin: 12px -16px 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--background);
  border-top: 1px solid var(--border);
  box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.24);
}

.theme-light .mobile-sticky-footer {
  box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12);
}

.btn-negotiate-icon,
.btn-checkout-sticky {
  min-height: 44px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition:
    background 0.2s,
    border-color 0.2s,
    transform 0.2s;
}

.btn-negotiate-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--primary);
}

.btn-negotiate-icon:hover {
  background: var(--surface-hover);
  border-color: var(--primary);
}

.btn-checkout-sticky {
  min-width: 0;
  padding: 0 16px;
  background: var(--primary);
  color: white;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.btn-checkout-sticky:hover {
  background: var(--primary-hover);
}

.btn-negotiate-icon:focus-visible,
.btn-checkout-sticky:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 24px;
  color: var(--text-dim);
}

.empty-state svg {
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state p {
  font-size: 14px;
}

/* Footer */
.widget-footer {
  text-align: center;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.btn-browse-more {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 24px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-browse-more:hover {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

/* Responsive */
@media (max-width: 600px) {
  body {
    padding: 20px 12px 12px;
  }

  .mobile-sticky-footer {
    display: grid;
  }

  .header-actions {
    flex-shrink: 0;
  }

  .expand-button {
    font-size: 11px;
    padding: 8px;
  }

  .products-grid--single .product-card {
    display: block;
  }
}

@media (max-width: 400px) {
  .products-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .products-grid--single {
    grid-template-columns: minmax(0, 1fr);
  }

  .product-name {
    font-size: 12px;
  }

  .product-actions {
    flex-direction: column;
    gap: 6px;
  }

  .brand-text p {
    display: none;
  }

  .btn-checkout-sticky {
    font-size: 12px;
    padding: 0 12px;
  }
}
