services:
  mcp-server:
    image: ${MCP_IMAGE_TAG:-ogabassey-mcp-server:latest}
    build:
      context: ../../..
      dockerfile: apps/web/mcp-server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - NODE_ENV=production
      - MCP_PORT=8787
      - MCP_PUBLIC_ORIGIN=${MCP_PUBLIC_ORIGIN:-https://mcp.ogabassey.com}
      - MCP_TRUST_PROXY_REAL_IP=${MCP_TRUST_PROXY_REAL_IP:-true}
      - MCP_ENABLE_AGENTIC_CHECKOUT_TOOLS=${MCP_ENABLE_AGENTIC_CHECKOUT_TOOLS:-false}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - BACI_AGENTIC_ACCESS_TOKEN=${BACI_AGENTIC_ACCESS_TOKEN}
      - BACI_AGENTIC_SIGNING_KEY=${BACI_AGENTIC_SIGNING_KEY}
      - OPENAI_AGENTIC_API_KEY=${OPENAI_AGENTIC_API_KEY}
      - OPENAI_AGENTIC_SIGNING_KEY=${OPENAI_AGENTIC_SIGNING_KEY}
      - MCP_AGENTIC_CHECKOUT_BASE_URL=${MCP_AGENTIC_CHECKOUT_BASE_URL:-https://ogabassey.com}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp.rule=Host(`mcp.ogabassey.com`)"
      - "traefik.http.routers.mcp.entrypoints=websecure"
      - "traefik.http.routers.mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp.loadbalancer.server.port=8787"

  # Optional: ngrok for quick public access during development
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http mcp-server:8787 --log stdout
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      - mcp-server
    profiles:
      - dev
