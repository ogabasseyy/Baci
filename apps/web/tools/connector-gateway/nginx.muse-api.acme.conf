# Temporary HTTP-only vhost for ACME HTTP-01 certificate issuance. It serves
# only challenge files and returns 404 for all application paths. Replace it
# with nginx.muse-api.conf after the certificate has been issued.
server {
    listen 80;
    server_name muse-api.usebaci.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/baci-muse-acme;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
