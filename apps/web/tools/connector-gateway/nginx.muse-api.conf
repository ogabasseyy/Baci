# Install only after DNS points muse-api.usebaci.com to the VPS and a
# certificate exists at the paths below. This vhost exposes only the docs,
# OpenAPI discovery and four read-only POST tools. All other paths (including
# /health and grant administration) are denied.
server {
    listen 80;
    server_name muse-api.usebaci.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name muse-api.usebaci.com;

    ssl_certificate /etc/letsencrypt/live/muse-api.usebaci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muse-api.usebaci.com/privkey.pem;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /docs {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3211/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /openapi.json {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3211/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/v0/tools/(orders\.list|orders\.get|inventory\.levels|analytics\.summary)$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3211;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
