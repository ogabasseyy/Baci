name = "baci-autocomplete-proxy"
main = "src/index.mjs"
compatibility_date = "2026-04-01"

[vars]
# Comma-separated browser origin allowlist (supports *.usebaci.com wildcards; empty fails closed)
ALLOWED_ORIGINS = "https://usebaci.com,*.usebaci.com,https://ogabassey.com,https://www.ogabassey.com"
# Public Supabase URL & anon key are configured via `wrangler secret put`
# Deploy from this directory with: pnpm run deploy (or `npx wrangler deploy`)
