# doublestar: `**` also matches zero directories, so package-root files
# (e.g. apps/mobile-admin/app.config.ts) are included.
glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    lint:
      # Only the packages whose `lint` script is `biome check` (what `turbo
      # lint` covers), and every file type Biome handles there.
      glob:
        - "apps/web/**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,graphql,gql}"
        - "apps/mobile-admin/**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,graphql,gql}"
        - "apps/mobile-storefront/**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,graphql,gql}"
        - "apps/cloudflare-evidence-qualification-worker/**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,graphql,gql}"
      env:
        PUPPETEER_SKIP_DOWNLOAD: "true"
        PUPPETEER_CHROME_SKIP_DOWNLOAD: "true"
        PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: "true"
        PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      # Lints the staged files of those packages instead of every file in
      # all of them. Like the old hook, Biome reads the working-tree copy,
      # so a partially staged file is checked as it is on disk. CI runs the
      # full `turbo lint` and knip for web changes; mobile-only changes rely
      # on this hook for lint.
      run: bash ci_scripts/run-lefthook-pnpm.sh exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    lint-config:
      # A Biome config change can affect every file, so re-lint the repo.
      glob: "**/biome.{json,jsonc}"
      env:
        PUPPETEER_SKIP_DOWNLOAD: "true"
        PUPPETEER_CHROME_SKIP_DOWNLOAD: "true"
        PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: "true"
        PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      run: bash ci_scripts/run-lefthook-pnpm.sh turbo lint
    check-podfile-lock:
      run: sh ci_scripts/check-podfile-lock.sh

pre-push:
  parallel: true
  commands:
    typecheck:
      env:
        PUPPETEER_SKIP_DOWNLOAD: "true"
        PUPPETEER_CHROME_SKIP_DOWNLOAD: "true"
        PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: "true"
        PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      run: bash ci_scripts/run-lefthook-pnpm.sh turbo typecheck
    # Tests intentionally run in CI, where the Quality Gate has the full
    # affected-test context plus build/misc guardrails. Keeping pre-push to
    # typecheck + behind-base avoids local pushes spending several minutes in
    # buffered Vitest output.
    behind-base:
      # Block the push when ANY pushed branch is behind its base. Reads
      # git's pre-push stdin protocol (`<local_ref> <local_sha> <remote_ref>
      # <remote_sha>` per line) so the refs actually pushed are checked, NOT
      # the checked-out HEAD (`git push origin feature-x` while on `main` must
      # not short-circuit). Catches the silent-revert failure mode where a
      # squash-merge of a stale branch reverts overlapping peer-PR changes.
      #
      # Base-resolution order (per pushed branch):
      #   1) per-branch override:  git config branch.<name>.base origin/<ref>
      #      (use for stacked PRs or branches off a non-default base)
      #   2) origin/HEAD symbolic ref (the actual repo default — works
      #      whether the default is `main`, `master`, `develop`, …)
      #   3) hard fallback to origin/main
      #
      # Escape hatches: set `branch.<name>.base` once (the hook tracks it
      # forever); in a genuine emergency, `git push --no-verify`.
      #
      # use_stdin: true is REQUIRED (Lefthook docs, pre-push `while read`
      # scripts): without it Lefthook closes stdin and `read` sees nothing.
      use_stdin: true
      run: |
        # Skip when no real push is happening (e.g. `lefthook run pre-push`
        # from a terminal): git always pipes ref data on stdin for a push.
        if [ -t 0 ]; then exit 0; fi

        # Never let a local object lookup demand-fetch from a promisor remote
        # (partial clone): that escapes the bounded reads below. Needs Git 2.45+.
        export GIT_NO_LAZY_FETCH=1

        # Read the pushed refs up front: ops/gigl-promote-record validation
        # must run even when the lookups below fail and skip the behind-base
        # check. A temp file (not a pipe) feeds the loops so they can report
        # failures. Fail closed: a failed mktemp or cat must not let the push
        # through unvalidated.
        refs_file=$(mktemp) || { echo '❌ Could not create temp file for pushed refs; refusing push.' >&2; exit 1; }
        trap 'rm -rf "$scratch"; rm -f "$refs_file"' EXIT
        scratch=$(mktemp -d) || { echo '❌ Could not create temp dir for the behind-base check; refusing push.' >&2; exit 1; }
        cat > "$refs_file" || { echo '❌ Could not read pushed refs; refusing push.' >&2; exit 1; }
        plan_file="$scratch/plan"; bases_file="$scratch/bases"; heads_file="$scratch/heads"
        : > "$plan_file"; : > "$bases_file"

        # Validate the operational tree before resolving the default branch:
        # the loud skips below must still refuse an invalid promote record.
        # Deleting THIS branch is refused (operational history must stay).
        promote_fail=0
        while IFS=' ' read -r _local_ref local_sha _remote_ref _remote_sha; do
          case "$_remote_ref" in
            refs/heads/ops/gigl-promote-record) ;;
            *) continue ;;
          esac
          case "$local_sha" in
            *[!0]*) ;;
            *)
              echo '❌ Refusing deletion of ops/gigl-promote-record; operational history must be preserved.' >&2
              promote_fail=1
              continue
              ;;
          esac
          if ! node ci_scripts/validate-promote-record.mjs "$local_sha" "$_remote_sha"; then
            promote_fail=1
          fi
        done < "$refs_file"

        # Git before 2.45 ignores GIT_NO_LAZY_FETCH, so in a partial clone a
        # local lookup of a missing base tip could demand-fetch with no time
        # limit: skip loudly there (under-block, but visible) rather than hang.
        if ! git --version | awk '{ split($3, v, "."); exit !(v[1] > 2 || (v[1] == 2 && v[2] >= 45)) }' \
          && { [ -n "$(git config --get extensions.partialclone 2>/dev/null)" ] \
            || git config --get-regexp '^remote\..*\.promisor$' 2>/dev/null | grep -q true; }; then
          echo "⚠️  Git older than 2.45 cannot disable lazy fetching in this partial clone, so a local"
          echo "    lookup could hang the push. Skipping behind-base check; upgrade Git to re-enable it."
          exit $promote_fail
        fi

        # Destination remote: Lefthook injects hook args through `{1}` (`$1`
        # is always empty here). An empty substitution falls back to `origin`;
        # an unsubstituted literal `{1}` fails the remote read below and
        # soft-skips (under-block, the right failure mode).
        remote="{1}"
        remote="${remote:-origin}"

        # Every remote read goes through bounded_ls_remote: a plain fetch or
        # ls-remote has no stall limit and hung pushes indefinitely.
        # http.lowSpeed* ends a stalled HTTP transfer; SSH gets connect and
        # keepalive timeouts unless GIT_SSH_COMMAND, GIT_SSH or core.sshCommand
        # is set (a developer's own transport is never overridden). Neither
        # covers DNS/TCP/TLS setup or a custom transport, so every read also
        # shares ONE hard deadline for the whole hook
        # (BACI_BEHIND_BASE_DEADLINE_SECONDS, default 30): SIGTERM to the read
        # and its descendants, SIGKILL 2s later even if git has exited by then.
        # At most two reads happen (default branch, then every base at once),
        # however many branches are pushed. GIT_TERMINAL_PROMPT=0 and a closed
        # stdin prevent prompts.
        deadline_secs=${BACI_BEHIND_BASE_DEADLINE_SECONDS:-30}
        case "$deadline_secs" in *[!0-9]*) deadline_secs=30 ;; esac
        # expr reads "08" as decimal 8; zero (or empty) means "use the default".
        deadline_secs=$(expr "$deadline_secs" + 0 2>/dev/null)
        [ "${deadline_secs:-0}" -gt 0 ] || deadline_secs=30
        deadline_at=$(( $(date +%s) + deadline_secs ))
        # pids of $1 plus every descendant, taken BEFORE killing (parent links
        # vanish after): git may run its transport through a wrapper shell.
        tree_pids() {
          ps -A -o pid= -o ppid= 2>/dev/null | awk -v root="$1" '
            { parent[$1] = $2 }
            END { keep[root] = 1; for (n = 0; n < 8; n++) for (p in parent) if (parent[p] in keep) keep[p] = 1; for (p in keep) print p }'
        }
        # bounded_ls_remote <outfile> <ls-remote args...>: non-zero when the
        # read failed or timed out (the outfile is then unusable).
        bounded_ls_remote() {
          out_path=$1; shift
          secs_left=$(( deadline_at - $(date +%s) ))
          [ "$secs_left" -gt 0 ] || return 124
          (
            if [ -z "${GIT_SSH_COMMAND:-}" ] && [ -z "${GIT_SSH:-}" ] && \
              [ -z "$(git config --get core.sshCommand 2>/dev/null)" ]; then
              export GIT_SSH_COMMAND='ssh -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=4'
            fi
            export GIT_TERMINAL_PROMPT=0
            exec git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \
              ls-remote "$@" > "$out_path" 2>/dev/null < /dev/null
          ) &
          ls_pid=$!
          rm -f "$scratch/timeout"
          (
            waited=0
            while [ "$waited" -lt "$secs_left" ]; do sleep 1; waited=$((waited + 1)); done
            : > "$scratch/timeout"
            victims=$(tree_pids "$ls_pid")
            kill -TERM $victims 2>/dev/null
            sleep 2
            kill -KILL $victims 2>/dev/null
          ) > /dev/null 2>&1 &
          guard_pid=$!
          wait "$ls_pid" 2>/dev/null
          ls_status=$?
          [ -e "$scratch/timeout" ] || kill "$guard_pid" 2>/dev/null
          wait "$guard_pid" 2>/dev/null
          return $ls_status
        }

        # Resolve the default branch once (self-skip check and base fallback;
        # hardcoding `main|master` misses `develop`, …): (1) local
        # `refs/remotes/<remote>/HEAD`, fast but can be MISSING (guessing `main`
        # then would silently disable the guard repo-wide); (2) the server's
        # answer via `ls-remote --symref`; (3) if both fail, a LOUD skip rather
        # than a guessed branch (under-block, but visible).
        default_branch=$(git symbolic-ref -q --short "refs/remotes/${remote}/HEAD" 2>/dev/null | sed "s|^${remote}/||")
        if [ -z "$default_branch" ] && bounded_ls_remote "$heads_file" --symref "$remote" HEAD; then
          default_branch=$(awk 'NR==1 && /^ref:/ { sub("^refs/heads/", "", $2); print $2; exit }' "$heads_file")
        fi
        if [ -z "$default_branch" ]; then
          echo "⚠️  Could not determine default branch for remote '$remote'."
          echo "    refs/remotes/${remote}/HEAD is unset (try \`git remote set-head $remote --auto\`)"
          echo "    AND \`git ls-remote --symref $remote HEAD\` failed (offline?)."
          echo "    Skipping behind-base check. Override per-branch with:"
          echo "      git config branch.<name>.base $remote/<your-base>"
          exit $promote_fail
        fi

        # Pass 1: pick the pushed branches to check and note each one's base,
        # so every base tip is read in a single bounded remote call.
        tab=$(printf '\t')
        while IFS=' ' read -r _local_ref local_sha _remote_ref _remote_sha; do
          # Skip ref deletions: the all-zero "hash" is 40 chars (SHA-1) or 64
          # (SHA-256), so match any length rather than a fixed width.
          case "$local_sha" in *[!0]*) ;; *) continue ;; esac

          # Resolve the branch from the REMOTE ref (the push destination).
          # <local-ref> may be any expression and differ from it: for `git push
          # origin main:feature-x` it would hit the default-branch skip below
          # and bypass the guard for feature-x. Non-branch refs (tags, notes)
          # are skipped: this guard only gates branch pushes.
          case "$_remote_ref" in
            refs/heads/*)
              branch="${_remote_ref#refs/heads/}"
              ;;
            *)
              continue
              ;;
          esac

          # The default branch is its own base.
          [ "$branch" = "$default_branch" ] && continue

          # Validated above; its separate history never compares to the base.
          [ "$branch" = "ops/gigl-promote-record" ] && continue

          base=$(git config "branch.$branch.base" 2>/dev/null || true)
          base=${base:-${remote}/${default_branch}}
          base_ref=${base#${remote}/}
          printf '%s\t%s\t%s\n' "$branch" "$local_sha" "$base" >> "$plan_file"
          grep -qxF -e "$base_ref" "$bases_file" || printf '%s\n' "$base_ref" >> "$bases_file"
        done < "$refs_file"

        # Read every distinct base tip at once (not `git fetch`, which
        # negotiates packs for 30s+ in this repo).
        if [ -s "$bases_file" ]; then
          set --
          while IFS= read -r base_ref; do set -- "$@" "refs/heads/$base_ref"; done < "$bases_file"
          if ! bounded_ls_remote "$heads_file" "$remote" "$@"; then
            echo "⚠️  Couldn't read the base branches from '$remote' (offline, or no answer within ${deadline_secs}s) — skipping behind-base check."
            exit $promote_fail
          fi
        fi

        # Pass 2: compare each branch with the SHA being pushed — NOT HEAD —
        # so cross-branch pushes work. A base tip that isn't present locally
        # cannot be an ancestor, so the branch is behind without a fetch.
        fail=0
        while IFS="$tab" read -r branch local_sha base; do
          base_ref=${base#${remote}/}
          base_sha=$(awk -v ref="refs/heads/$base_ref" '$2 == ref { print $1; exit }' "$heads_file")
          if [ -z "$base_sha" ]; then
            echo "⚠️  Couldn't find $base on '$remote' for '$branch' — skipping behind-base check."
            continue
          fi
          if git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$base_sha" "$local_sha" 2>/dev/null; then
              continue
            fi
            behind=$(git rev-list --count "$local_sha..$base_sha" 2>/dev/null || echo 1)
          else
            behind="an unknown number of"
          fi
          if [ -n "$behind" ] && [ "$behind" != "0" ]; then
            echo ""
            echo "❌ Branch '$branch' is $behind commit(s) behind $base."
            echo "   Fetch it first (this form also updates the $base ref):"
            echo "     git fetch $remote +refs/heads/$base_ref:refs/remotes/$remote/$base_ref"
            echo "   Then run one of:"
            echo "     git merge $base"
            echo "     git rebase $base"
            echo "   then push again."
            echo ""
            echo "   Branched off a non-default base? Set it once:"
            echo "     git config branch.$branch.base origin/<your-base>"
            echo ""
            echo "   To override (emergency): git push --no-verify"
            fail=1
          fi
        done < "$plan_file"

        if [ "$promote_fail" -ne 0 ]; then fail=1; fi

        exit $fail
