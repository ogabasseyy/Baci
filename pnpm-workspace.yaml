minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Security hotfixes released within the cooldown window; Dependabot alerts opened 2026-06-15.
  - ws@5.2.5 || 6.2.4 || 7.5.11 || 8.21.0
  - protobufjs@7.6.5
  - brace-expansion@5.0.9
  - js-yaml@4.3.0
  - shell-quote@1.9.0
  - body-parser@1.20.6 || 2.3.0
  - sharp@0.35.3
  - hono@4.12.34
  - '@hono/node-server@2.0.10'
  - fast-uri@3.1.5
  - linkify-it@5.0.2
  - dompurify@3.4.12
  - svgo@3.3.4
  - form-data@2.5.6 || 3.0.5 || 4.0.6
  - js-yaml@4.2.0
  - '@babel/core@7.29.6'
  # Security hotfixes released within the cooldown window; Dependabot alerts opened 2026-06-18.
  - ip-address@10.3.1
  - mermaid@11.16.1
  - postcss@8.5.23
  - dompurify@3.4.11
  # Security hotfixes released within the cooldown window; Dependabot alerts opened 2026-08-08.
  - nanoid@3.3.17 || 5.1.16
  - dompurify@3.4.13
  - js-yaml@4.3.1
  # Security hotfixes released within the cooldown window; Dependabot alerts opened 2026-10-01.
  - next@16.3.6
  - '@next/env@16.3.6'
# Refuse trust-signal downgrades; trustLockfile keeps already-locked entries installable.
trustPolicy: no-downgrade
trustLockfile: true
trustPolicyExclude:
  # Exact exceptions for deps locked before the trustPolicy override refresh.
  - '@react-native-firebase/app@23.8.8'
  - 'react-lite-youtube-embed@3.5.1'
  - 'ua-parser-js@0.7.41 || 1.0.41'
  - 'pino@9.14.0'
  - 'express-rate-limit@8.2.2'
  - 'reselect@5.1.1'
  - 'react-redux@9.2.0'
  - 'jose@4.15.9'
  - 'undici-types@6.21.0'
  - 'semver@6.3.1'
  - 'uuid@13.0.1'
  # CopilotKit @ag-ui/* packages lack CI provenance; verified publisher, not a swap.
  - '@ag-ui/langgraph@0.0.41'
  - '@ag-ui/a2ui-toolkit@0.0.3'
  - '@ag-ui/mcp-apps-middleware@0.0.3'
  - '@ag-ui/mcp-middleware@0.0.1'
# Workspace linkers & hoisting configurations for React Native/Expo in pnpm v11
nodeLinker: hoisted
shamefullyHoist: true
publicHoistPattern:
  - "*expo*"
  - "*react-native*"
networkTimeout: 1000000
strictDepBuilds: true
# Non-interactive: Codex/hooks have no TTY for hoisted node_modules rebuild prompts.
confirmModulesPurge: false

packages:
  - "apps/*"
  - "packages/*"
  - "apps/web/mcp-server/widgets"
# pnpm v11 allowBuilds (replaces onlyBuiltDependencies): package matcher -> boolean
allowBuilds:
  "@firebase/util": true
  "@posthog/cli": true
  "@scarf/scarf": true
  '@sentry/cli': true
  core-js: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  # Pin patched native deps to the exact package.json pnpm patch versions.
  react-native-purchases: "10.4.2"
  "@react-native-google-signin/google-signin": "16.1.2"
  lottie-react-native: "7.3.8"
  novel: "1.0.2"
  react-native-mmkv: "4.3.1"
  react-native-nitro-modules: "0.35.9"
  react-native-phone-number-input: "2.1.0"
  react-native-safe-area-context: "5.8.0"
  react-native-webview: "13.16.1"
  # --- Security / dedupe overrides ---
  # Pin to 6.1.6 to mitigate GHSA-737v-mqg7-c878 / CVE-2026-35209: replace the vulnerable transitive deep-merge helper.
  defu: "6.1.6"
  # Pin @xmldom/xmldom 0.8.15 for the Expo plist GHSA cluster (element/attribute/
  # DocType injection plus quadratic-time/memory parsing fixes).
  "@xmldom/xmldom": "0.8.15"
  follow-redirects: "^1.16.0"
  # Dedupe @types/react to avoid TS2769 dual-type errors under hoisted RN consumers.
  "@types/react": "19.2.17"
  # Dedupe @firebase/util (hoisted ENOENT race with dual database-compat consumers).
  "@firebase/util": "1.14.0"
  # Dedupe with @firebase/util — same reason.
  "@firebase/database-types": "1.0.17"
  # Dedupe with @firebase/util — same reason.
  "@firebase/database-compat": "2.1.1"
  # Pin smol-toml 1.9.0 for the malformed-TOML DoS advisory plus the
  # parseKey quadratic-time advisory (GHSA-r4xh-jqrq-34v2, knip transitive).
  smol-toml: "1.9.0"
  picomatch: ">=4.0.4"
  yaml: ">=2.8.3"
  # Pin esbuild 0.28 for path hardening / binary integrity.
  esbuild: "^0.28.1"
  # Pin to 0.35.4 to mitigate GHSA-f88m-g3jw-g9cj plus the libheif
  # GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545, and retain the corrected
  # TypeScript export map.
  sharp: "0.35.4"
  prismjs: "^1.30.0"
  # Pin qs 6.16.0 for GHSA-q8mj-m7cp-5q26 (comma-format arrays) plus the isBuffer
  # DoS and bracket-key array-limit bypass advisories.
  qs: "6.16.0"
  # Pin to 14.3.1 to mitigate GHSA-253c-mchw-3w2r (linkify quadratic
  # event-loop blocking) while staying on the Markdown-it 14 line.
  markdown-it: "14.3.1"
  "@modelcontextprotocol/sdk": "^1.25.2"
  # SDK 57 worklets 0.10.1; keep lockstep with react-native-reanimated (#2960).
  react-native-worklets: "0.10.1"
  # Pin to 4.13.7 for the parseBody nesting, fragment query-parser, toSSG
  # traversal, and boundary-component unescaped-string XSS advisories while
  # preserving Hono 4 compatibility.
  hono: "4.13.7"
  "@hono/node-server": "2.0.10"
  # Pin svgo 3.3.5 for the removeScripts executable-link/foreignObject bypasses.
  svgo: "3.3.5"
  linkify-it: "5.0.2"
  underscore: "^1.13.8"
  # Pin to 3.4.16 to mitigate GHSA-p98j-92pf-mc4p (IN_PLACE afterSanitize
  # hook DOM XSS) and prior DOMPurify advisories.
  dompurify: "3.4.16"
  # Pin to patched 7.x without forcing a cross-major Undici 8 upgrade.
  # 7.29.1 closes the GHSA-rfgv-xxqx-mfg5 WebSocket DoS, GHSA-w293-vg96-wgc3
  # BalancedPool TLS bypass, cookie-disclosure, retry-interceptor, and
  # decompression advisories.
  undici: "7.29.1"
  # Pin sanitize-html 2.17.7 for GHSA-rpr9-rxv7-x643 / CVE-2026-44990 (xmp passthrough)
  # plus the textarea allowedTags bypass and SVG SMIL scheme-policy XSS advisories.
  sanitize-html: "2.17.7"
  # Pin to 7.6.5 to close GHSA-j3f2-48v5-ccww / CVE-2026-59877 and prior 7.x CVEs while preserving the protobufjs 7 major.
  protobufjs: "7.6.5"
  # Pin @protobufjs/utf8 for GHSA-mm78-2hpw-9j97 (legacy protobufjs 6 transitive).
  "@protobufjs/utf8": "1.1.1"
  rollup: "^4.59.0"
  # Pin basic-ftp for GHSA-rpmf-866q-6p89 / CVE-2026-44240 (Lighthouse transitive).
  basic-ftp: "5.3.1"
  # Pin legacy AJV 6 consumers to 6.14.0 to mitigate GHSA-2g4f-4pwh-qvx6 without forcing AJV 8 into older consumers.
  "ajv@<6.14.0": "6.14.0"
  "glob@13": "13.0.6"
  minimatch: "10.2.3"
  # Pin older uuid consumers to 11.1.1 to mitigate GHSA-w5hq-g745-h8pq while staying on a CommonJS-compatible patched release.
  # Pin the minimatch transitive to the current patched 5.x release.
  # 5.0.12 closes the GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7 recursion
  # DoS and GHSA-q2hr-2g5m-vwhr quadratic-expansion advisories.
  "minimatch>brace-expansion": "5.0.12"
  # Pin vulnerable ws consumers to patched lines for GHSA-96hv-2xvq-fx4p / CVE-2026-48779 without forcing cross-major upgrades.
  "ws@>=5 <5.2.5": "5.2.5"
  "ws@>=6 <6.2.4": "6.2.4"
  "ws@>=7 <7.5.11": "7.5.11"
  "ws@>=8 <8.21.0": "8.21.0"
  h3: "1.15.9"
  tar: "^7.5.8"
  # Pin to the current patched 5.x release for GHSA-gh4j-gqv2-49f6 in XMLBuilder comment/CDATA serialization while keeping transitive feed and storage XML tooling on the patched major.
  fast-xml-parser: "5.9.0"
  # Pin fast-xml-builder for Dependabot #161/#162 (compatible with fast-xml-parser ^1.1.5).
  fast-xml-builder: "1.2.0"
  # AJV 8.x has no fast-uri peer constraint, so this exact patched pin is compatible.
  # 3.1.8 closes the GHSA-qw65-cvwx-89v3 authority injection, GHSA-58mr-gqgx-xq4g
  # host confusion, and GHSA-hrr3-gc8f-f4qj normalization advisories.
  fast-uri: "3.1.8"
  # Pin to 4.1.0 so Vitest 4.x can import isAgent from a compatible std-env release.
  std-env: "4.1.0"
  # Pin to 3.1.0 so Vitest 4.x consumers resolve a compatible color utility during CLI startup.
  tinyrainbow: "3.1.0"
  # Pin to the current patched 8.x release.
  postcss: "8.5.23"
  # Legacy uuid@<7 + Expo xcode CJS uuid@11.1.1 (avoid ESM require crashes).
  "uuid@<7": "11.1.1"
  # Pin older uuid consumers to 11.1.1 to mitigate GHSA-w5hq-g745-h8pq while staying on a CommonJS-compatible patched release.
  "uuid@>=7 <11.1.1": "11.1.1"
  "uuid@>=11 <11.1.1": "11.1.1"
  # Pin uuid 12.x consumers to 12.0.1 to mitigate GHSA-w5hq-g745-h8pq.
  "uuid@>=12 <12.0.1": "12.0.1"
  # Pin uuid 13.x consumers to 13.0.1 to mitigate GHSA-w5hq-g745-h8pq.
  "uuid@>=13 <13.0.1": "13.0.1"
  # Pin transitive Lighthouse/Puppeteer proxy tooling to the current patched release.
  # 10.7.1 closes the GHSA-j6r3-76f7-8jcv allowlist bypass, GHSA-h3mg-xc3c-68pw
  # parse-diagnostic DoS, and GHSA-rpw4-54j3-4h4q / GHSA-2vr4-cq9g-pvrc SSRF
  # trust-boundary advisories.
  ip-address: "10.7.1"
  # Keep every workspace package on the reviewed Next.js 16.3.6 release.
  # 16.3.6 closes GHSA-vcvr-r3jv-pc5j (critical RCE in next/og ImageResponse).
  next: "16.3.6"
  flatted: "3.4.2"
  lodash: "4.18.1"
  lodash-es: "4.18.1"
  diff: "^8.0.3"
  # SDK 57 alignment — keep in lockstep with react-native-worklets above.
  react-native-reanimated: "4.5.1"
  react-native-svg: "15.15.5"
  express-rate-limit: "8.2.2"
  # TipTap 3.x single instance for Novel/Puck + web editor (avoid mixed minors under hoist).
  # 3.30.5 closes the Markdown attribute ReDoS and mergeAttributes __proto__ advisories.
  "@tiptap/core": "3.30.5"
  "@tiptap/pm": "3.30.5"
  "@tiptap/react": "3.30.5"
  "@tiptap/starter-kit": "3.30.5"
  "@tiptap/suggestion": "3.30.5"
  "@tiptap/extensions": "3.30.5"
  "@tiptap/html": "3.30.5"
  "@tiptap/extension-blockquote": "3.30.5"
  "@tiptap/extension-bold": "3.30.5"
  "@tiptap/extension-bubble-menu": "3.30.5"
  "@tiptap/extension-bullet-list": "3.30.5"
  "@tiptap/extension-character-count": "3.30.5"
  "@tiptap/extension-code": "3.30.5"
  "@tiptap/extension-code-block": "3.30.5"
  "@tiptap/extension-code-block-lowlight": "3.30.5"
  "@tiptap/extension-color": "3.30.5"
  "@tiptap/extension-document": "3.30.5"
  "@tiptap/extension-dropcursor": "3.30.5"
  "@tiptap/extension-floating-menu": "3.30.5"
  "@tiptap/extension-gapcursor": "3.30.5"
  "@tiptap/extension-hard-break": "3.30.5"
  "@tiptap/extension-heading": "3.30.5"
  "@tiptap/extension-highlight": "3.30.5"
  "@tiptap/extension-horizontal-rule": "3.30.5"
  "@tiptap/extension-image": "3.30.5"
  "@tiptap/extension-italic": "3.30.5"
  "@tiptap/extension-link": "3.30.5"
  "@tiptap/extension-list": "3.30.5"
  "@tiptap/extension-list-item": "3.30.5"
  "@tiptap/extension-list-keymap": "3.30.5"
  "@tiptap/extension-ordered-list": "3.30.5"
  "@tiptap/extension-paragraph": "3.30.5"
  "@tiptap/extension-placeholder": "3.30.5"
  "@tiptap/extension-strike": "3.30.5"
  "@tiptap/extension-subscript": "3.30.5"
  "@tiptap/extension-superscript": "3.30.5"
  "@tiptap/extension-table": "3.30.5"
  "@tiptap/extension-table-cell": "3.30.5"
  "@tiptap/extension-table-header": "3.30.5"
  "@tiptap/extension-table-row": "3.30.5"
  "@tiptap/extension-task-item": "3.30.5"
  "@tiptap/extension-task-list": "3.30.5"
  "@tiptap/extension-text": "3.30.5"
  "@tiptap/extension-text-align": "3.30.5"
  "@tiptap/extension-text-style": "3.30.5"
  "@tiptap/extension-typography": "3.30.5"
  "@tiptap/extension-underline": "3.30.5"
  "@tiptap/extension-youtube": "3.30.5"
  # Pin axios 1.16.0 for the pre-1.15.1 advisory cluster.
  axios: "1.16.0"
  # Pin langsmith for GHSA-3644-q5cj-c5c7 without a broad CopilotKit upgrade.
  langsmith: "0.6.0"
  "@modelcontextprotocol/sdk>ajv": "^8.18.0"
  "expo-build-properties>ajv": "^8.18.0"
  "expo-dev-launcher>ajv": "^8.18.0"
  http-proxy-agent: "^7.0.2"
  unhead: "^2.1.13"
  "@unhead/vue": "^2.1.13"
  happy-dom: ">=20.8.8"
  node-forge: "1.4.0"
  path-to-regexp: ">=8.4.0"
  # Mermaid arrives transitively via streamdown; keep it on the current patched 11.x line.
  mermaid: "^11.16.1"
  # gRPC patched floors for GHSA-m9gg-hp2v-232j (getAuthContext certificate
  # confusion) and GHSA-f596-whhp-79r4 (method-handler error disclosure).
  # No patched 1.9-1.12 line exists, so the pre-1.13 consumer moves to the
  # first patched 1.13 release. That consumer is @firebase/firestore's ~1.9.0
  # spec, arriving via @react-native-firebase/app's firebase JS SDK, which no
  # workspace JS imports (RNFB is native-only: GoogleService configs, zero JS
  # firestore usage); the 1.x API is semver-stable regardless. The 1.14 line
  # is currently unoccupied (google-gax left with firebase-admin) but stays
  # pinned so a returning consumer cannot regress to a vulnerable minor.
  "@grpc/grpc-js@<1.13.6": "1.13.6"
  "@grpc/grpc-js@>=1.14.0 <1.14.5": "1.14.5"
  # google-gax: prefer patched grpc-js 1.14.x over the 1.10.x floor.
  "google-gax>@grpc/grpc-js": "1.14.5"
  # Pin to 1.9.0 to mitigate GHSA-395f-4hp3-45gv / CVE-2026-9277.
  shell-quote: "1.9.0"
  # Pin each body-parser major to its first patched release for GHSA-v422-hmwv-36x6.
  "body-parser@<2": "1.20.6"
  "body-parser@>=2 <2.3.0": "2.3.0"
  # Pin form-data patched lines for GHSA-hmw2-7cc7-3qxx / CVE-2026-12143.
  "form-data@<2.5.6": "2.5.6"
  "form-data@>=3 <3.0.5": "3.0.5"
  "form-data@>=4 <4.0.6": "4.0.6"
  # Pin to 4.3.2 to mitigate GHSA-5p4m-2wfm-xmqj, the maxTotalMergeKeys CPU advisory,
  # and prior js-yaml advisories.
  js-yaml: "4.3.2"
  # Nano ID: keep CJS 3.x for legacy consumers; pin other lines to advisory floors.
  "nanoid@<3.3.17": "3.3.17"
  "nanoid@>=4 <5.1.16": "5.1.16"
  # OpenTelemetry 2.8 line (core advisory; @vercel/otel >=2 peer).
  "@opentelemetry/core": "2.8.0"
  "@opentelemetry/resources": "2.8.0"
  "@opentelemetry/sdk-trace-base": "2.8.0"
  # Pin Babel 7 to the patched sourcemap handling release for GHSA-4x5r-pxfx-6jf8 / CVE-2026-49356.
  "@babel/core": "7.29.6"
  # Pin colord 2.9.4 for the malformed-color-string slow-rejection DoS advisory.
  colord: "2.9.4"
  # Pin phoenix 1.8.9 for the Presence Object.prototype key-collision advisory
  # (@copilotkit/core transitive).
  phoenix: "1.8.9"
  # Pin fflate 0.4.x to 0.4.9 for the malformed-ZIP64 infinite-loop advisory
  # (posthog-js transitive); 0.8.x line is unaffected.
  "fflate@>=0.4.5 <0.4.9": "0.4.9"
  # Pin jsondiffpatch 0.7.6 for the patch-API prototype-pollution advisory
  # (@ai-sdk/rsc transitive).
  jsondiffpatch: "0.7.6"
  # Pin each @ai-sdk/provider-utils major to its first patched release for the
  # uncontrolled-resource-consumption advisory.
  "@ai-sdk/provider-utils@>=3 <3.0.28": "3.0.28"
  "@ai-sdk/provider-utils@>=4 <4.0.33": "4.0.33"
  # Pin @fastify/busboy 3.2.2 for CVE-2026-19481 / CVE-2026-19484 /
  # CVE-2026-74866 (CRLF injection via Content-Disposition filename/name).
  # (@whatwg-node/node-fetch transitive).
  "@fastify/busboy": "3.2.2"
  # Pin @a2ui/web_core 0.10.2 for CVE-2026-10032
  # (@copilotkit/a2ui-renderer transitive).
  "@a2ui/web_core": "0.10.2"
  # Pin prosemirror-view 1.42.3 for the paste-handling XSS
  # (CVE-2026-104847, @tiptap/pm transitive).
  prosemirror-view: "1.42.3"
  # Align prosemirror-model to 1.25.11 (the version view 1.42.3 resolves):
  # without this, state/commands/tables/etc. stay on 1.25.8 and the editor
  # graph loads two model runtimes, tripping cross-version instanceof
  # RangeErrors when nodes pass between packages (tiptap#577).
  prosemirror-model: "1.25.11"
  # Pin fast-copy 3.1.0 for the deeply-nested stack-exhaustion advisory
  # (GHSA-jggr-w7fw-pc2j, pino-pretty transitive).
  fast-copy: "3.1.0"
  # Pin compression 1.8.2 for CVE-2026-87776 (premature-close memory-leak
  # DoS, @expo/cli transitive).
  compression: "1.8.2"
  # Pin proxy-addr 2.0.8 for CVE-2026-90711 (IPv4-mapped IPv6 trust-subnet
  # IP spoofing, express transitive).
  proxy-addr: "2.0.8"
  # Pin source-map-js 1.2.2 for CVE-2026-93749 (indexed section-offset
  # event-loop DoS, @tailwindcss/node transitive).
  source-map-js: "1.2.2"
patchedDependencies:
  # Backport the upstream 0.5.0 linear-time fallback decoder to CJS 0.2.2: fixes the
  # exponential-decoding DoS while keeping query-string@7 (expo-router) compatible.
  # Upstream 0.5.0 is ESM-only and breaks query-string's require() call.
  decode-uri-component@0.2.2: patches/decode-uri-component@0.2.2.patch
  "@react-native-community/datetimepicker@9.1.0": "patches/@react-native-community/datetimepicker@9.1.0.patch"
  "@react-native-google-signin/google-signin@16.1.2": "patches/@react-native-google-signin/google-signin@16.1.2.patch"
  "lottie-react-native@7.3.8": "patches/lottie-react-native@7.3.8.patch"
  "metro-runtime@0.84.4": "patches/metro-runtime@0.84.4.patch"
  "metro@0.84.4": "patches/metro@0.84.4.patch"
  "novel@1.0.2": "patches/novel@1.0.2.patch"
  "react-native-mmkv@4.3.1": "patches/react-native-mmkv@4.3.1.patch"
  "react-native-nitro-modules@0.35.9": "patches/react-native-nitro-modules@0.35.9.patch"
  "react-native-phone-number-input@2.1.0": "patches/react-native-phone-number-input@2.1.0.patch"
  "react-native-purchases@10.4.2": "patches/react-native-purchases@10.4.2.patch"
  "react-native-safe-area-context@5.8.0": "patches/react-native-safe-area-context@5.8.0.patch"
  "react-native-webview@13.16.1": "patches/react-native-webview@13.16.1.patch"
  react-native@0.86.2: patches/react-native@0.86.2.patch
  "react-native-fbsdk-next@13.4.3": "patches/react-native-fbsdk-next@13.4.3.patch"
  # expo-modules-jsi@57.0.5: drop SWIFT_RETURNS_RETAINED on RuntimeScheduler (Xcode 26.2).
  "expo-modules-jsi@57.0.5": "patches/expo-modules-jsi@57.0.5.patch"
  # expo-modules-core@57.0.12: backport upstream SDK 58 NonisolatedUnsafeWeakVar
  # fix for the EventEmitter.swift data-race error under Xcode 26 complete
  # checking (SWIFT_STRICT_CONCURRENCY is ignored in Swift 6 language mode).
  "expo-modules-core@57.0.12": "patches/expo-modules-core@57.0.12.patch"
  image-size@1.2.1: patches/image-size@1.2.1.patch
  "next@16.3.6": "patches/next@16.3.6.patch"
  '@supabase/auth-js@2.108.2': patches/@supabase__auth-js@2.108.2.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  # Backport the upstream 7.1.6 Set-based membership tests to 6.0.10: fixes
  # the flat-selector quadratic CPU-exhaustion DoS (GHSA-rj75-hqrm-r3gf) while
  # keeping @tailwindcss/typography's exact 6.0.10 dependency.
  postcss-selector-parser@6.0.10: patches/postcss-selector-parser@6.0.10.patch
