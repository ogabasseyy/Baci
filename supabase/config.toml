[auth]
# Hosted Auth config snapshot read through the Supabase Management API on
# 2026-06-23. This file documents local parity only; do not run
# `supabase config push` without proving a no-op diff against hosted config.
enabled = true
site_url = "https://usebaci.com"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/reset-password",
  "https://usebaci.com/auth/callback",
  "https://*.usebaci.com/auth/callback",
  "https://baci-basseys-projects-d7395611.vercel.app/",
  "https://baci-basseys-projects-d7395611.vercel.app/**",
  "https://baci-*-basseys-projects-d7395611.vercel.app",
  "https://baci-*-basseys-projects-d7395611.vercel.app/**",
  "https://ogabassey.com/**",
  "https://www.ogabassey.com/**",
  "https://usebaci.com/reset-password",
  "https://baci-ogabasseyy-basseys-projects-d7395611.vercel.app/",
  "https://baci-ogabasseyy-basseys-projects-d7395611.vercel.app/**",
  "https://baci-*-ogabasseyy-basseys-projects-d7395611.vercel.app",
  "https://baci-*-ogabasseyy-basseys-projects-d7395611.vercel.app/**",
  "https://ogabassey.com/account/callback",
  "ogabassey://auth/callback/",
  "ogabassey://auth/callback",
  "ogabassey://**",
  "com.ogabassey.store://auth/callback",
  "com.ogabassey.store://**",
  "https://*.usebaci.com/account/verify",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
otp_expiry = 3600

[auth.rate_limit]
email_sent = 30
token_refresh = 150
token_verifications = 30

[auth.captcha]
enabled = false
provider = "hcaptcha"

[auth.passkey]
enabled = false

[functions.send-auth-email]
verify_jwt = false

# Legacy endpoint is inert (HTTP 410); no request can send mail.
[functions.send-welcome-email]
verify_jwt = true
