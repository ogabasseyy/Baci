# PiggyVest egress relay: public TLS front for the loopback relay service.
# Install as /etc/nginx/sites-available/pv-egress.usebaci.com (symlink into
# sites-enabled). Replace the hostname if the owner picks another one; DNS
# for it must point at this VPS (82.29.190.219). Never reuse another vhost.
#
# Deliberate choices:
#  - access_log off: request lines carry wallet ids, references and account
#    numbers in query strings, which must not be written to disk.
#  - error_log /dev/null crit: nginx logs `request: "GET /path?query"` for
#    upstream failures (relay down), which would write the same query strings
#    to disk. Only critical errors are kept, and none carry request lines.
#  - proxy_pass has no URI part, so nginx hands the relay the request target
#    exactly as received; the HMAC signs that exact string.
#  - proxy_next_upstream off: nginx must never replay a POST on its own.
#  - only /api/v1/ is proxied; everything else is 404 at nginx.
server {
    listen 80;
    server_name pv-egress.usebaci.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pv-egress-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 444; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pv-egress.usebaci.com;
    ssl_certificate /etc/letsencrypt/live/pv-egress.usebaci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pv-egress.usebaci.com/privkey.pem;
    if ($ssl_server_name != pv-egress.usebaci.com) { return 444; }

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:18910;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_next_upstream off;
        proxy_buffering off;
        # Above the relay's own 35s upstream timeout so its 504 reaches Vercel.
        proxy_connect_timeout 5s;
        proxy_send_timeout 40s;
        proxy_read_timeout 40s;
    }

    location / { return 404; }
}
